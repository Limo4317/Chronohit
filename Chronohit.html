    showExitDialog: false,
    bonusClaimed: false,
    guess: { t:"", a:"", y:"" },
    guessResult: null,
    pendingSpend: null,
    saveSlotDialogOpen: false,
    saveNameDraft: "",
    confirmDeleteSlot: null,
    openSlotSettings: null,
    infoOpen: null,
    activeSlot: null,
    activeSaveName: "",
    confirmOverwriteSave: false,
    confirmDeleteOnFinish: false,
    skippedInfo: null,
    wrongSongs: [],
    showWrongOnTimeline: false,
    players,
    currentPlayer: 0,
    winners: [],
    playersDrawerOpen: false,
    openPlayerPanels: []
  };
  drawNext();
  saveState();
  render();
}

/* ============ MEHRSPIELER (lokal) ============
   Die Top-Level-Felder (timeline, tokens, correctCount, wrongCount,
   wrongSongs) gehören immer dem Spieler, der gerade am Zug ist. Beim
   Zugwechsel werden sie in den Spieler-Eintrag zurückgeschrieben und die
   des nächsten Spielers geladen. So bleibt die gesamte Einzelspieler-Logik
   unverändert nutzbar.
*/
function isMulti(){
  return state.settings.mode === "multiplayer" && Array.isArray(state.players) && state.players.length > 0;
}
function syncActiveToPlayer(){
  if(!isMulti()) return;
  const p = state.players[state.currentPlayer];
  p.timeline = state.timeline;
  p.tokens = state.tokens;
  p.correctCount = state.correctCount;
  p.wrongCount = state.wrongCount;
  p.wrongSongs = state.wrongSongs || [];
}
function loadActiveFromPlayer(){
  const p = state.players[state.currentPlayer];
  state.timeline = p.timeline;
  state.tokens = p.tokens;
  state.correctCount = p.correctCount;
  state.wrongCount = p.wrongCount;
  state.wrongSongs = p.wrongSongs || [];
}
// Aktueller Stand eines Spielers (der aktive kommt aus den Top-Level-Feldern)
function playerView(i){
  const p = state.players[i];
  if(i === state.currentPlayer){
    return { name:p.name, timeline:state.timeline, tokens:state.tokens,
             correctCount:state.correctCount, wrongCount:state.wrongCount,
             wrongSongs:state.wrongSongs || [] };
  }
  return p;
}
function currentPlayerName(){ return isMulti() ? state.players[state.currentPlayer].name : ""; }
function nextPlayerIndex(){ return (state.currentPlayer + 1) % state.players.length; }
function advancePlayer(){
  syncActiveToPlayer();
  state.currentPlayer = nextPlayerIndex();
  loadActiveFromPlayer();
}
function finalizeMultiplayer(){
  if(!isMulti()) return;
  syncActiveToPlayer();
  const counts = state.players.map(p => p.correctCount);
  const max = Math.max(...counts);
  state.winners = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  state.won = true;
}

/* ============ SPOTIFY IFRAME API ============
   Offizielle Embed-Steuerung (kein Login nötig): erlaubt Play/Pause
   programmatisch auszulösen und liefert echte Wiedergabe-Events
   (Position/Dauer) -> der Embed bleibt komplett unsichtbar, der Vinyl-
   Klick startet wirklich die Wiedergabe, und der Fortschrittsbalken ist
   echt statt geraten.
   Fällt automatisch auf den sichtbaren Zuschnitt-Player zurück, falls die
   API blockiert wird (z.B. Adblocker) oder nicht rechtzeitig lädt.
*/
let spotifyController = null;
let spotifyApiObj = null;
let spotifyPendingUri = null;
let spotifyWatchdogStarted = false;
let useFallbackEmbed = false;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  spotifyApiObj = IFrameAPI;
  if(spotifyPendingUri){
    createSpotifyController(spotifyPendingUri);
    spotifyPendingUri = null;
  }
};

function createSpotifyController(uri){
  if(!spotifyApiObj || spotifyController) return;
  const el = document.getElementById('spotify-embed-root');
  if(!el) return;
  spotifyApiObj.createController(el, {uri, width:'300', height:'80'}, (controller) => {
    spotifyController = controller;
    controller.addListener('ready', () => {
      try{ controller.play(); }catch(e){}
    });
    controller.addListener('playback_update', e => {
      onSpotifyPlaybackUpdate(e.data);
    });
  });
}

function onSpotifyPlaybackUpdate(data){
  const fill = document.getElementById('live-progress-fill');
  if(fill && data && data.duration){
    const pct = Math.max(0, Math.min(100, (data.position / data.duration) * 100));
    fill.style.width = pct + '%';
  }
}

function requestSpotifyPlay(song){
  if(useFallbackEmbed) return;
  const uri = 'spotify:track:' + song.id;
  if(spotifyController){
    spotifyController.loadUri(uri);
    setTimeout(() => { try{ spotifyController.play(); }catch(e){} }, 150);
  } else if(spotifyApiObj){
    createSpotifyController(uri);
  } else {
    spotifyPendingUri = uri;
  }
  if(!spotifyWatchdogStarted){
    spotifyWatchdogStarted = true;
    setTimeout(() => {
      if(!spotifyController){
        useFallbackEmbed = true;
        render();
      }
    }, 4000);
  }
}

// Verwirft den (unsichtbaren) Spotify-Player komplett und baut ihn neu auf.
// Läuft der Song gerade (Karte gezogen und abgespielt), startet er direkt wieder.
function reloadPlayer(){
  const song = state.current;
  try{ if(spotifyController) spotifyController.destroy(); }catch(e){}
  spotifyController = null;
  spotifyPendingUri = null;
  const host = document.getElementById("spotify-embed-host");
  if(host) host.innerHTML = '<div id="spotify-embed-root"></div>';
  // API-Modus erneut versuchen, auch wenn vorher auf den sichtbaren Player zurückgefallen wurde
  useFallbackEmbed = false;
  spotifyWatchdogStarted = false;
  const wasStarted = state.phase === "placing" || state.phase === "revealed_pending";
  render();   // setzt auch den Fortschrittsbalken zurück
  if(wasStarted && song && song.id){ requestSpotifyPlay(song); }
}

function toggleSpotifyPlayback(){
  if(!spotifyController || useFallbackEmbed) return;
  try{ spotifyController.togglePlay(); }catch(e){}
}

function pauseSpotifyPlayback(){
  if(spotifyController){ try{ spotifyController.pause(); }catch(e){} }
}

function reshuffleIfNeeded(){
  // Verworfene Karten bleiben dauerhaft draußen (wie im echten Hitster) —
  // kein Nachmischen mehr, sonst wird der Stapel praktisch nie leer und
  // die Niederlage (leerer Stapel) ist so gut wie unerreichbar.
}

const HC_MULT = { normal:1, pro:1.5, expert:2 };
function handicapScore(p){ return p.correctCount * (HC_MULT[p.diff || "normal"] || 1); }
function applyHandicap(){
  const st = state.settings; if(!st || !st.handicap || !state.players || !state.players[state.currentPlayer]) return;
  st.difficulty = state.players[state.currentPlayer].diff || "normal";
}
function hcApplyLocal(w){
  const map = {}; (w.playerNames || []).forEach((n, i) => { map[(n || "").trim() || "Spieler " + (i + 1)] = (w.playerDiff || [])[i] || "normal"; });
  state.players.forEach(p => { p.diff = map[p.name] || "normal"; }); applyHandicap();
}
function hcApplyNet(){ state.players.forEach((p, i) => { const q = NET.seats[i]; p.diff = (q && q.diff) || "normal"; }); applyHandicap(); }
function hcEndHtml(){
  if(!state.settings.handicap || !state.players) return "";
  const L = { normal:"Normal", pro:"Profi ×1,5", expert:"Experte ×2" };
  return `<div style="width:100%;text-align:left;margin:6px 0;"><b>Handicap-Wertung</b>${state.players.slice().sort((a, b) => handicapScore(b) - handicapScore(a)).map(p => `<div>${esc(p.name)}: ${p.correctCount} Karten (${L[p.diff || "normal"]}) = <b>${handicapScore(p)}</b> Punkte</div>`).join("")}</div>`;
}
function drawNext(){
  applyHandicap();
  pauseSpotifyPlayback();
  state.skippedInfo = null;
  if(state.settings.mode === "coop" && state.tokens <= 0){
    state.current = null;
    state.won = false;
    state.screen = "end";
    return;
  }
  reshuffleIfNeeded();
  if(state.deck.length === 0){
    state.current = null;
    state.phase = "empty";
    state.won = false;
    if(isMulti()) finalizeMultiplayer();
    state.screen = "end";
    return;
  }
  state.current = state.deck.shift();
  state.turnNo = (state.turnNo || 0) + 1;
  state.challenge = null; state.autoRevealed = false;
  state.phase = "draw";
  state.pendingGap = null;
  state.turnDeadline = null; state.chDeadline = null;
  state.lastResult = null;
  state.bonusClaimed = false;
  state.guess = { t:"", a:"", y:"" };
  state.guessResult = null;
}

function playCurrent(){
  if(!state.current) return;
  if(state.settings.variant === "blitz" && !state.blitzEnd) state.blitzEnd = Date.now() + (state.settings.blitzSec || 60) * 1000;
  state.phase = "placing";
  state.turnDeadline = turnLimitMs() > 0 ? Date.now() + turnLimitMs() : null;
  turnLastTick = Date.now();
  turnLastSec = turnLimitMs() > 0 ? Math.round(turnLimitMs() / 1000) : null;
  render(); saveState();
  if(state.current.id){
    if(!useFallbackEmbed){
      requestSpotifyPlay(state.current);
    }
    // im Fallback-Modus übernimmt der sichtbare zugeschnittene Player (siehe render())
  } else if(!NET.bypass){
    window.open(spotifySearchUrl(state.current), "_blank", "noopener");
  }
}

function requestSkip(){
  if(state.tokens < 1 || !state.current) return;
  state.pendingSpend = {type:"skip", amount:1};
  render();
}
function requestBuy(){
  if(state.tokens < 3 || !state.current) return;
  state.pendingSpend = {type:"buy", amount:3};
  render();
}
function cancelSpend(){
  state.pendingSpend = null;
  render();
}
function confirmSpend(){
  const p = state.pendingSpend;
  state.pendingSpend = null;
  if(!p) return;
  if(p.type === "skip") doSkipWithToken();
  else if(p.type === "buy") doBuyWithTokens();
}

function doSkipWithToken(){
  if(state.tokens < 1 || !state.current) return;
  const skipped = state.current;
  state.tokens -= 1;
  sfx("spend");
  state.discard.push(skipped);
  chronicleAdd({ n: state.turnNo || 0, p: chroName(), t: skipped.t, a: skipped.a, y: skipped.y, k: "skip", c: "" });
  drawNext();
  // Nach drawNext setzen (drawNext leert den Hinweis), damit er bei der neuen Karte erscheint
  state.skippedInfo = { t: skipped.t, a: skipped.a, y: skipped.y };
  render(); saveState();
}

function doBuyWithTokens(){
  if(state.tokens < 3 || !state.current) return;
  state.tokens -= 3;
  sfx("spend");
  // Gekaufte Karte: garantiert korrekt, wird automatisch chronologisch einsortiert
  const song = state.current;
  let idx = state.timeline.findIndex(c => c.y > song.y);
  if(idx === -1) idx = state.timeline.length;
  state.timeline.splice(idx, 0, song);
  state.correctCount += 1;
  chronicleAdd({ n: state.turnNo || 0, p: chroName(), t: song.t, a: song.a, y: song.y, k: "buy", c: "" });
  checkWin();
  if(state.screen === "game"){ drawNext(); }
  render(); saveState();
}

function changePosition(){
  sfx("unplace");
  state.phase = "placing";
  render();
}
function chooseGap(gapIndex){
  if(state.phase !== "placing") return;
  sfx("place");
  state.pendingGap = gapIndex;
  state.phase = "revealed_pending";
  render(); saveState();
}

function isPlacementCorrect(song, gapIndex){
  const left = state.timeline[gapIndex - 1];
  const right = state.timeline[gapIndex];
  if(left && song.y < left.y) return false;
  if(right && song.y > right.y) return false;
  /* "Exaktes Jahr bei Gleichstand" – vorerst deaktiviert.
     War als Zeile unten ohnehin ein No-Op (Bug), da sie so oder so auf
     "return true" hinauslief. Zwei mögliche echte Umsetzungen für später:

     A) Pro-Modus (näher am echten Hitster): Nach dem Platzieren muss
        zusätzlich das exakte Jahr eingegeben werden. Nur richtige Position
        UND richtiges Jahr zählt als Treffer – spürbar schwerer als reines
        chronologisches Einsortieren.

     B) Reine Gleichstand-Regel: Nur wenn eine neue Karte exakt dasselbe
        Jahr wie eine direkt benachbarte Karte auf der Zeitleiste hat, wird
        eine strengere Sonderprüfung angewendet. Ändert im Normalfall
        (unterschiedliche Jahre) nichts am Verhalten.

     if(state.settings.strictYear && left && song.y === left.y) return true;
  */
  return true;
}

function computeGuessCheck(song){
  const said = {
    t:(state.guess.t||"").trim(),
    a:(state.guess.a||"").trim(),
    y:(state.guess.y||"").trim()
  };
  const titleOk  = said.t ? fuzzyMatch(said.t, titleVariants(song.t))  : false;
  const artistOk = said.a ? fuzzyMatch(said.a, artistVariants(song.a)) : false;
  const yearOk   = said.y !== "" ? (Math.abs(parseInt(said.y, 10) - song.y) <= Math.max(0, Math.min(5, (state.settings.yearTol | 0)))) : false;
  return { said, titleOk, artistOk, yearOk, both: titleOk && artistOk };
}

/* ============ CHRONOHIT!-RUF (Einspruch) ============
   Nur Mehrspieler mit Token-Einstellung. Vor dem Aufdecken kann ein Gegner mit einem Token "Chronohit!" rufen
   und die Lücke wählen, wo die Karte seiner Meinung nach hingehört. Nur ein Einspruch pro Zug (der Erste).
   Liegt der Aktive falsch und der Rufer richtig, bekommt der Rufer die Karte. Der Token ist immer weg.
   Kein Timer: der aktive Spieler (online auch der Host) beendet das Fenster. */
function challengeEnabled(){
  return isMultiRound() && state.settings.mode === "multiplayer" && !!state.settings.challenge && !!state.settings.tokens;
}
function challengeEligible(i){
  if(i === state.currentPlayer || !state.players[i]) return false;
  if(playerView(i).tokens < 1) return false;
  if(state.online && state.net && !(state.net.seats[i] && state.net.seats[i].connected)) return false;
  return true;
}
function challengeCallers(){ return state.players.map((_, i) => i).filter(challengeEligible); }
function callChallenge(i){
  if(state.phase !== "challenge" || !state.challenge || state.challenge.caller != null) return;
  if(!challengeEligible(i)) return;
  state.players[i].tokens -= 1;
  state.challenge = { caller: i, gap: null };
  state.chDeadline = chNewDeadline(true);
  sfx("call");
  render(); saveState();
}
function chooseChallengeGap(g){
  const ch = state.challenge;
  if(state.phase !== "challenge" || !ch || ch.caller == null) return;
  if(!Number.isInteger(g) || g < 0 || g > state.timeline.length || g === state.pendingGap) return;
  ch.gap = g;
  sfx("place");
  render(); saveState();
}
function cancelChallenge(){
  const ch = state.challenge;
  if(state.phase !== "challenge" || !ch || ch.caller == null) return;
  state.players[ch.caller].tokens += 1;               // Einspruch zurückgezogen: Token kommt zurück
  state.challenge = { caller: null, gap: null };
  sfx("unplace");
  render(); saveState();
}
function abortChallenge(){
  const ch = state.challenge;
  if(ch && ch.caller != null && state.players[ch.caller]) state.players[ch.caller].tokens += 1;
  state.challenge = null; state.chDeadline = null;
}
function resolveChallenge(){
  const ch = state.challenge;
  if(state.phase !== "challenge" || !ch) return;
  if(ch.caller != null && ch.gap == null) return;     // erst Lücke wählen oder Einspruch zurückziehen
  state.phase = "revealed_pending";
  doReveal();
}
function challengeZoneHtml(){
  const ch = state.challenge || { caller: null, gap: null };
  const online = !!state.online;
  const mySeat = online ? netMyTeam() : -1;
  const modOk = !online || netMyTurn() || NET.role === "host";       // aktiver Spieler oder Host (lokal: jeder am Gerät)
  const iAmCaller = ch.caller != null && (!online || ch.caller === mySeat);
  const name = ch.caller != null ? esc(state.players[ch.caller].name) : "";
  let h = `<div class="ch-box"><div class="ch-title">⚡ Chronohit!-Einspruch?</div>${chTimerHtml()}`;
  if(ch.caller == null){
    const eligible = challengeCallers();
    h += `<div class="draw-caption">Glaubst du, die Karte liegt falsch? Ruf „Chronohit!“ (1 ${icon('token')}) und wähle die Lücke, wo sie deiner Meinung nach hingehört.</div>`;
    if(!online){
      h += `<div class="ch-chips">${eligible.map(i => `<button class="btn-ghost btn-small" onclick="callChallenge(${i})">${esc(state.players[i].name)} ruft Chronohit! (${playerView(i).tokens} ${icon('token')})</button>`).join("")}</div>`;
    } else if(eligible.includes(mySeat)){
      h += `<button class="btn-primary" onclick="callChallenge(${mySeat})">Chronohit! rufen (1 ${icon('token')})</button>`;
    } else if(mySeat !== state.currentPlayer){
      h += `<div class="draw-caption">${NET.spec ? 'Du schaust zu.' : 'Du hast keinen Token für einen Einspruch.'}</div>`;
    } else {
      h += `<div class="draw-caption">Die anderen können jetzt Einspruch erheben …</div>`;
    }
    if(modOk) h += `<button class="btn-primary" onclick="resolveChallenge()">Niemand ruft – aufdecken</button>`;
  } else {
    h += `<div class="ch-banner"><b>${name}</b> ruft Chronohit!</div>`;
    if(ch.gap == null) h += `<div class="draw-caption">${iAmCaller ? 'Tippe auf der Zeitleiste die Lücke an, wo die Karte deiner Meinung nach hingehört.' : name + ' wählt eine Lücke …'}</div>`;
    else h += `<div class="draw-caption">${name} glaubt: Die Karte gehört an die mit ⚡ markierte Stelle.${iAmCaller ? ' Du kannst noch eine andere Lücke antippen.' : ''}</div>`;
    h += `<div class="ch-chips">`;
    if(modOk && ch.gap != null) h += `<button class="btn-primary" onclick="resolveChallenge()">Aufdecken</button>`;
    if(modOk || iAmCaller) h += `<button class="btn-ghost btn-small" onclick="cancelChallenge()">Einspruch zurückziehen</button>`;
    h += `</div>`;
  }
  return h + `</div>`;
}
function challengeResultHtml(r){
  const c = r.challenge;
  const nm = esc((state.players[c.caller] || {}).name || "?");
  const txt = c.success ? `erfolgreich — ${nm} bekommt die Karte!`
    : (r.positionOk ? `erfolglos — die Karte lag richtig, der Token ist weg.` : `erfolglos — auch die Lücke von ${nm} war falsch, der Token ist weg.`);
  return `<div class="ch-result ${c.success ? 'ok' : 'bad'}">⚡ Chronohit! von ${nm}: ${txt}</div>`;
}
function revealCard(){
  if(state.phase !== "revealed_pending") return;
  if(challengeEnabled() && challengeCallers().length){
    state.phase = "challenge";
    state.challenge = { caller: null, gap: null };
    state.chDeadline = chNewDeadline(false);
    render(); saveState();
    return;
  }
  doReveal();
}
function doReveal(){
  if(state.phase !== "revealed_pending") return;
  state.chDeadline = null;
  pauseSpotifyPlayback();
  const song = state.current;
  const gapIndex = state.pendingGap;
  const positionOk = isPlacementCorrect(song, gapIndex);
  const diff = state.settings.difficulty;
  const guessCheck = computeGuessCheck(song);

  let ok = positionOk;
  if(diff === "pro"){
    ok = positionOk && guessCheck.titleOk && guessCheck.artistOk;
  } else if(diff === "expert"){
    ok = positionOk && guessCheck.titleOk && guessCheck.artistOk && guessCheck.yearOk;
  }

  statsAddTurn(ok, false);
  if(ok){
    state.timeline.splice(gapIndex, 0, song);
    state.correctCount += 1;
  } else {
    state.discard.push(song);
    state.wrongCount += 1;
    if(!state.wrongSongs) state.wrongSongs = [];
    state.wrongSongs.push(song);
    if(state.settings.mode === "coop"){
      state.tokens = Math.max(0, state.tokens - 1);
    }
  }

  // Chronohit!-Einspruch auswerten: nur die Position zählt
  let chResult = null;
  const chState = state.challenge;
  if(chState && chState.caller != null && chState.gap != null && state.players[chState.caller]){
    const chOk = !positionOk && isPlacementCorrect(song, chState.gap);
    chResult = { caller: chState.caller, gap: chState.gap, success: chOk };
    if(chOk){
      const ctl = state.players[chState.caller].timeline;
      let idx = ctl.findIndex(c => c.y > song.y);
      if(idx < 0) idx = ctl.length;
      ctl.splice(idx, 0, song);
      state.players[chState.caller].correctCount += 1;
    }
    statsTouch();
    if(!stats.ruf) stats.ruf = { won: 0, lost: 0 };
    if(chOk) stats.ruf.won += 1; else stats.ruf.lost += 1;
    { const yr = yearStat().ruf; if(chOk) yr.won += 1; else yr.lost += 1; }
    saveStats();
  }
  state.challenge = null;

  // Bonus-Chrono-Token fürs richtige Titel/Interpret-Raten — gilt in JEDEM
  // Modus, auch in Profi/Experte, wo das Raten ohnehin Pflicht fürs
  // Zählen der Karte ist. Ein Treffer verdient den Token trotzdem.
  let bonusAwarded = false;
  if(state.settings.tokens && state.settings.mode !== "coop" && guessCheck.both && !state.bonusClaimed){
    state.bonusClaimed = true;
    if(state.tokens < state.settings.maxTokens){
      state.tokens += 1;
      bonusAwarded = true;
    }
  }

  // Sounds: Aufdecken-Flip, dann Ergebnis; Bonus-Token und Serien-Fanfare etwas später
  sfx("flip");
  sfx(ok ? "correct" : "wrong", 0.14);
  let sfxLate = 0.6;
  if(bonusAwarded){ sfx("token", sfxLate); sfxLate += 0.45; }
  if(ok && !isMultiRound() && (stats.curStreak === 3 || stats.curStreak === 5 || (stats.curStreak > 5 && stats.curStreak % 5 === 0))){
    sfx("streak", sfxLate);
  }
  if(chResult && chResult.success) sfx("steal", sfxLate);
  state.lastResult = { ok, song, positionOk, guessCheck, difficulty: diff, bonusAwarded, autoRevealed: autoRevealFlag || !!state.autoRevealed, challenge: chResult, ts: Date.now() };
  chronicleAdd({ n: state.turnNo || 0, p: chroName(), t: song.t, a: song.a, y: song.y, k: state.lastResult.ok ? "ok" : "wrong", g: chronGuess(),
    c: chResult && chResult.caller != null && state.players && state.players[chResult.caller] ? state.players[chResult.caller].name + (chResult.success ? " ⚡ Einspruch gewonnen" : " ⚡ Einspruch verloren") : "" });
  state.autoRevealed = false;
  state.guessResult = null;
  state.guess = { t:"", a:"", y:"" };

  state.phase = "feedback";
  render(); saveState();
  if(!checkWin()) autoSaveTurn();   // Auto-Speichern „Nach dem Zug“: nach dem Aufdecken (Multiplayer: inkl. Einspruch)
}

function evaluateGuess(song){
  state.guessResult = null;
  if(!state.settings.tokens) return;
  const said = { t:(state.guess.t||"").trim(), a:(state.guess.a||"").trim() };
  if(!said.t && !said.a){ state.guess = {t:"",a:"",y:""}; return; }

  const titleOk  = said.t ? fuzzyMatch(said.t, titleVariants(song.t))  : false;
  const artistOk = said.a ? fuzzyMatch(said.a, artistVariants(song.a)) : false;
  const both = titleOk && artistOk;

  let awarded = false;
  if(both && !state.bonusClaimed){
    state.bonusClaimed = true;
    if(state.tokens < state.settings.maxTokens){ state.tokens += 1; awarded = true; }
  }
  state.guessResult = { titleOk, artistOk, both, awarded, said };
  state.guess = { t:"", a:"", y:"" };
}

/* Zufallsereignisse beim Spielerwechsel: Doppelrunde oder Kartentausch */
function insByYear(tl, c){ let i = tl.findIndex(x => x.y > c.y); if(i < 0) i = tl.length; tl.splice(i, 0, c); }
function eventCardSwap(){
  syncActiveToPlayer();
  const me = state.currentPlayer, P = state.players, own = P[me].timeline.map((c, i) => c.__starter ? -1 : i).filter(i => i >= 0);
  const cand = P.map((p, i) => i).filter(i => i !== me && P[i].timeline.some(c => !c.__starter));
  if(!own.length || !cand.length) return false;
  const o = cand[Math.random() * cand.length | 0], oth = P[o].timeline.map((c, i) => c.__starter ? -1 : i).filter(i => i >= 0);
  const a = P[me].timeline.splice(own[Math.random() * own.length | 0], 1)[0], b = P[o].timeline.splice(oth[Math.random() * oth.length | 0], 1)[0];
  insByYear(P[me].timeline, b); insByYear(P[o].timeline, a);
  loadActiveFromPlayer();
  state.eventInfo = { text: `🔀 Kartentausch! ${P[me].name} und ${P[o].name} tauschen je eine Karte: „${a.t}“ (${a.y}) ⇄ „${b.t}“ (${b.y}).` };
  return true;
}
function rollEvent(){
  if(Math.random() >= .22) return;
  if(Math.random() < .5 && eventCardSwap()){ toast(state.eventInfo.text); return; }
  state.doubleTurn = true;
  state.eventInfo = { text: "🔁 Doppelrunde! " + state.players[state.currentPlayer].name + " spielt diese Runde zwei Karten." };
  toast(state.eventInfo.text);
}
function nextTurn(){
  { const L = state.settings.lives; if(L && state.wrongCount >= L){ pauseSpotifyPlayback(); state.won = false; state.screen = "end"; render(); saveState(); return; } }
  state.eventInfo = null;
  if(isMulti() && state.players.length > 1){
    if(state.doubleTurn){ state.doubleTurn = false; state.eventInfo = { text: "🔁 Doppelrunde – " + state.players[state.currentPlayer].name + " spielt die zweite Karte." }; sfx("turn"); }
    else { advancePlayer(); sfx("turn"); if(state.settings.events) rollEvent(); }
  }
  else if(state.online && state.net){ state.net.turn = ((state.net.turn || 0) + 1) % state.net.seats.length; sfx("turn"); }
  drawNext();
  render(); saveState();
}

function checkWin(){
  if(state.settings.handicap && isMulti()){
    syncActiveToPlayer();
    if(state.players.some(p => handicapScore(p) >= state.settings.target)){ pauseSpotifyPlayback(); state.won = true; finalizeMultiplayer(); state.screen = "end"; render(); saveState(); return true; }
    return false;
  }
  // Die Startkarte zählt nicht mit: bei Ziel 10 müssen 10 Karten
  // wirklich richtig platziert worden sein.
  if(state.correctCount >= state.settings.target || (isMulti() && state.players.some((p, i) => i !== state.currentPlayer && p.correctCount >= state.settings.target))){
    pauseSpotifyPlayback();
    state.won = true;
    if(isMulti()) finalizeMultiplayer();
    state.screen = "end";
    render(); saveState();
    return true;
  }
  return false;
}

function backToMenu(){
  pauseSpotifyPlayback();
  state.screen = "menu";
  render();
}

function openExitDialog(){
  state.showExitDialog = true;
  render();
}
function closeExitDialog(){
  state.showExitDialog = false;
  render();
}
async function saveAndMenu(){
  pauseSpotifyPlayback();
  state.showExitDialog = false;
  state.hasSave = true;
  if(state.activeSlot){
    const snapshot = JSON.parse(JSON.stringify(state));
    snapshot.savedAt = Date.now();
    snapshot.name = state.activeSaveName;
    await writeSlot(state.activeSlot, snapshot);
  }
  state.screen = "menu";
  saveState();
  render();
}
async function discardAndMenu(){
  pauseSpotifyPlayback();
  await clearSave();
  const keepSettings = state.settings;
  state = {
    screen: "menu",
    settings: keepSettings,

function diagIce(){
  return new Promise(res => {
    const types = { host:0, srflx:0, relay:0 }; let pc, tm;
    const finish = () => { clearTimeout(tm); try{ pc.close(); }catch(e){} res(types); };
    try{
      const cfg = { iceServers:[{ urls:"stun:stun.l.google.com:19302" }] }, url = (prefs.turnUrl || "").trim();
      if(url) cfg.iceServers.push({ urls:url, username:prefs.turnUser || "", credential:prefs.turnPass || "" });
      pc = new RTCPeerConnection(cfg);
    }catch(e){ return res(null); }
    pc.createDataChannel("d");
    pc.onicecandidate = e => { if(e.candidate){ const m = / typ (host|srflx|relay)/.exec(e.candidate.candidate); if(m) types[m[1]]++; } else finish(); };
    tm = setTimeout(finish, 6000);
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(finish);
  });
}

const AV_RE = /^data:image\/png;base64,[A-Za-z0-9+\/=]{20,14000}$/;
function avLoad(){ try{ return localStorage.getItem("chronohit_avatar") || ""; }catch(e){ return ""; } }
function avSet(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onerror = () => toast("Das Bild konnte nicht gelesen werden.");
  rd.onload = () => {
    const img = new Image();
    img.onerror = () => toast("Dieses Bildformat wird nicht unterstützt.");
    img.onload = () => {
      try{
        const R = 64, c = document.createElement("canvas"); c.width = c.height = R; const x = c.getContext("2d");
        const w = img.naturalWidth || R, h = img.naturalHeight || R, k = Math.max(R / w, R / h);
        x.drawImage(img, (R - w * k) / 2, (R - h * k) / 2, w * k, h * k);
        const d = c.toDataURL("image/png"); if(!AV_RE.test(d)){ toast("Das Bild ist zu groß oder zu komplex."); return; }
        try{ localStorage.setItem("chronohit_avatar", d); }catch(e){}
        avAnnounce(); render();

    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function renderTutorialRules(){
  app.innerHTML = `
    <div class="brand"><h1 style="font-size:calc(30px * var(--font-scale));">Regeln</h1></div>
    <div class="menu-card"><div class="body"><details class="rules-sec" open><summary>🎵 Spielablauf</summary><div class="rules-body"><p><strong>1. Abspielen:</strong> Du ziehst eine Karte und klickst auf die Schallplatte. Der Song spielt unsichtbar im Hintergrund über Spotify, du siehst weder Titel noch Cover. Nochmal klicken pausiert/setzt fort. Mit Spotify Premium läuft der ganze Song, sonst die 30-Sekunden-Vorschau. Wird die Steuerung blockiert (z. B. durch einen Adblocker), springt das Spiel auf einen sichtbaren, zugeschnittenen Player um. Der Button ⟳ an der Schallplatte lädt den Player neu.</p><p style="font-size:calc(13px * var(--font-scale));">Hinweis: Bei „Bailando“ (Enrique Iglesias) lag nur ein Album-Link vor – dort öffnet sich stattdessen eine Spotify-Suche in neuem Tab.</p><p><strong>2. Platzieren:</strong> Ohne das Jahr zu kennen, klickst du auf die Lücke deiner Zeitleiste, die du für chronologisch richtig hältst (früher links, später rechts). Bis zum Aufdecken kannst du die Position noch ändern.</p><p><strong>3. Aufdecken:</strong> Liegt die Karte richtig, bleibt sie liegen und zählt einen Punkt (die Startkarte zählt nicht). Liegt sie falsch, kommt sie auf den Ablagestapel und bleibt dauerhaft draußen. Danach geht es mit „Weiter“ zur nächsten Karte.</p></div></details><details class="rules-sec" ><summary>🎯 Schwierigkeit</summary><div class="rules-body"><p><strong>Normal:</strong> nur die Position zählt.<br><strong>Profi:</strong> Titel &amp; Interpret müssen vor dem Aufdecken zusätzlich stimmen.<br><strong>Experte:</strong> zusätzlich das Erscheinungsjahr, mit einstellbarer Toleranz von bis zu ±5 Jahren.</p><p>Verglichen wird großzügig: Groß-/Kleinschreibung, Akzente, Umlaut-Schreibweisen und Tippfehler werden verziehen.</p></div></details><details class="rules-sec" ><summary>🪙 Chrono-Tokens</summary><div class="rules-body"><p>Wenn aktiviert (außerhalb von Koop), sind Start- und Maximalwert einstellbar.</p><p>&bull; <strong>Song unbekannt?</strong> Für 1 Token wirfst du die aktuelle Karte ab und ziehst eine neue, ohne zu platzieren.<br>&bull; <strong>Karte kaufen:</strong> Für 3 Tokens wird die nächste gezogene Karte garantiert richtig einsortiert, ohne Risiko.<br>&bull; <strong>Bonus-Token:</strong> Tippst du Titel und Interpret richtig ein, gibt es einen weiteren Token (in jedem Schwierigkeitsgrad).</p><p>Tastenkürzel: S = Überspringen, B = Kaufen.</p></div></details><details class="rules-sec" ><summary>🎮 Spielmodi</summary><div class="rules-body"><p><strong>Solo:</strong> Du spielst allein auf eine einstellbare Zielkartenzahl.</p><p><strong>Koop:</strong> Ihr startet gemeinsam mit einer festen Zahl Chrono-Tokens (1–10) und einer Startkarte. Jede falsch platzierte Karte kostet einen Token. Skip/Kaufen gibt es nicht, die Tokens sind eure gemeinsamen Leben. Bei 0 Tokens vor dem Ziel habt ihr verloren, sonst gewonnen.</p><p><strong>Mehrspieler:</strong> Jeder Spieler hat eine eigene Startkarte und Zeitleiste, ihr spielt reihum. Wer das Ziel erreicht, gewinnt; ist der Stapel leer, entscheidet die Zahl richtiger Karten (Gleichstand möglich).</p></div></details><details class="rules-sec" ><summary>📣 Chronohit!-Einspruch (Mehrspieler mit Tokens)</summary><div class="rules-body"><p>Bevor eine Karte aufgedeckt wird, kann ein Gegner mit einem Token „Chronohit!“ rufen und die Lücke wählen, wo die Karte seiner Meinung nach hingehört. Liegt der aktive Spieler falsch und der Rufer richtig, bekommt der Rufer die Karte. Der eingesetzte Token ist immer weg. Pro Zug zählt nur der erste Einspruch.</p><p><strong>Einspruchsfenster:</strong> Entweder beendet der aktive Spieler (online auch der Host) das Fenster per Klick, oder es schließt automatisch nach 5 bzw. 10 Sekunden oder (mit Zeitlimit) mit der Restzeit, mindestens 5 Sekunden. Ruft jemand, hat der Rufer mindestens 5 Sekunden für die Lückenwahl. Ohne gewählte Lücke wird der Ruf zurückgenommen und der Token kommt zurück.</p></div></details><details class="rules-sec" ><summary>🎲 Zufallsereignisse (Mehrspieler)</summary><div class="rules-body"><p>Optional, standardmäßig aus. Beim Spielerwechsel passiert mit etwa 22 % Wahrscheinlichkeit etwas: <strong>Doppelrunde</strong> (der Spieler ist zweimal hintereinander dran) oder <strong>Kartentausch</strong> (zwei Spieler tauschen je eine zufällige Karte, nie die Startkarte; sie werden nach Jahr neu einsortiert). Ein Banner zeigt das Ereignis an.</p></div></details><details class="rules-sec" ><summary>⚡ Solo-Varianten</summary><div class="rules-body"><p><strong>Klassisch:</strong> bis zum Ziel.<br><strong>Endlos:</strong> kein Ziel, die Runde endet nach einer einstellbaren Zahl Fehler (Leben, Standard 3). Dein Highscore ist die Zahl richtiger Karten.<br><strong>Blitz:</strong> x Sekunden (30–180) für so viele richtige Karten wie möglich. Die Uhr startet beim Abspielen der ersten Karte; Abspielen, Aufdecken und Weiter laufen automatisch. Nur die Position zählt, ohne Titel/Interpret und ohne Tokens.<br><strong>Sudden Death:</strong> ein Fehler und du bist raus.</p><p>Highscores werden pro Variante (Blitz pro Dauer) gespeichert.</p></div></details><details class="rules-sec" ><summary>⏱ Zeitlimit pro Zug</summary><div class="rules-body"><p>Optional. Pro Zug bleibt nur begrenzte Zeit zum Platzieren (und in Profi/Experte oder für den Bonus zum Raten von Titel/Interpret). Die Zeit läuft ab dem Start des Songs. Läuft sie ab, gilt der Zug als verloren: Die Karte wird verworfen und zählt als falsch (im Koop kostet das einen Token).</p></div></details><details class="rules-sec" ><summary>🎼 Songauswahl und Filter</summary><div class="rules-body"><p>Beim Erstellen eines Spiels filterst du die Songs nach <strong>Sprache</strong>, <strong>Genre</strong> (ein Song kann mehrere haben, ein Treffer genügt), <strong>Jahrzehnt</strong> und <strong>Kategorien</strong> (z. B. Filmmusik oder Balladen; „Sonstige“ sind Songs ohne besondere Kategorie). Die Zahlen an den Chips zeigen, wie viele Songs es gibt. Die Reihenfolge der Filtergruppen lässt sich ändern.</p></div></details><details class="rules-sec" ><summary>🌐 Online spielen</summary><div class="rules-body"><p>Über „Spiel hosten / beitreten“ eröffnet ein Host einen Raum (Raumname, optional Passwort), Mitspieler treten bei, Zuschauer können zusehen. Der Host steuert Einstellungen und Start. Im Online-Solo und -Koop dürfen alle Teilnehmer gleichzeitig tippen (und raten). Im <strong>Team-Modus</strong> (Mehrspieler online) bilden die Spieler Teams mit gemeinsamer Zeitleiste und gemeinsamen Tokens; jedes Teammitglied darf tippen und raten, die Teams sind reihum dran. Die Teams wählst du in der Lobby selbst, der Host kann sie ändern oder zufällig verteilen. Ein <strong>Rematch</strong> startet nur, wenn alle verbundenen Mitspieler zustimmen; wer ablehnt, bricht die Anfrage ab.</p></div></details><details class="rules-sec" ><summary>💾 Spielstände</summary><div class="rules-body"><p>Beim Erstellen eines Spiels wählst du einen von 4 Speicherplätzen und einen Namen. Über den 💾-Button im Spiel speicherst du jederzeit in diesen Slot. Über „Spiel laden“ machst du dort weiter.</p></div></details><details class="rules-sec" ><summary>📜 Spielende, Chronik und Statistik</summary><div class="rules-body"><p>Am Ende siehst du das Ergebnis (bei Varianten mit Highscore-Vergleich). „Finale Zeitleiste ansehen“ zeigt alle Karten mit einem ▶ darunter, das die 30-Sekunden-Vorschau spielt. Die <strong>Spielchronik</strong> listet jeden Zug samt dem, was geraten wurde (Platzierung, Titel, Interpret, Jahr). Statistiken und der Jahresrückblick im Hauptmenü zählen deine Runden; Tutorial-Runden zählen nicht.</p></div></details><details class="rules-sec" ><summary>📅 Tägliche Challenge, Level und XP</summary><div class="rules-body"><p><strong>Tägliche Challenge:</strong> Jeden Tag gibt es 10 feste Karten (aus dem Datum abgeleitet, für alle mit derselben Songliste gleich), ohne Tokens. Dein Ergebnis ist x/10. Du darfst beliebig oft spielen, aber nur der erste Versuch des Tages zählt für XP und Serie. Der Teilen-Text zeigt nur Datum und Farbquadrate (🟩 richtig, 🟥 falsch), keine Songs.</p><p><strong>XP:</strong> 10 pro richtig platzierter Karte, 5 pro richtig geratenem Titel oder Interpreten, 50 für einen Sieg, 25 für einen neuen Highscore, 100 für die Tägliche Challenge plus 10 pro Serientag (bis 7). Das Level steigt mit wachsendem Bedarf (100 XP für Level 2, danach je 40 mehr). Alles wird nur lokal gespeichert. Tutorial-Runden zählen nicht.</p></div></details><details class="rules-sec" ><summary>🎯 Spielarten und Handicap</summary><div class="rules-body"><p><strong>Jahr-Schätzen</strong> (Mehrspieler, lokal oder online): Zu jedem Song tippen alle ein Jahr. Lokal gibst du das Gerät reihum weiter, online tippen alle gleichzeitig. Die kleinste Abweichung gewinnt die Runde: 3 / 2 / 1 Punkte für die drei Besten (gleiche Abweichung teilt sich den Platz), Volltreffer +2 Punkte. <strong>Interpret-Quiz</strong> (Solo, reihum oder online): nur den Interpreten raten, per Freitext (mit Toleranz bei Schreibweise) oder mit 4 Auswahlmöglichkeiten. Richtig gibt 1 Punkt, reihum wechseln die Spieler pro Song. Beide Spielarten laufen über die gewählte Rundenzahl (3 bis 30), sind nicht in XP und Statistik gezählt und haben keine Tokens. <strong>Handicap-Modus</strong> (Klassisch, Mehrspieler): Jeder Spieler hat seine eigene Schwierigkeit (Normal, Profi, Experte). Profi zählt ×1,5, Experte ×2 für Ziel und Wertung.</p></div></details><details class="rules-sec" ><summary>💬 Schnellchat, Diagnose und Zugänglichkeit</summary><div class="rules-body"><p><strong>Schnellchat:</strong> In Online-Räumen gibt es unten links einen 💬-Button mit vorgefertigten Sätzen. Alle sehen die Nachricht kurz mit deinem Namen (höchstens eine alle 1,5 Sekunden). <strong>Beitreten:</strong> Füge den kopierten Einladungstext des Hosts ein, dann werden Raumname und Passwort ausgefüllt. <strong>Verbindungsdiagnose</strong> (Einstellungen oder Beitreten-Seite) prüft Internet, Vermittlungsserver, Netzwerkart, Mikrofon, Kopieren und Spotify. <strong>Zugänglichkeit:</strong> Farbsehschwäche-Voreinstellungen, Screenreader-Modus und Linkshändermodus (alle standardmäßig aus) sowie „Automatisch hell/dunkel“ nach System oder Uhrzeit unter Themes.</p></div></details><details class="rules-sec" ><summary>🎓 Lernrunde und Auswertungen</summary><div class="rules-body"><p><strong>Auswertung:</strong> Ab dem Update merkt sich Chronohit lokal im Browser jede platzierte Karte (Song, richtig/falsch, Tag). Daraus entstehen in den Statistiken die Trefferquote pro Epoche und Genre mit schwächster Epoche/Genre (ab 5 Karten pro Gruppe), ein Verlaufsdiagramm der letzten 30 Tage (Trefferquote, richtige oder gespielte Karten, XP) und ein Kalender mit Spieltagen und Challenge-Tagen. Bei Online-Spielen als Gast werden Karten nicht mitgeschrieben, nur beim Host und lokal.</p><p><strong>Lernrunde:</strong> 10 Karten, bei denen Songs mit vielen bisherigen Fehlern häufiger vorkommen. Ohne bisherige Daten sind es zufällige Songs. Die Runde wird nicht gespeichert, zählt aber für XP und Statistik.</p></div></details><details class="rules-sec" ><summary>🎧 Playlist</summary><div class="rules-body"><p>Im Hauptmenü listet die Playlist alle Lieder mit Jahr, Sprache und Genre/Kategorie. Du kannst suchen, über „Filter“ nach Sprache, Genre, Jahrzehnt und Kategorien filtern, nach Titel, Interpret oder Jahr sortieren und mit ▶ die 30-Sekunden-Vorschau anspielen.</p></div></details><details class="rules-sec" ><summary>🎨 Themes und Darstellung</summary><div class="rules-body"><p>In den Einstellungen wählst du ein Theme. Jahreszeiten (Frühling bis Winter) und Feiertage (Valentinstag, Ostern, Halloween, Weihnachten, Silvester) sind aufklappbare Gruppen mit Hintergrund-Deko; Feiertags-Themes haben eigene Sounds. „Jahreszeiten-Themes nach Datum“ schaltet beim Start automatisch auf das passende Theme (Aus / Nur Feiertage / Feiertage &amp; Jahreszeiten). „Benutzerdefiniert“ erlaubt eigene Farben, Schrift und Stil. „Animationen reduzieren“ schaltet Deko-Animationen, Feuerwerk und Flattertiere aus.</p></div></details><details class="rules-sec" ><summary>⌨️ Bedienung per Tastatur</summary><div class="rules-body"><p>Wenn aktiviert: ←/→ oder A/D wählen die Lücke, Enter/Leertaste bestätigt (platzieren, aufdecken, weiter), Rücktaste ändert die Position, S überspringt, B kauft, P pausiert (nicht online). <strong>Esc</strong> geht in jedem Menü eine Ebene zurück.</p></div></details></div></div>

/* Weiches "Gleiten" bei Umsortierungen (FLIP): Positionen vor der Änderung merken, danach
   jedes Element von seiner alten Position aus an die neue animieren. Die Ansicht wird bei
   jeder Änderung neu aufgebaut, daher identifizieren wir Elemente über data-flip. */
function flipAnimate(itemSelector, mutate){
  const before = {};
  document.querySelectorAll(itemSelector).forEach(el => { before[el.dataset.flip] = el.getBoundingClientRect(); });
  mutate();
  if(prefs.reduceMotion) return;
  document.querySelectorAll(itemSelector).forEach(el => {
    const b = before[el.dataset.flip];
    if(!b) return;
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if(!dx && !dy) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.position = el.style.position || "relative";
    el.style.zIndex = "2";
    el.getBoundingClientRect();   // Reflow erzwingen, damit der Startwert greift
    el.style.transition = "transform .4s cubic-bezier(.22, .9, .3, 1)";
    el.style.transform = "";
    const done = () => { el.style.transition = ""; el.style.zIndex = ""; el.style.position = ""; };
    el.addEventListener("transitionend", done, { once:true });
    setTimeout(done, 550);
  });
}

  return {

function stageKeysOf(song, key){
  return key === "genres" ? songLangs(song)
       : key === "styles" ? (song.s || [])
       : key === "decades" ? [String(decadeOf(song.y))]
       : songThemes(song);
}
// Die Gruppen arbeiten der Reihe nach: jede sucht nur in den Songs, die die Gruppen davor übrig lassen.
function wizardStages(){
  const w = state.wizard;
  const f = songFilterFromWizard(w);
  let pool = SONGS;
  const stages = [];
  w.filterOrder.forEach(key => {
    const counts = {};
    pool.forEach(s => stageKeysOf(s, key).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
    const next = pool.filter(s => songMatches(s, { [key]: f[key] }));
    stages.push({ key, counts, incoming: pool.length, after: next.length });
    pool = next;
  });
  return { stages, final: pool.length };
}

  const order = state.wizard.filterOrder;
  const i = order.indexOf(key), j = i + dir;

  flipAnimate(".chip-group", () => {
    [order[i], order[j]] = [order[j], order[i]];
    render();
  });

function applyGameKind(settings, w){

  if(g === "year" && w.mode !== "multiplayer") return;
  if(g !== "classic"){
    settings.game = g; settings.rounds = Math.max(3, Math.min(30, w.rounds || 10)); settings.answerMode = w.answerMode === "choice" ? "choice" : "text";
    settings.tokens = false; settings.difficulty = "normal"; settings.target = settings.rounds; settings.events = false; settings.challenge = false;
    delete settings.variant; delete settings.teams; delete settings.lives; delete settings.blitzSec;
  } else if(w.mode === "multiplayer" && w.handicap && !w.teams) settings.handicap = true;
}
async function createGameFromWizard(){

  const settings = w.mode === "coop" ? {
    tokens: true,
    target: w.target,
    maxTokens: w.coopTokens,
    startTokens: w.coopTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0,
    challenge: w.mode === "multiplayer" && !!w.tokens && w.challenge !== false, challengeMode: wizardChallengeMode(w), yearTol: w.difficulty === "expert" ? Math.max(0, Math.min(5, w.yearTol | 0)) : 0,
    ...songFilterFromWizard(w)
  } : {
    tokens: w.tokens,
    target: w.target,
    maxTokens: w.maxTokens,
    startTokens: w.startTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0,
    challenge: w.mode === "multiplayer" && !!w.tokens && w.challenge !== false, challengeMode: wizardChallengeMode(w), yearTol: w.difficulty === "expert" ? Math.max(0, Math.min(5, w.yearTol | 0)) : 0,
    ...songFilterFromWizard(w)
  };
  if(w.mode === "multiplayer") settings.events = w.events === true;
  if(w.mode === "solo" && w.variant && w.variant !== "classic"){
    settings.variant = w.variant;
    if(w.variant === "endless"){ settings.lives = Math.max(1, Math.min(SONGS.length - 1, w.lives || 3)); settings.target = 9999; }
    if(w.variant === "sudden"){ settings.lives = 1; }
    if(w.variant === "blitz"){ settings.tokens = false; settings.difficulty = "normal"; settings.turnLimit = 0; settings.yearTol = 0; settings.blitzSec = w.blitzSec || 60; settings.target = 9999; }
  }
  applyGameKind(settings, w);
  const slotNum = w.slot;
  const saveName = (w.name || "").trim();
  let playerNames = null;
  if(w.mode === "multiplayer"){
    // Leere Namen vor dem Mischen auffüllen, damit "Spieler 3" auch nach dem Auslosen "Spieler 3" bleibt
    playerNames = w.playerNames.map((nm, i) => (nm || "").trim() || `Spieler ${i+1}`);

  }

  if(w.quickPlay){ window.__tutBoot = true; newGame(settings, playerNames); if(settings.game) qgInit(); if(settings.handicap) hcApplyLocal(w); window.__tutBoot = false; state.quickGame = true; state.hasSave = false; render(); return; }
  newGame(settings, playerNames);
  if(settings.game) qgInit();
  if(settings.handicap) hcApplyLocal(w);
  state.activeSlot = slotNum;
  state.activeSaveName = saveName;
  const snapshot = JSON.parse(JSON.stringify(state));
  snapshot.savedAt = Date.now();
  snapshot.name = saveName;
  await writeSlot(slotNum, snapshot);
  render();
}

function simpleCardHtml(song, isStart, isWrong){
  return `
    <div class="card ${isWrong ? 'wrong' : ''}">
      ${isStart ? `<span class="tag start">Start</span>` : ``}

        <div class="artist">${song.a}</div>
      </div>

function isMultiRound(){ return isMulti() && state.players.length > 1; }

function rankedPlayers(){
  const list = state.players.map((_, i) => ({ i, v: playerView(i) }));
  const sc = r => state.settings.handicap ? r.v.correctCount * (HC_MULT[(state.players[r.i] || {}).diff || "normal"] || 1) : r.v.correctCount;
  list.forEach(r => { r.pos = 1 + list.filter(o => sc(o) > sc(r)).length; });
  list.sort((a, b) => (sc(b) - sc(a)) || (a.v.wrongCount - b.v.wrongCount) || (a.i - b.i));
  return list;
}

const VARIANTS = { classic:"Klassisch", endless:"Endlos", blitz:"Blitz", sudden:"Sudden Death" };
function variantLabel(v){ return VARIANTS[v] || v; }
function hsRecord(){
  const s = state.settings; if(state.hsDone || !s.variant || state.tutorial) return; state.hsDone = true;
  let all = {}; try{ all = JSON.parse(localStorage.getItem("chronohit_hs") || "{}"); }catch(e){}
  const k = s.variant === "blitz" ? "blitz" + s.blitzSec : s.variant, old = all[k] || 0;
  state.hsOld = old; state.hsNew = state.correctCount > old;
  if(state.hsNew){ all[k] = state.correctCount; try{ localStorage.setItem("chronohit_hs", JSON.stringify(all)); }catch(e){} }
}
function endTitle(){
  if(state.daily || state.learn) return dailyTitle(state.correctCount || 0);
  const v = state.settings.variant;
  if(v === "blitz") return "Zeit ist um!";
  if(v === "endless") return "Runde vorbei!";
  if(v === "sudden" && !state.won) return "Raus!";
  return state.won ? "Gewonnen!" : "Verloren!";
}
/* Blitz: Gesamtuhr, automatisch abspielen, aufdecken und weiter */
let blitzKey = "", blitzLast = 0;
function blitzTick(){
  const s = state.settings; if(!s || s.variant !== "blitz" || state.screen !== "game") return;
  const now = Date.now(), dt = blitzLast ? now - blitzLast : 0; blitzLast = now;
  if(state.blitzEnd){
    if(turnDialogOpen()) state.blitzEnd += dt;
    const left = state.blitzEnd - now; state.blitzLeft = left;
    const el = document.getElementById("blitz-t"); if(el) el.textContent = Math.max(0, Math.ceil(left / 1000)) + " s";
    if(left <= 0){ pauseSpotifyPlayback(); state.screen = "end"; render(); saveState(); return; }
  }
  if(turnDialogOpen()) return;
  const key = (state.turnNo || 0) + ":" + state.phase;
  if(key === blitzKey) return;
  if(state.phase === "revealed_pending" && state.pendingGap != null){ blitzKey = key; revealCard(); }
  else if(state.phase === "feedback"){ blitzKey = key; setTimeout(() => { if(state.phase === "feedback" && state.screen === "game") nextTurn(); }, 800); }
  else if(state.phase === "draw" && state.current && state.blitzEnd){ blitzKey = key; playCurrent(); }
}
setInterval(blitzTick, 200);

function timelineCardsHtml(timeline, wrongSongs, showWrong){
  let items = timeline.map(song => ({ song, wrong:false }));
  if(showWrong && wrongSongs.length){
    // Falsche Songs chronologisch (nach Jahr) einsortieren; bei Gleichstand nach den richtigen
    wrongSongs.forEach(song => {
      let idx = items.findIndex(it => it.song.y > song.y);
      if(idx === -1) idx = items.length;
      items.splice(idx, 0, { song, wrong:true });
    });
  }
  return items.map(it => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">${simpleCardHtml(it.song, !it.wrong && !!it.song.__starter, it.wrong)}${it.song.id ? `<button class="btn-ghost btn-small" onclick="plPlay('${it.song.id}')" aria-label="30 Sekunden abspielen">${PL.playing === it.song.id ? '⏸' : '▶'}</button>` : ''}</div>`).join('');
}

function updateDocumentTitle(){
  const sc = state.screen, B = " – Chronohit", st = state.settings || {};
  const kindName = state.qg ? (state.qg.kind === "year" ? "Jahr-Schätzen" : "Interpret-Quiz") : "";
  const subs = { language:"Sprache", themes:"Themes", display:"Darstellung", save:"Speichern", play:"Spielen", sound:"Sound", profile:"Profilbild", diag:"Verbindungsdiagnose", experimental:"Experimentelles" };
  let t = "Chronohit";
  if(sc === "game"){
    if(state.qg) t = kindName + " · Runde " + state.qg.round + "/" + state.qg.total + B;
    else if(state.tutorial) t = "Tutorial" + B;
    else if(state.daily) t = "Tägliche Challenge" + B;
    else if(state.learn) t = "Lernrunde" + B;
    else if(state.activeSaveName) t = state.activeSaveName + B;
    else t = modeLabel(st.mode) + (st.variant ? " · " + variantLabel(st.variant) : "") + B;
  } else if(sc === "end"){
    const n = state.correctCount || 0;
    if(state.qg) t = kindName + " · Ergebnis" + B;
    else if(state.daily) t = dailyTitle(n) + " " + n + "/10 · Daily" + B;
    else if(state.learn) t = dailyTitle(n) + " " + n + "/10 · Lernrunde" + B;
    else if(isMultiRound()) t = "Spielende" + B;
    else if(st.variant) t = endTitle() + " " + n + " Karten" + B;
    else t = (state.won ? "Gewonnen" : "Verloren") + " · " + n + " Karten" + B;
  } else {
    const map = { splash:"Chronohit", loading:"Lädt …" + B, menu:"Hauptmenü" + B, play:"Spielen" + B, quickplay:"Quickplay" + B, loadgame:"Spielstände" + B,
      tutorial:(state.tutRules ? "Regeln" : "Tutorial") + B, settings:(state.settingsSub && subs[state.settingsSub] ? subs[state.settingsSub] : "Einstellungen") + B, stats:"Statistiken" + B, recap:"Jahresrückblick" + B,
      online:"Online spielen" + B, join:"Spiel beitreten" + B, lobby:"Lobby" + B, resume:"Online-Spiel fortsetzen" + B,
      create:(state.wizard && state.wizard.quick != null ? "Quickplay einrichten" : "Spiel erstellen") + B, playlist:"Playlist" + B, timeline:"Finale Zeitleiste" + B };
    t = map[sc] || "Chronohit";
  }
  document.title = t;
}

  const g = state.settings.genres;

  if(state.tokens > m){ state.tokens = m; }   // laufende Runde ggf. kappen
  render(); saveState();
}

async function resumeGame(){
  const saved = await loadSave();
  if(saved){
    state = saved;
    // Felder aus älteren Spielständen nachziehen
    if(!state.guess) state.guess = { t:"", a:"", y:"" };
    if(state.guessResult === undefined) state.guessResult = null;
    if(typeof state.correctCount !== "number") state.correctCount = 0;
    if(typeof state.settings.maxTokens !== "number") state.settings.maxTokens = 5;
  if(typeof state.settings.startTokens !== "number") state.settings.startTokens = 2;
  if(!state.settings.mode) state.settings.mode = "solo";
  if(!state.settings.difficulty) state.settings.difficulty = "normal";

function hexToRgba(hex, alpha){
  const h = hex.replace("#","");
  return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${alpha})`;
}
function mixHex(hex, towardHex, amount){
  const a = hex.replace("#",""), b = towardHex.replace("#","");
  const ch = (s,i) => parseInt(s.substring(i,i+2),16);
  const mix = i => Math.round(ch(a,i) + (ch(b,i) - ch(a,i)) * amount);
  const toHex = n => n.toString(16).padStart(2,"0");
  return "#" + toHex(mix(0)) + toHex(mix(2)) + toHex(mix(4));
}
function relativeLuminance(hex){
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}

}
function setUserFont(v){

function ensureGoogleFont(query){

}

function applyCustomTheme(){

  const panelAlpha = c.opacity * alphaMul;
  const panel2Alpha = d === "glass" ? c.opacity * 0.26 : panelAlpha;

  let blur = c.opacity < 1 ? Math.round((1 - c.opacity) * 24 + 4) + "px" : "0px";
  let line = hexToRgba(mixHex(c.bg, "#ffffff", 0.3), Math.max(c.opacity, 0.5));

  if(d === "glass"){
    blur = "16px";

      `linear-gradient(160deg, ${c.bg} 0%, ${mixHex(c.bg, c.accent, 0.25)} 50%, ${mixHex(c.bg, c.accent, 0.5)} 100%)`;

    blur = "10px";
    bgImage = `radial-gradient(900px 500px at 85% 0%, ${hexToRgba(c.accent, 0.08)}, transparent 60%)`;
  } else if(d === "norisk"){
    line = hexToRgba(c.text, 0.1);

  root.setProperty("--bg", c.bg);

/* Cursor-Leuchtkreis: folgt der Maus mit weichem Nachziehen (Easing) */
const cg = { x:0, y:0, tx:0, ty:0, raf:null, seen:false };
function cursorGlowTick(){
  const el = document.getElementById("cursor-glow");
  if(el){
    cg.x += (cg.tx - cg.x) * 0.12;
    cg.y += (cg.ty - cg.y) * 0.12;
    el.style.transform = `translate3d(${cg.x - 230}px, ${cg.y - 230}px, 0)`;
  }
  cg.raf = requestAnimationFrame(cursorGlowTick);
}
function startCursorGlow(){ if(!cg.raf) cg.raf = requestAnimationFrame(cursorGlowTick); }
function stopCursorGlow(){ if(cg.raf){ cancelAnimationFrame(cg.raf); cg.raf = null; } }
window.addEventListener("pointermove", e => {
  cg.tx = e.clientX; cg.ty = e.clientY;
  if(!cg.seen){ cg.seen = true; cg.x = cg.tx; cg.y = cg.ty; }
  const el = document.getElementById("cursor-glow");
  if(el) el.classList.add("seen");
}, { passive:true });
document.documentElement.addEventListener("mouseleave", () => {
  const el = document.getElementById("cursor-glow");
  if(el) el.classList.remove("seen");
});

   Das gespeicherte Theme bleibt unverändert; „Benutzerdefiniert“ wird nie überschrieben. */
function easterDate(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, dd = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - dd - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const DECO = {

let fwRaf = 0;
function stopFw(){ if(fwRaf) cancelAnimationFrame(fwRaf); fwRaf = 0; }
/* Feuerwerk: Raketen steigen auf, platzen in Funkenringe, die mit Schwerkraft verglühen (Canvas) */
function startFw(el){
  const c = document.createElement("canvas"); c.style.cssText = "position:absolute;inset:0;width:100%;height:100%"; el.appendChild(c);
  const x = c.getContext("2d"); let W = 0, H = 0, rk = [], pt = [], next = 0;
  const sz = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; sz();
  const cols = [[255,210,74],[255,90,130],[90,220,255],[170,120,255],[120,255,170],[255,150,60]];
  const burst = (px, py) => {
    const col = cols[Math.random() * cols.length | 0], n = 46 + (Math.random() * 30 | 0), ring = Math.random() < .35;
    for(let i = 0; i < n; i++){ const a = Math.PI * 2 * i / n + Math.random() * .15, v = ring ? 2.4 + Math.random() * .4 : 1 + Math.random() * 3.2;
      pt.push({ h:[], x:px, y:py, vx:Math.cos(a) * v, vy:Math.sin(a) * v, l:1, d:.008 + Math.random() * .01, c:col }); }
  };
  const loop = t => {
    fwRaf = requestAnimationFrame(loop);
    if(c.width !== innerWidth || c.height !== innerHeight) sz();
    x.clearRect(0, 0, W, H); x.globalCompositeOperation = "lighter"; x.lineCap = "round";
    if(t > next){ next = t + 700 + Math.random() * 1300; rk.push({ x:W * (.1 + Math.random() * .8), y:H, ty:H * (.07 + Math.random() * .3), vy:0 }); }
    rk = rk.filter(r => { if(!r.vy) r.vy = -(H - r.ty) * .0105; r.y += r.vy; r.vy *= .99; x.fillStyle = "#ffe9b0"; x.fillRect(r.x, r.y, 2, 7); if(r.y <= r.ty || r.vy > -.8){ burst(r.x, r.y); return false; } return true; });
    pt = pt.filter(q => { q.x += q.vx; q.y += q.vy; q.vy += .03; q.vx *= .985; q.vy *= .985; q.l -= q.d; if(q.l <= 0) return false;
      q.h.push([q.x, q.y]); if(q.h.length > 6) q.h.shift();
      x.strokeStyle = `rgba(${q.c[0]},${q.c[1]},${q.c[2]},${(q.l * .8).toFixed(2)})`; x.lineWidth = 1.8 * q.l + .5; x.beginPath(); x.moveTo(q.h[0][0], q.h[0][1]);
      for(let i = 1; i < q.h.length; i++) x.lineTo(q.h[i][0], q.h[i][1]);
      x.stroke(); return true; });
  };
  fwRaf = requestAnimationFrame(loop);
}
/* Flattern: Schmetterlinge/Fledermäuse fliegen zufällige Wege (Wegpunkte) und schlagen mit den Flügeln */
function flutter(el){
  if(document.documentElement.classList.contains("reduce-motion")) return;
  const r = (a, b) => a + Math.random() * (b - a), T = Math.PI * 2;
  el.querySelectorAll(".dr").forEach(sp => {
    const ch = sp.textContent, bat = ch === "🦇", bee = ch === "🐝", ghost = ch === "👻";
    const cx = r(15, 85), cy = r(18, 52), ax = r(10, 26), ay = r(5, 15), f1 = 1 + (Math.random() * 2 | 0), f2 = 1 + (Math.random() * 2 | 0), p1 = r(0, T), p2 = r(0, T), N = 90, kf = [];
    for(let k = 0; k <= N; k++){
      const u = k / N, ph = T * f1 * u + p1;
      const x = cx + ax * Math.sin(ph), y = cy + ay * Math.sin(T * f2 * u + p2) + 1.2 * Math.sin(T * 9 * u);
      kf.push({ transform:`translate(${x.toFixed(2)}vw,${y.toFixed(2)}vh) rotate(${(10 * Math.cos(ph)).toFixed(1)}deg)` });
    }
    sp.animate(kf, { duration:(bee ? r(16, 26) : bat ? r(26, 40) : ghost ? r(80, 120) : r(36, 54)) * 1000, iterations:Infinity, easing:"linear", delay:-r(0, 60) * 1000 });
  });
}
const PX_CACHE = {};
function pxEmoji(ch){

    const R = 20, c = document.createElement("canvas"); c.width = c.height = R; const x = c.getContext("2d");
    x.textAlign = "center"; x.textBaseline = "middle"; x.font = Math.round(R * .78) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.fillText(ch, R / 2, R / 2 + 1);

  }catch(e){}

}

  add("dr", cfg.dr, cfg.dr && !document.documentElement.classList.contains("reduce-motion") ? Math.max(2, Math.round(cfg.dr.length * Math.max(.5, k))) : 0, () => `font-size:${r(26, 42).toFixed(0)}px`);

function seasonalEventTheme(d){
  const md = (d.getMonth() + 1) * 100 + d.getDate();
  const eas = easterDate(d.getFullYear()), dd = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - eas) / 864e5);
  if(dd >= -7 && dd <= 1) return "ostern";
  if(md >= 212 && md <= 214) return "valentin";
  if(md >= 1227 || md <= 102) return "silvester";
  if(md >= 1024 && md <= 1101) return "halloween";
  if(md >= 1201 && md <= 1226) return "weihnachten";
  return null;
}
function seasonOfYearTheme(d){
  const m = d.getMonth() + 1;

/* ============ ZEITLIMIT PRO ZUG ============
   Läuft ab dem Start des Songs (Schallplatte) bis zum Aufdecken. Bei geöffneten Dialogen
   (Verlassen, Speichern, Token-Rückfrage) pausiert die Zeit. Nach dem Laden eines
   Spielstands startet der laufende Zug mit der vollen Zeit neu. */
let turnLastTick = Date.now();
let turnLastSec = null;
let autoRevealFlag = false;
function turnLimitMs(){
  const t = state && state.settings ? state.settings.turnLimit : 0;
  return t > 0 ? t * 1000 : 0;
}
function turnTimerActive(){
  return state.screen === "game" && turnLimitMs() > 0 && !!state.current &&
    (state.phase === "placing" || state.phase === "revealed_pending");
}
function turnDialogOpen(){
  if(paused) return true;
  if(state.online) return netWaitingSeat() >= 0;
  return !!(state.showExitDialog || state.saveSlotDialogOpen || state.confirmOverwriteSave ||
            state.confirmDeleteSlot || state.pendingSpend);
}
function turnTimerHtml(){
  const total = turnLimitMs();
  if(!total) return ``;
  const left = state.turnDeadline ? Math.max(0, state.turnDeadline - Date.now()) : total;
  return `
    <div class="turn-timer ${left <= 5000 ? 'low' : ''}" id="turn-timer" role="timer" aria-label="Verbleibende Zeit für diesen Zug">
      <div class="bar"><div class="fill" id="turn-timer-fill" style="width:${Math.min(100, left / total * 100)}%"></div></div>
      <span class="time" id="turn-timer-text">${Math.ceil(left / 1000)} s</span>
    </div>`;
}
function updateTurnTimerUi(left){
  const fill = document.getElementById("turn-timer-fill");
  const txt = document.getElementById("turn-timer-text");
  const box = document.getElementById("turn-timer");
  if(!fill || !txt || !box) return;
  const total = turnLimitMs();
  fill.style.width = Math.max(0, Math.min(100, left / total * 100)) + "%";
  txt.textContent = Math.max(0, Math.ceil(left / 1000)) + " s";
  box.classList.toggle("low", left <= 5000);
}
function turnTick(){
  const now = Date.now();
  const dt = now - turnLastTick;
  turnLastTick = now;
  if(!turnTimerActive()) return;
  if(!state.turnDeadline && state.online && NET.role === "guest") return;
  if(!state.turnDeadline){
    state.turnDeadline = now + turnLimitMs();
    turnLastSec = Math.round(turnLimitMs() / 1000);
  }
  if(turnDialogOpen()) state.turnDeadline += dt;
  const left = state.turnDeadline - now;
  updateTurnTimerUi(left);
  // Ticken: ein Tick bei 15 s und 10 s, ab 5 s jede Sekunde (die Startsekunde selbst tickt nicht)
  const sec = Math.ceil(left / 1000);
  if(sec !== turnLastSec){
    turnLastSec = sec;
    if(sec === 15 || sec === 10 || (sec <= 5 && sec >= 1)) sfx("tick", 0, sec);
  }
  if(left <= 0 && !(state.online && NET.role === "guest")) timeoutTurn();
}
function timeoutTurn(){
  if(!turnTimerActive()) return;
  // Position schon gewählt, nur noch nicht bestätigt: die Auswahl wird gewertet (richtig oder falsch)
  if(state.phase === "revealed_pending" && state.pendingGap != null){
    pauseSpotifyPlayback();
    state.turnDeadline = null; state.chDeadline = null; state.pendingSpend = null; turnLastSec = null;
    autoRevealFlag = true; state.autoRevealed = true;
    NET.depth++;
    try{ revealCard(); } finally { NET.depth--; autoRevealFlag = false; }
    return;
  }
  pauseSpotifyPlayback();
  const song = state.current;
  state.turnDeadline = null; state.chDeadline = null;
  state.pendingSpend = null;
  state.discard.push(song);
  state.wrongCount += 1;
  if(!state.wrongSongs) state.wrongSongs = [];
  state.wrongSongs.push(song);
  if(state.settings.mode === "coop"){
    state.tokens = Math.max(0, state.tokens - 1);
  }
  statsAddTurn(false, true);
  turnLastSec = null;
  sfx("timeout");
  state.lastResult = {
    ok: false, song, positionOk: false, timedOut: true,
    guessCheck: { said:{ t:"", a:"", y:"" }, titleOk:false, artistOk:false, yearOk:false, both:false },
    difficulty: state.settings.difficulty, bonusAwarded: false
  };
  chronicleAdd({ n: state.turnNo || 0, p: chroName(), t: song.t, a: song.a, y: song.y, k: "timeout", c: "" });
  state.guessResult = null;
  state.guess = { t:"", a:"", y:"" };
  state.pendingGap = null;
  state.phase = "feedback";
  render(); saveState();
}

/* ============ EINSPRUCHSFENSTER (Timer) ============
   Modus aus den Spiel-Einstellungen (state.settings.challengeMode): manual | 5 | 10 | limit.
   Der Host (lokal: das Gerät) beendet das Fenster automatisch, Gäste zeigen nur den Countdown. */
let chLastTick = Date.now();
function chTimerHtml(){
  if(!state.chDeadline) return ``;
  return `<div class="draw-caption">⏱ Einspruchsfenster: noch <b id="ch-timer-text">${Math.max(0, Math.ceil((state.chDeadline - Date.now()) / 1000))}</b> s</div>`;
}
function chExpire(){
  state.chDeadline = null;
  NET.depth++;
  try{
    const ch = state.challenge;
    if(ch && ch.caller != null && ch.gap == null) cancelChallenge();   // keine Lücke gewählt: Ruf zurücknehmen, Token zurück
    resolveChallenge();
  } finally { NET.depth--; }
}
function chTick(){
  const now = Date.now(), dt = now - chLastTick;
  chLastTick = now;
  if(state.screen !== "game" || state.phase !== "challenge" || !state.challenge) return;
  const guest = state.online && NET.role === "guest";
  if(!guest && chNewDeadline(false) === null){ state.chDeadline = null; return; }
  if(!state.chDeadline){ if(guest) return; state.chDeadline = chNewDeadline(false); }
  if(!guest && turnDialogOpen()) state.chDeadline += dt;
  const left = state.chDeadline - now;
  const el = document.getElementById("ch-timer-text");
  if(el) el.textContent = Math.max(0, Math.ceil(left / 1000));
  if(left <= 0 && !guest) chExpire();
}

const AUTOSAVE_SECS = [10, 15, 30, 60, 120, 300];

/* ============ ONLINE-LOBBY: BEREIT & REIHENFOLGE WÜRFELN ============
   Gäste setzen ein Bereit-Häkchen; der Host kann erst starten, wenn alle verbundenen Gäste bereit sind.
   Würfeln mischt die Gäste (der Host bleibt technisch Sitz 0) und lost den Startspieler aus: die Zugreihenfolge
   läuft reihum ab diesem Spieler (zusammen ergibt das jede mögliche Reihenfolge). */
function netOrderValid(){ return NET.orderStart != null && NET.orderLen === NET.seats.length && NET.seats.length > 1; }
function netRollOrder(){
  if(NET.role !== "host" || NET.started || NET.resume || NET.seats.length < 2) return;
  const guests = shuffle(NET.seats.slice(1));
  NET.seats = [NET.seats[0], ...guests];
  NET.orderStart = Math.floor(Math.random() * NET.seats.length);
  NET.orderLen = NET.seats.length;
  netBroadcastLobby(); render();
}
function lobbyDiffHtml(host, i, x){
  const me = netSameName(x.name, NET.myName), can = !NET.started && (host || me), d = x.diff || "normal", L = { normal:"Normal", pro:"Profi", expert:"Experte" };
  if(!can) return `<span class="lobby-ready">${L[d]}</span>`;
  return `<select class="dropdown" aria-label="Schwierigkeit" onchange="netSetDiff(${i}, this.value)">${Object.entries(L).map(([k, l]) => `<option value="${k}" ${k === d ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
function netSetDiff(i, v){
  if(!["normal", "pro", "expert"].includes(v)) return;
  if(NET.role === "host"){ const q = NET.seats[i]; if(q){ q.diff = v; netBroadcastLobby(); netUiUpdate(); } } else netSendHost({ t:"diff", v });
}
function netHostDiff(entry, d){
  if(NET.role !== "host" || NET.started || !["normal", "pro", "expert"].includes(d.v)) return;
  const q = NET.seats.find(x => netKey(x.name) === entry.key); if(!q) return; q.diff = d.v; netBroadcastLobby(); netUiUpdate();
}
function lobbyTeamHtml(host, i, x, T){
  const t = x.team || 0, me = netSameName(x.name, NET.myName), can = !NET.started && (host || me);
  if(!can) return `<span class="lobby-ready">Team ${t + 1}</span>`;
  return `<select class="dropdown" aria-label="Team" onchange="netSetTeam(${i}, +this.value)">${Array.from({ length:T }, (_, k) => `<option value="${k}" ${k === t ? "selected" : ""}>Team ${k + 1}</option>`).join("")}</select>`;
}
function netSetTeam(i, v){
  if(NET.role === "host"){ const q = NET.seats[i]; if(q){ q.team = v; netBroadcastLobby(); netUiUpdate(); } }
  else netSendHost({ t:"team", v });
}
function netHostTeam(entry, d){
  const T = ((NET.config && NET.config.settings) || {}).teams || 0;
  if(NET.role !== "host" || NET.started || NET.resume || !T) return;
  const q = NET.seats.find(x => netKey(x.name) === entry.key); if(!q) return;
  q.team = netInt(d.v, 0, 0, T - 1); netBroadcastLobby(); netUiUpdate();
}
function netRandomTeams(){
  const T = ((NET.config && NET.config.settings) || {}).teams || 0;
  if(NET.role !== "host" || NET.started || !T) return;
  const idx = NET.seats.map((_, i) => i).filter(i => NET.seats[i].connected);
  for(let k = idx.length - 1; k > 0; k--){ const j = Math.random() * (k + 1) | 0; [idx[k], idx[j]] = [idx[j], idx[k]]; }
  idx.forEach((i, k) => { NET.seats[i].team = k % T; });
  netBroadcastLobby(); netUiUpdate();
}
function netToggleReady(){
  if(NET.role !== "guest" || NET.status !== "connected") return;
  const me = NET.lobby.seats.find(x => netSameName(x.name, NET.myName));

function netHostReady(entry, d){
  if(NET.role !== "host" || NET.started || NET.resume) return;
  const seat = NET.seats.find(x => netKey(x.name) === entry.key);

/* ============ KONFETTI ============
   big = Sieg (viel), medium = richtige Karte + Bonus-Token, small = richtige Karte bzw. Bonus-Token / erfolgreicher Einspruch.
   Aus bei „Animationen reduzieren“. */
const CF = { parts: [], run: false, cv: null };
let cfLastTs = 0;
function confettiSpawn(n, o){
  const w = innerWidth, h = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const colors = [cs.getPropertyValue("--accent").trim() || "#f5c542", "#ff5d73", "#4cc9f0", "#7bd88f", "#ffd166", "#b388ff"];
  for(let i = 0; i < n; i++){
    let x, y, vx, vy;
    if(o.src === "corners"){ const left = i % 2 === 0; x = left ? 0 : w; y = h; vx = (left ? 1 : -1) * (4 + Math.random() * 9); vy = -(10 + Math.random() * 12); }
    else if(o.src === "top"){ x = Math.random() * w; y = -10; vx = (Math.random() - .5) * 4; vy = 1 + Math.random() * 4; }
    else { x = w / 2 + (Math.random() - .5) * 80; y = h * 0.55; const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, sp = 6 + Math.random() * 8; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp; }
    CF.parts.push({ x, y, vx, vy, g: 0.28 + Math.random() * 0.12, r: Math.random() * 6.28, vr: (Math.random() - .5) * 0.4,
      sz: 6 + Math.random() * 6, c: colors[(Math.random() * colors.length) | 0], life: 0, max: o.life + Math.random() * o.life * 0.5 });
  }
  if(!CF.run){ CF.run = true; requestAnimationFrame(confettiLoop); }
}
function confettiLoop(){
  let cv = CF.cv;
  if(!cv){
    cv = CF.cv = document.createElement("canvas");
    cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9998;";
    document.body.appendChild(cv);
  }
  const dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(innerWidth * dpr) || cv.height !== Math.round(innerHeight * dpr)){ cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  CF.parts = CF.parts.filter(q => q.life < q.max && q.y < innerHeight + 30);
  for(const q of CF.parts){
    q.life++; q.vy += q.g; q.vx *= 0.99; q.vy *= 0.99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
    ctx.globalAlpha = Math.min(1, (q.max - q.life) / (q.max * 0.25));
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.sz / 2, -q.sz / 4, q.sz, q.sz / 2); ctx.restore();
  }
  if(CF.parts.length){ requestAnimationFrame(confettiLoop); }
  else { CF.run = false; if(CF.cv){ CF.cv.remove(); CF.cv = null; } }
}
function confettiBurst(kind){
  if(prefs.reduceMotion) return;
  if(kind === "big"){
    confettiSpawn(110, { src: "corners", life: 140 });
    setTimeout(() => confettiSpawn(90, { src: "top", life: 170 }), 300);
    setTimeout(() => confettiSpawn(90, { src: "corners", life: 140 }), 700);
    setTimeout(() => confettiSpawn(80, { src: "top", life: 170 }), 1200);
  } else confettiSpawn(kind === "medium" ? 70 : 36, { src: "center", life: 80 });
}
function confettiCheck(){
  const r = state.lastResult;
  if(state.screen !== "game" || state.phase !== "feedback" || !r || !r.ts || r.ts === cfLastTs) return;
  cfLastTs = r.ts;
  if(Date.now() - r.ts > 4000) return;   // geladene Spielstände lösen kein Konfetti aus
  const good = r.ok || (r.challenge && r.challenge.success);
  if(good || r.bonusAwarded) confettiBurst(good && r.bonusAwarded ? "medium" : "small");
}

/* Auto-Weiter: zählt im Ergebnis-Bildschirm herunter und klickt dann „Weiter“ (nur wer den Button hat). */
let anKey = "", anDeadline = 0, anLast = Date.now();
function autoNextTick(){
  const now = Date.now(), dt = now - anLast; anLast = now;
  const btn = state.screen === "game" && state.phase === "feedback" ? document.querySelector('button[onclick="nextTurn()"]') : null;
  if(!btn || !prefs.autoNextSec){ anKey = ""; return; }
  const key = ((state.lastResult && state.lastResult.ts) || 0) + ":" + state.correctCount + ":" + state.wrongCount + ":" + (state.turnNo || 0);
  if(key !== anKey){ anKey = key; anDeadline = now + prefs.autoNextSec * 1000; }
  if(turnDialogOpen() || quickMenuOpen) anDeadline += dt;
  const left = Math.max(0, Math.ceil((anDeadline - now) / 1000));
  if(!btn.dataset.base) btn.dataset.base = btn.textContent;
  btn.textContent = btn.dataset.base + " (" + left + ")";
  if(anDeadline - now <= 0){ anDeadline = now + 1e9; btn.click(); }
}

/* Tastatursteuerung: nutzt die vorhandenen Buttons, damit alle Bedingungen (wer darf, welche Phase) gelten. */
let kbGap = null, kbPhase = "";
function kbSync(){ if(state.phase !== kbPhase){ kbPhase = state.phase; kbGap = null; } }
function kbClick(sel){ const b = document.querySelector(sel); if(b){ b.click(); return true; } return false; }
function kbMoveGap(dir){
  const gs = [...document.querySelectorAll(".gap")];
  const ok = gs.map((g, i) => g.classList.contains("locked") ? -1 : i).filter(i => i >= 0);
  if(!ok.length) return false;
  let pos = kbGap == null ? -1 : ok.indexOf(kbGap);
  pos = pos < 0 ? Math.floor((ok.length - 1) / 2) : Math.max(0, Math.min(ok.length - 1, pos + dir));
  kbGap = ok[pos];
  gs.forEach((g, i) => g.classList.toggle("kb", i === kbGap));
  gs[kbGap].scrollIntoView({ block: "nearest", inline: "center", behavior: prefs.reduceMotion ? "auto" : "smooth" });
  return true;
}
function kbConfirm(){
  const gs = [...document.querySelectorAll(".gap")];
  if(kbGap != null && gs[kbGap] && !gs[kbGap].classList.contains("locked")){ gs[kbGap].click(); return true; }
  return kbClick('button[onclick="revealCard()"]') || kbClick('button[onclick="nextTurn()"]') || kbClick('button[onclick*="resolveChallenge"]');
}
document.addEventListener("keydown", e => {
  if(!prefs.keys || e.ctrlKey || e.metaKey || e.altKey || state.screen !== "game") return;
  const t = e.target, tag = t && t.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
  if(tag === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;   // normale Button-Bedienung nicht doppeln
  const k = e.key; let used = false;
  if(paused){ if(k === "Enter" || k === " " || k === "Escape" || k === "p" || k === "P"){ pauseToggle(); e.preventDefault(); } return; }
  if((k === "p" || k === "P") && !state.online && !quickMenuOpen){ pauseToggle(); e.preventDefault(); return; }
  if(document.querySelector('button[onclick="confirmSpend()"]')){
    if(k === "Enter") used = kbClick('button[onclick="confirmSpend()"]');
    else if(k === "Escape") used = kbClick('button[onclick="cancelSpend()"]');
  } else if(quickMenuOpen || turnDialogOpen()) return;
  else if(k === "ArrowLeft" || k === "a" || k === "A") used = kbMoveGap(-1);
  else if(k === "ArrowRight" || k === "d" || k === "D") used = kbMoveGap(1) || kbClick('button[onclick="nextTurn()"]');
  else if(k === "Enter" || k === " ") used = kbConfirm();
  else if(k === "Backspace") used = kbClick('button[onclick="changePosition()"]');
  else if(k === "s" || k === "S") used = kbClick('button[onclick="requestSkip()"]');
  else if(k === "b" || k === "B") used = kbClick('button[onclick="requestBuy()"]');
  if(used) e.preventDefault();
});

function toast(msg){

async function netRematch(){
  if(NET.role !== "host" || !NET.started || !state.online || state.screen === "game") return;
  NET.seats = NET.seats.filter(q => q.connected); NET.rm = null;
  if(NET.seats.length < 2){ toast("Für ein Rematch werden mindestens 2 verbundene Spieler benötigt."); render(); return; }
  const settings = JSON.parse(JSON.stringify(state.settings)), names = NET.seats.map(q => q.name);
  const slot = state.activeSlot, room = state.activeSaveName;
  if(settings.mode === "multiplayer"){ const TS = netTeamSetup(), nm = TS ? TS.names : names; NET.teamOfNew = TS ? TS.teamOf : null; settings.playerCount = nm.length; newGame(settings, nm); if(settings.game) qgInit(); if(settings.handicap) hcApplyNet(); } else newGame(settings);
  state.online = true; state.net = { seats: NET.seats, turn: 0, teamOf: NET.teamOfNew || null }; state.turnNo = state.turnNo || 1;
  const st = Math.floor(Math.random() * NET.seats.length);   // neuer Startspieler
  if(st > 0){
    if(isMulti()){ syncActiveToPlayer(); state.currentPlayer = NET.teamOfNew ? NET.teamOfNew[st] : st; loadActiveFromPlayer(); } else state.net.turn = st;
  }
  state.activeSlot = slot; state.activeSaveName = room;
  NET.lastSig = ""; NET.playedTurn = -1; NET.orderStart = null;
  if(slot){ try{ const snap = JSON.parse(JSON.stringify(state)); snap.savedAt = Date.now(); snap.name = room; snap.turnDeadline = null; snap.chDeadline = null; await writeSlot(slot, snap); }catch(e){} }
  render();
}

  if(NET.role !== "host" || !NET.started || !state.online || state.screen === "game") return;
  NET.seats = NET.seats.filter(q => q.connected);

  NET.rm.votes[entry.key] = true;
  const open = NET.seats.slice(1).filter(q => q.connected && NET.rm.votes[netKey(q.name)] !== true);

function chronGuess(){

    else stats.curStreak = 0;

    const ys = yearStat(), k = dateKey();

function sfxCtx(){

function sfxTone(ctx, pack, t, freq, dur, vol, o){
  o = o || {};

  const v = Math.max(0.0002, vol * (o.abs ? 1 : pack.vol) * sfxMaster());

  if(pack.shimmer && !o.fixed) voices.push({ f: freq * mul * 2.01, to: null, v: v * 0.35, wave: "sine" });
  voices.forEach(x => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = x.wave;
    osc.frequency.setValueAtTime(x.f, t);
    if(x.to) osc.frequency.exponentialRampToValueAtTime(x.to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(x.v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

function sfxNoise(ctx, pack, t, dur, vol, f0, f1){
  const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const flt = ctx.createBiquadFilter(); flt.type = "bandpass";
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  const v = Math.max(0.0002, vol * sfxMaster());
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + dur * 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(ctx.destination);

function netHostPeer(){

        return;

function netHostAccept(conn){

async function netHostAuth(entry, d){

function netHostOnClose(entry){

function netPeriodic(){
