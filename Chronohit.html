function renderGame(){
  const s = state.settings;
  const timeline = state.timeline;

  const gaps = [];
  for(let i=0;i<=timeline.length;i++){
    const isPendingCard = (state.phase === "revealed_pending" || state.phase === "feedback") && state.pendingGap === i;
    gaps.push(i);
  }

  function cardHtml(song, opts={}){
    return `
      <div class="card ${opts.cls||''}">
        ${opts.tag ? `<span class="tag ${opts.tagCls}">${opts.tag}</span>` : ``}
        <div>
          <div class="year">${song.y}</div>
        </div>
        <div>
          <div class="title">${song.t}</div>
          <div class="artist">${song.a}</div>
        </div>
      </div>`;
  }

  function pendingCardHtml(){
    return `<div class="card pending"><div class="q">?</div></div>`;
  }

  let timelineHtml = "";
  for(let i=0;i<=timeline.length;i++){
    const clickable = state.phase === "placing";
    const showPendingHere = (state.phase === "revealed_pending" || state.phase === "feedback") && state.pendingGap === i;

    timelineHtml += `<div class="gap ${clickable ? '' : 'locked'} ${showPendingHere?'active':''}"
        ${clickable ? `onclick="chooseGap(${i})"` : ``}>
        <div class="dot"></div>
      </div>`;

    if(showPendingHere){
      if(state.phase === "revealed_pending"){
        timelineHtml += pendingCardHtml();
      } else if(state.phase === "feedback" && state.lastResult && !state.lastResult.ok){
        timelineHtml += cardHtml(state.lastResult.song, {cls:"wrong", tag:"falsch", tagCls:"bad"});
      }
    }

    if(i < timeline.length){
      const song = timeline[i];
      const isNewlyCorrect = state.phase === "feedback" && state.lastResult && state.lastResult.ok && song === state.lastResult.song;
      timelineHtml += cardHtml(song, {
        cls: isNewlyCorrect ? "correct" : "",
        tag: song.__starter && !isNewlyCorrect ? "Start" : (isNewlyCorrect ? "richtig" : ""),
        tagCls: isNewlyCorrect ? "ok" : "start"
      });
    }
  }

  const tokenDots = Array.from({length:s.maxTokens}, (_,i) => `<span class="${i < state.tokens ? 'filled':''}"></span>`).join("");

  let drawZoneHtml = "";
  if(state.phase === "feedback"){
    const r = state.lastResult;
    const ok = r.ok;
    const song = r.song;
    const diff = r.difficulty || "normal";
    drawZoneHtml = `
      <div class="draw-zone">
        <div class="feedback ${ok?'ok':'bad'}">${ok ? 'Richtig!' : 'Leider falsch.'}</div>
        <div class="draw-caption">${song.t} — ${song.a} · ${song.y}</div>
        ${song.id ? `
          <div class="embed-full">
            <iframe src="https://open.spotify.com/embed/track/${song.id}?utm_source=generator&theme=0"
              loading="lazy" allow="encrypted-media" title="Spotify player"></iframe>
          </div>` : ``}
        ${(diff !== "normal" || (s.tokens && s.mode !== 'coop')) ? `
          <div class="guess-result">
            ${diff !== "normal" ? `
            <div class="row ${r.positionOk ? 'ok':'bad'}">
              <span class="mark">${r.positionOk ? '✓':'✕'}</span>
              <span>Position auf der Zeitleiste</span>
            </div>` : ``}
            <div class="row ${r.guessCheck.titleOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.titleOk ? '✓':'✕'}</span>
              <span>Titel <span class="said">— du: „${esc(r.guessCheck.said.t) || '—'}"</span></span>
            </div>
            <div class="row ${r.guessCheck.artistOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.artistOk ? '✓':'✕'}</span>
              <span>Interpret <span class="said">— du: „${esc(r.guessCheck.said.a) || '—'}"</span></span>
            </div>
            ${diff === "expert" ? `
            <div class="row ${r.guessCheck.yearOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.yearOk ? '✓':'✕'}</span>
              <span>Jahr <span class="said">— du: „${esc(r.guessCheck.said.y) || '—'}"</span></span>
            </div>` : ``}
            ${s.tokens && s.mode !== 'coop' ? `
            <div class="verdict ${r.guessCheck.both ? 'ok':'bad'}">
              ${r.guessCheck.both
                ? (r.bonusAwarded ? `+1 Bonus-Chrono-Token ${icon('token')}` : `Beides richtig — aber dein Chrono-Token-Vorrat ist schon voll (${s.maxTokens}).`)
                : `Kein Bonus-Chrono-Token — Titel &amp; Interpret müssen stimmen.`}
            </div>` : ``}
          </div>
        ` : ``}
        <button class="btn-primary" onclick="nextTurn()">${isMulti() && state.players.length > 1 ? `Weiter: ${esc(state.players[nextPlayerIndex()].name)} ist dran` : 'Nächste Karte'}</button>
      </div>`;
  } else if(state.current){
    const spinning = state.phase === "placing" || state.phase === "revealed_pending";

  `;

  // Zur gerade relevanten Karte scrollen, falls die Zeitleiste breiter
  // als das Fenster geworden ist.
  requestAnimationFrame(() => {
    const wrap = app.querySelector('.timeline-wrap');
    if(!wrap || wrap.scrollWidth <= wrap.clientWidth) return;
    const target = wrap.querySelector('.card.pending, .card.correct, .card.wrong, .gap.active')
                || wrap.querySelector('.timeline > *:last-child');
    if(!target) return;
    const r = target.getBoundingClientRect();
    const w = wrap.getBoundingClientRect();
    wrap.scrollBy({ left: (r.left - w.left) - (w.width/2) + (r.width/2), behavior:'smooth' });
  });
}

function simpleCardHtml(song, isStart, isWrong){
  return `
    <div class="card ${isWrong ? 'wrong' : ''}">
      ${isStart ? `<span class="tag start">Start</span>` : ``}
      ${isWrong ? `<span class="tag bad">falsch</span>` : ``}
      <div><div class="year">${song.y}</div></div>
      <div>
        <div class="title">${song.t}</div>
        <div class="artist">${song.a}</div>
      </div>
    </div>`;
}

function isMultiRound(){ return isMulti() && state.players.length > 1; }

function rankedPlayers(){
  const list = state.players.map((_, i) => ({ i, v: playerView(i) }));
  list.forEach(r => { r.pos = 1 + list.filter(o => o.v.correctCount > r.v.correctCount).length; });
  list.sort((a, b) => (b.v.correctCount - a.v.correctCount) || (a.v.wrongCount - b.v.wrongCount) || (a.i - b.i));
  return list;
}

function renderEnd(){
  const s = state.settings;
  if(isMultiRound()){
    const ranking = rankedPlayers();
    const winners = state.winners || [];
    const heading = winners.length === 1
      ? `${esc(state.players[winners[0]].name)} gewinnt!`
      : `Unentschieden!`;
    const rows = ranking.map(r => `
      <div class="rank-row ${winners.includes(r.i) ? 'winner' : ''}">
        <span class="rank-pos">${r.pos}.</span>
        <span class="rank-name">${esc(r.v.name)}</span>
        <span class="rank-score"><b>${r.v.correctCount}</b> / ${s.target} · ${r.v.wrongCount} falsch</span>
      </div>`).join('');
    app.innerHTML = `
      <div class="brand">
        <div class="mark">SPIELENDE</div>
      </div>
      <div class="menu-card win-card">
        <div class="end-heading won">${heading}</div>
        ${winners.length > 1 ? `<p>${winners.map(i => esc(state.players[i].name)).join(' &amp; ')}</p>` : ``}
        <div class="rank-list">${rows}</div>
        <div class="menu-actions" style="margin-top:18px;">
          <button class="btn-primary" onclick="showFinalTimeline()">Finale Zeitleisten ansehen</button>
          <button class="btn-ghost" onclick="abandonGame()">Hauptmenü</button>
        </div>
      </div>
    `;
    return;
  }
  app.innerHTML = `
    <div class="brand">
      <div class="mark">RUNDE BEENDET</div>
    </div>
    <div class="menu-card win-card">
      <div class="end-heading ${state.won ? 'won' : 'lost'}">${state.won ? 'Gewonnen!' : 'Verloren!'}</div>
      <div class="num">${state.correctCount}</div>
      <p>richtig platzierte Karten auf deiner Zeitleiste</p>
      <div class="win-stats">
        <div><div class="n">${state.wrongCount}</div><div class="l">Falsch platziert</div></div>
        ${s.tokens ? `<div><div class="n">${state.tokens}</div><div class="l">Chrono-Tokens übrig</div></div>` : ``}

      </div>

        <button class="btn-primary" onclick="showFinalTimeline()">Finale Zeitleiste ansehen</button>
        <button class="btn-ghost" onclick="abandonGame()">Hauptmenü</button>
      </div>
    </div>
  `;
}

function showFinalTimeline(){
  state.showWrongOnTimeline = false;
  state.screen = "timeline";
  render();
}

function toggleShowWrong(){
  state.showWrongOnTimeline = !state.showWrongOnTimeline;
  render();
}

function timelineCardsHtml(timeline, wrongSongs, showWrong){
  let items = timeline.map(song => ({ song, wrong:false }));
  if(showWrong && wrongSongs.length){
    // Falsche Songs chronologisch (nach Jahr) einsortieren; bei Gleichstand nach den richtigen
    wrongSongs.forEach(song => {
      let idx = items.findIndex(it => it.song.y > song.y);
      if(idx === -1) idx = items.length;
      items.splice(idx, 0, { song, wrong:true });
    });
  }
  return items.map(it => simpleCardHtml(it.song, !it.wrong && !!it.song.__starter, it.wrong)).join('');
}

function renderTimelineOnly(){
  const multi = isMultiRound();
  const wrongTotal = multi
    ? state.players.reduce((sum, _, i) => sum + (playerView(i).wrongSongs || []).length, 0)
    : (state.wrongSongs || []).length;
  const toggleHtml = wrongTotal ? `
    <div class="wrong-toggle">
      <span>Falsch geratene Songs anzeigen <span class="wrong-count">(${wrongTotal})</span></span>
      <div class="switch ${state.showWrongOnTimeline ? 'on' : ''}" onclick="toggleShowWrong()"><div class="knob"></div></div>
    </div>` : `<div class="wrong-toggle none">Keine falsch geratenen Songs — stark!</div>`;

  let body;
  if(multi){
    body = rankedPlayers().map(r => `
      <div class="player-section">
        <h3>${esc(r.v.name)}</h3>
        <div class="sub">${r.v.correctCount} richtig · ${r.v.wrongCount} falsch</div>
        <div class="timeline-wrap">
          <div class="timeline final-view">${timelineCardsHtml(r.v.timeline, r.v.wrongSongs || [], state.showWrongOnTimeline)}</div>
        </div>
      </div>`).join('');
  } else {
    body = `
      <div class="timeline-wrap">
        <div class="timeline final-view">${timelineCardsHtml(state.timeline, state.wrongSongs || [], state.showWrongOnTimeline)}</div>
      </div>`;
  }
  app.innerHTML = `
    <div class="brand">
      <div class="mark">${multi ? 'SPIELENDE' : (state.won ? 'GEWONNEN' : 'VERLOREN')}</div>
      <h1 style="font-size:28px;">${multi ? 'Finale Zeitleisten' : 'Finale Zeitleiste'}</h1>
    </div>
    ${toggleHtml}
    ${body}
    <div class="menu-actions" style="margin-top:24px;">
      <button class="btn-primary" onclick="requestDeleteOnFinish()">Hauptmenü</button>
    </div>
    ${state.confirmDeleteOnFinish ? renderDeleteOnFinishModal() : ``}
  `;
}
function requestDeleteOnFinish(){
  state.confirmDeleteOnFinish = true;
  render();
}
function cancelDeleteOnFinish(){
  state.confirmDeleteOnFinish = false;
  render();
}
function keepAndGoToMenu(){
  state.confirmDeleteOnFinish = false;

}

        <div class="modal-actions">

function updateDocumentTitle(){
  const map = {
    splash: "Chronohit",
    loading: "Lädt... - Chronohit",
    menu: "Hauptmenü - Chronohit",
    loadgame: "Spielstände - Chronohit",
    tutorial: "Tutorial - Chronohit",
    settings: "Einstellungen - Chronohit",
    create: "Spiel erstellen - Chronohit",
    game: `${state.activeSaveName ? state.activeSaveName : "Unbenannt"} - Chronohit`,
    end: `${isMultiRound() ? "Spielende" : (state.won ? "Gewonnen" : "Verloren")} - Chronohit`,
    timeline: "Zeitleiste - Chronohit"
  };
  document.title = map[state.screen] || "Chronohit";
}

function render(){
  if(state.screen === "splash") renderSplash();
  else if(state.screen === "loading") renderLoading();
  else if(state.screen === "menu") renderMenu();
  else if(state.screen === "loadgame") renderLoadGame();
  else if(state.screen === "tutorial") renderTutorial();
  else if(state.screen === "settings") renderSettings();
  else if(state.screen === "create") renderCreateGame();
  else if(state.screen === "game") renderGame();
  else if(state.screen === "end") renderEnd();
  else if(state.screen === "timeline") renderTimelineOnly();

  updateDocumentTitle();
}

function plannedFeatureNotice(){

function setMode(value){
  state.settings.mode = value;
  render(); saveState();
}
function setDifficulty(value){
  state.settings.difficulty = value;
  render(); saveState();
}
function toggleSetting(key){
  state.settings[key] = !state.settings[key];
  render(); saveState();
}
function toggleGenre(key){
  const g = state.settings.genres;
  const activeCount = Object.values(g).filter(Boolean).length;
  if(g[key] && activeCount === 1) return; // mindestens eine Sprache muss aktiv bleiben
  g[key] = !g[key];
  render(); saveState();
}
function stepTarget(delta){
  const t = state.settings.target + delta;
  if(t < 5 || t > 15) return;
  state.settings.target = t;
  render(); saveState();
}
function stepMaxTokens(delta){
  const m = state.settings.maxTokens + delta;
  if(m < 3 || m > 15) return;
  state.settings.maxTokens = m;
  if(state.tokens > m){ state.tokens = m; }   // laufende Runde ggf. kappen
  render(); saveState();
}

async function resumeGame(){
  const saved = await loadSave();
  if(saved){
    state = saved;
    // Felder aus älteren Spielständen nachziehen
    if(!state.guess) state.guess = { t:"", a:"", y:"" };
    if(state.guessResult === undefined) state.guessResult = null;
    if(typeof state.correctCount !== "number") state.correctCount = 0;
    if(typeof state.settings.maxTokens !== "number") state.settings.maxTokens = 5;
  if(typeof state.settings.startTokens !== "number") state.settings.startTokens = 2;
  if(!state.settings.mode) state.settings.mode = "solo";
  if(!state.settings.difficulty) state.settings.difficulty = "normal";
    state.pendingSpend = null;
    state.saveSlotDialogOpen = false;
    state.confirmDeleteSlot = null;
    state.playersDrawerOpen = false;
    state.openPlayerPanels = [];
    if(!Array.isArray(state.players)) state.players = [];
    if(isMulti()) syncActiveToPlayer();
    state.screen = "game";
    render();
  }
}

function hexToRgba(hex, alpha){
  const h = hex.replace("#","");
  return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${alpha})`;
}
function mixHex(hex, towardHex, amount){
  const a = hex.replace("#",""), b = towardHex.replace("#","");
  const ch = (s,i) => parseInt(s.substring(i,i+2),16);
  const mix = i => Math.round(ch(a,i) + (ch(b,i) - ch(a,i)) * amount);
  const toHex = n => n.toString(16).padStart(2,"0");
  return "#" + toHex(mix(0)) + toHex(mix(2)) + toHex(mix(4));
}
function relativeLuminance(hex){
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function ensureGoogleFont(query){
  if(!query) return;
  const id = "gf-" + query.split(":")[0];
  if(document.getElementById(id)) return;
  const link = document.createElement("link");
  link.id = id;
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${query}&display=swap`;
  document.head.appendChild(link);
}

function clearCustomOverrides(){
  const root = document.documentElement.style;
  CUSTOM_PROPS.forEach(p => root.removeProperty(p));
}
function applyCustomTheme(){
  const c = customTheme;
  const root = document.documentElement.style;
  root.setProperty("--bg", c.bg);
  root.setProperty("--bg-2", mixHex(c.bg, "#ffffff", 0.06));
  root.setProperty("--bg-highlight", mixHex(c.bg, "#ffffff", 0.12));
  root.setProperty("--panel", hexToRgba(c.panel, c.opacity));
  root.setProperty("--panel-2", hexToRgba(mixHex(c.panel, "#ffffff", 0.08), c.opacity));
  root.setProperty("--line", hexToRgba(mixHex(c.bg, "#ffffff", 0.3), Math.max(c.opacity, 0.5)));
  root.setProperty("--text", c.text);
  root.setProperty("--muted", mixHex(c.text, c.bg, 0.45));
  root.setProperty("--accent", c.accent);
  root.setProperty("--accent-ink", relativeLuminance(c.accent) > 0.55 ? "#14151d" : "#ffffff");
  root.setProperty("--correct", c.correct);
  root.setProperty("--wrong", c.wrong);
  root.setProperty("--panel-blur", c.opacity < 1 ? Math.round((1 - c.opacity) * 24 + 4) + "px" : "0px");
  const f = FONT_OPTIONS.find(x => x.key === c.font) || FONT_OPTIONS[0];
  ensureGoogleFont(f.google);
  root.setProperty("--heading-font", f.family);
  root.setProperty("--body-font", f.family);
  root.setProperty("--body-bg-image", "none");
}

function applyTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  if(theme === "custom"){ applyCustomTheme(); }
  else { clearCustomOverrides(); }
  try{ localStorage.setItem(THEME_STORAGE_KEY, theme); }catch(e){ /* best effort */ }
}
function loadTheme(){
  loadCustomTheme();
  let saved = null;
  try{ saved = localStorage.getItem(THEME_STORAGE_KEY); }catch(e){}
  applyTheme(saved && THEME_INFO.some(t => t.key === saved) ? saved : "og");
}

function setCustomColor(key, value){
  customTheme[key] = value;
  applyCustomTheme();
  saveCustomTheme();
}
function setCustomOpacity(value){
  customTheme.opacity = parseFloat(value);
  applyCustomTheme();
  saveCustomTheme();
}
function setCustomFont(value){
  customTheme.font = value;
  applyCustomTheme();
  saveCustomTheme();
}
function resetCustomTheme(){
  customTheme = { ...CUSTOM_THEME_DEFAULTS };
  saveCustomTheme();
  applyCustomTheme();
  render();
}

/* ============ INIT ============ */
(async function init(){
  loadTheme();
  slotsCache = await loadAllSlots();
  const saved = await loadSave();
  if(saved){
    state.settings = saved.settings || state.settings;
    if(typeof state.settings.maxTokens !== "number") state.settings.maxTokens = 5;
  if(typeof state.settings.startTokens !== "number") state.settings.startTokens = 2;
  if(!state.settings.mode) state.settings.mode = "solo";
  if(!state.settings.difficulty) state.settings.difficulty = "normal";
    state.hasSave = saved.screen === "game";
  }
  render();
})();
</script>
