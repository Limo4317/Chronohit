        <p><strong>1. Abspielen:</strong> Du ziehst eine Karte und klickst auf die Schallplatte — der Song spielt unsichtbar im Hintergrund über Spotify, du siehst weder Titel noch Cover. Nochmal auf die Schallplatte klicken pausiert/setzt fort. Mit Spotify Premium läuft der ganze Song, sonst die 30-Sekunden-Vorschau. Falls die Steuerung mal blockiert wird (z. B. durch einen Adblocker), springt das Spiel automatisch auf einen sichtbaren, aber zugeschnittenen Player um.</p>
        <p style="font-size:calc(13px * var(--font-scale));">Hinweis: Bei einem Song (Enrique Iglesias' "Bailando") lag nur ein Album- statt Track-Link vor — dort öffnet sich stattdessen eine Spotify-Suche in neuem Tab, wo der Titel sichtbar ist.</p>
        <p><strong>2. Platzieren:</strong> Ohne das Jahr zu kennen, legst du die Karte an die Stelle deiner Zeitleiste, die du für chronologisch richtig hältst.</p>
        <p><strong>3. Aufdecken:</strong> Die Karte wird umgedreht. Liegt sie richtig, bleibt sie liegen und zählt einen Punkt für deinen Sieg (die Startkarte zählt nicht). Liegt sie falsch, kommt sie auf den Ablagestapel.</p>
        <p><strong>Schwierigkeit:</strong><br>
          <strong>Normal</strong> — nur die Position zählt.<br>
          <strong>Profi</strong> — Titel &amp; Interpret müssen vor dem Aufdecken zusätzlich stimmen.<br>
          <strong>Experte</strong> — zusätzlich auch das exakte Erscheinungsjahr.</p>
        <p><strong>Koop-Modus:</strong> Ihr startet gemeinsam mit einer festen Anzahl Chrono-Tokens (1–10, einstellbar) und einer Startkarte. Jede falsch platzierte Karte kostet einen Token — Skip/Kaufen gibt es hier nicht, die Tokens sind eure gemeinsamen Leben. Erreicht ihr 0 Tokens, bevor die Zielkartenzahl erreicht ist, habt ihr verloren; schafft ihr die Zielkartenzahl vorher, habt ihr gewonnen.</p>
        <p><strong>Chrono-Tokens (falls aktiviert, außerhalb von Koop):</strong> Start- und Maximalwert sind einstellbar.</p>
        <p>&bull; <strong>Song unbekannt?</strong> Wirf für 1 Chrono-Token die aktuelle Karte ab und ziehe eine neue, ohne sie zu platzieren.</p>
        <p>&bull; <strong>Karte kaufen:</strong> Für 3 Chrono-Tokens wird die nächste gezogene Karte garantiert korrekt in deine Zeitleiste einsortiert — ganz ohne Rateversuch und ohne Risiko.</p>
        <p>&bull; <strong>Bonus-Chrono-Token:</strong> Sobald du Titel und Interpret richtig eintippst, gibt es einen weiteren Chrono-Token — in jedem Schwierigkeitsgrad, auch wenn das Eintippen in Profi/Experte ohnehin Pflicht fürs Zählen der Karte ist. Verglichen wird großzügig: Groß-/Kleinschreibung, Akzente, Umlaut-Schreibweisen und Tippfehler werden verziehen.</p>
        <p><strong>Spielstände:</strong> Beim Erstellen eines Spiels wählst du einen von 4 Speicherplätzen und einen Namen. Über den 💾-Button im Spiel speicherst du jederzeit in genau diesen Slot.</p>
      </div>
    </div>
    <div class="menu-actions">
      <button class="btn-ghost" onclick="backToMenuInstant()">← Zurück zum Hauptmenü</button>
    </div>
  `;
}

/* Weiches "Gleiten" bei Umsortierungen (FLIP): Positionen vor der Änderung merken, danach
   jedes Element von seiner alten Position aus an die neue animieren. Die Ansicht wird bei
   jeder Änderung neu aufgebaut, daher identifizieren wir Elemente über data-flip. */
function flipAnimate(itemSelector, mutate){
  const before = {};
  document.querySelectorAll(itemSelector).forEach(el => { before[el.dataset.flip] = el.getBoundingClientRect(); });
  mutate();
  if(prefs.reduceMotion) return;
  document.querySelectorAll(itemSelector).forEach(el => {
    const b = before[el.dataset.flip];
    if(!b) return;
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if(!dx && !dy) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.position = el.style.position || "relative";
    el.style.zIndex = "2";
    el.getBoundingClientRect();   // Reflow erzwingen, damit der Startwert greift
    el.style.transition = "transform .4s cubic-bezier(.22, .9, .3, 1)";
    el.style.transform = "";
    const done = () => { el.style.transition = ""; el.style.zIndex = ""; el.style.position = ""; };
    el.addEventListener("transitionend", done, { once:true });
    setTimeout(done, 550);
  });
}

function wizardStepPlayerCount(delta){
  const w = state.wizard;
  const n = w.playerCount + delta;
  if(n < 1 || n > 10) return;
  w.playerCount = n;
  while(w.playerNames.length < n){ w.playerNames.push(""); w.playerIds.push(w.nextPlayerId++); }
  while(w.playerNames.length > n){ w.playerNames.pop(); w.playerIds.pop(); }
  render();
}

  const w = state.wizard;
  const j = i + dir;

  flipAnimate(".player-row", () => {
    [w.playerNames[i], w.playerNames[j]] = [w.playerNames[j], w.playerNames[i]];
    [w.playerIds[i], w.playerIds[j]] = [w.playerIds[j], w.playerIds[i]];

}

// Auswahl aus dem Wizard in Settings übersetzen (null = alles)
function songFilterFromWizard(w){
  const pick = m => Object.values(m).every(Boolean) ? null : Object.keys(m).filter(k => m[k]);
  return {
    genres: { ...w.genres },
    styles: pick(w.styles),
    decades: (() => { const p = pick(w.decades); return p ? p.map(Number) : null; })(),
    themes: pick(w.themes)
  };
}
const FILTER_DEFS = {
  genres:  { label:"Sprache",    infoKey:"w-langs",
             desc:"In welchen Sprachen die Songs sein sollen. Es werden nur Sprachen angezeigt, für die Songs vorhanden sind." },
  styles:  { label:"Genre",      infoKey:"w-styles",
             desc:"Ein Song kann mehrere Genres haben. Es reicht, wenn <strong>eines</strong> davon aktiv ist — ein Pop-Rock-Song ist also dabei, sobald Pop <em>oder</em> Rock an ist." },
  decades: { label:"Jahrzehnt",  infoKey:"w-decades",
             desc:"Aus welchen Jahrzehnten die Songs stammen sollen (wird automatisch aus dem Erscheinungsjahr bestimmt)." },
  themes:  { label:"Kategorien", infoKey:"w-themes",
             desc:"Besondere Sammlungen, z. B. Filmmusik oder Balladen. Auch hier reicht ein Treffer. „Sonstige“ sind alle Songs ohne besondere Kategorie." }
};
function filterItems(key){
  return key === "genres" ? LIB.langs : key === "styles" ? LIB.styles : key === "decades" ? LIB.decades : LIB.themes;
}
function stageKeysOf(song, key){
  return key === "genres" ? [song.g]
       : key === "styles" ? (song.s || [])
       : key === "decades" ? [String(decadeOf(song.y))]
       : songThemes(song);
}
// Die Gruppen arbeiten der Reihe nach: jede sucht nur in den Songs, die die Gruppen davor übrig lassen.
function wizardStages(){
  const w = state.wizard;
  const f = songFilterFromWizard(w);
  let pool = SONGS;
  const stages = [];
  w.filterOrder.forEach(key => {
    const counts = {};
    pool.forEach(s => stageKeysOf(s, key).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
    const next = pool.filter(s => songMatches(s, { [key]: f[key] }));
    stages.push({ key, counts, incoming: pool.length, after: next.length });
    pool = next;
  });
  return { stages, final: pool.length };
}
function wizardMoveFilter(key, dir){
  const order = state.wizard.filterOrder;
  const i = order.indexOf(key), j = i + dir;
  if(i < 0 || j < 0 || j >= order.length) return;
  flipAnimate(".chip-group", () => {
    [order[i], order[j]] = [order[j], order[i]];
    render();
  });
}
function wizardPoolSize(){ return wizardStages().final; }
function wizardPoolNeeded(){
  const w = state.wizard;
  const starters = w.mode === "multiplayer" ? w.playerCount : 1;
  return starters + w.target + 1;
}
function wizardToggleGenre(key){
  const g = state.wizard.genres;
  const activeCount = Object.values(g).filter(Boolean).length;
  if(g[key] && activeCount === 1) return;
  g[key] = !g[key];
  render();
}

  return `

        : 'Leere Namen werden zu „Spieler 1“, „Spieler 2“ usw. Die Reihenfolge wird beim Start zufällig ausgelost.'}</div>
    </div>`;
}
function renderCreateGame(){
  const w = state.wizard;
  const keys = wizardStepKeys();
  const total = keys.length;
  const key = keys[w.step - 1];
  const stepContent =
    key === "slot" ? renderWizardStep1() :
    key === "online" ? renderWizardOnline() :
    key === "mode" ? renderWizardStep2() :
    key === "players" ? renderWizardPlayers(w.step) :
    key === "settings" ? renderWizardStep3(w.step) :
    renderWizardStep4(w.step);
  app.innerHTML = `
    <div class="brand">
      <h1 style="font-size:calc(30px * var(--font-scale));">${w.online ? 'Online-Spiel hosten' : 'Spiel erstellen'}</h1>
      <div class="wizard-steps">${keys.map((_, i) => { const n = i + 1; return `<span class="wizard-dot ${w.step===n?'active':''} ${w.step>n?'done':''}"></span>`; }).join('')}</div>
    </div>
    ${stepContent}
    ${w.err ? `<div class="planned-notice" style="border-color:var(--wrong); margin-top:12px;">${esc(w.err)}</div>` : ``}
    <div class="menu-actions wizard-actions">
      <button class="btn-ghost" onclick="wizardBack()">${w.step===1?'Abbrechen':'← Zurück'}</button>
      ${w.step < total
        ? `<button class="btn-primary" onclick="wizardNext()">Weiter</button>`
        : `<button class="btn-primary" onclick="createGameFromWizard()" ${wizardPoolSize() < wizardPoolNeeded() ? 'disabled' : ''}>${w.online ? 'Raum öffnen' : 'Spiel erstellen'}</button>`}
    </div>
  `;
}
async function createGameFromWizard(){
  const w = state.wizard;
  if(w.online) return netHostFromWizard();
  const settings = w.mode === "coop" ? {
    tokens: true,
    target: w.target,
    maxTokens: w.coopTokens,
    startTokens: w.coopTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0,
    ...songFilterFromWizard(w)
  } : {
    tokens: w.tokens,
    target: w.target,
    maxTokens: w.maxTokens,
    startTokens: w.startTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0,
    ...songFilterFromWizard(w)
  };
  const slotNum = w.slot;
  const saveName = (w.name || "").trim();
  let playerNames = null;
  if(w.mode === "multiplayer"){
    // Leere Namen vor dem Mischen auffüllen, damit "Spieler 3" auch nach dem Auslosen "Spieler 3" bleibt
    playerNames = w.playerNames.map((nm, i) => (nm || "").trim() || `Spieler ${i+1}`);
    if(w.orderMode === "random") playerNames = shuffle(playerNames);
    settings.playerCount = playerNames.length;
  }
  state.wizard = null;
  newGame(settings, playerNames);
  state.activeSlot = slotNum;
  state.activeSaveName = saveName;
  const snapshot = JSON.parse(JSON.stringify(state));
  snapshot.savedAt = Date.now();
  snapshot.name = saveName;
  await writeSlot(slotNum, snapshot);
  render();
}

function requestOverwriteSave(){
  state.confirmOverwriteSave = true;
  render();
}
function cancelOverwriteSave(){
  state.confirmOverwriteSave = false;
  render();
}
async function confirmOverwriteSaveNow(){
  const n = state.activeSlot;
  state.confirmOverwriteSave = false;
  if(n){
    const snapshot = JSON.parse(JSON.stringify(state));
    snapshot.savedAt = Date.now();
    snapshot.name = state.activeSaveName;
    await writeSlot(n, snapshot);
  } else {
    // Fallback für Spielstände ohne gebundenen Slot (z.B. sehr alte Spielstände)
    state.saveSlotDialogOpen = true;
  }
  render();
}

function renderTag(song, timeline, idxInTimeline){
  if(idxInTimeline === 0 && song.__starter) return `<span class="tag start">Start</span>`;
  return "";
}

function toggleDrawer(){
  state.playersDrawerOpen = !state.playersDrawerOpen;
  ["players-drawer", "players-backdrop", "players-handle"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle("open", state.playersDrawerOpen);
  });

function togglePlayerPanel(i){
  if(!Array.isArray(state.openPlayerPanels)) state.openPlayerPanels = [];
  const k = state.openPlayerPanels.indexOf(i);
  if(k >= 0) state.openPlayerPanels.splice(k, 1); else state.openPlayerPanels.push(i);
  const el = document.getElementById("pp-" + i);
  if(el) el.classList.toggle("open", k < 0);
}
function renderPlayersDrawer(){
  if(!isMulti() || state.players.length < 2) return "";
  const s = state.settings;
  const open = !!state.playersDrawerOpen;
  const openPanels = state.openPlayerPanels || [];
  const rows = state.players.map((_, i) => {

          <span class="pp-stats">${v.correctCount}/${s.target}${s.tokens ? ` · ${v.tokens} ${icon('token')}` : ''}</span>

function renderGame(){
  const s = state.settings;
  const timeline = state.timeline;
  const online = !!state.online;
  const canAct = !online || (netMyTurn() && netWaitingSeat() < 0);
  const canNext = !online || canAct || NET.role === "host";

  const gaps = [];
  for(let i=0;i<=timeline.length;i++){
    const isPendingCard = (state.phase === "revealed_pending" || state.phase === "feedback") && state.pendingGap === i;
    gaps.push(i);
  }

  function cardHtml(song, opts={}){
    return `
      <div class="card ${opts.cls||''}">
        ${opts.tag ? `<span class="tag ${opts.tagCls}">${opts.tag}</span>` : ``}
        <div>
          <div class="year">${song.y}</div>
        </div>
        <div>
          <div class="title">${song.t}</div>
          <div class="artist">${song.a}</div>

  function pendingCardHtml(){
    return `<div class="card pending"><div class="q">?</div></div>`;

  let timelineHtml = "";
  for(let i=0;i<=timeline.length;i++){
    const clickable = state.phase === "placing" && canAct;
    const showPendingHere = (state.phase === "revealed_pending" || state.phase === "feedback") && state.pendingGap === i;

    timelineHtml += `<div class="gap ${clickable ? '' : 'locked'} ${showPendingHere?'active':''}"
        ${clickable ? `onclick="chooseGap(${i})"` : ``}>

    if(showPendingHere){
      if(state.phase === "revealed_pending"){
        timelineHtml += pendingCardHtml();

    }

    if(i < timeline.length){
      const song = timeline[i];
      const isNewlyCorrect = state.phase === "feedback" && state.lastResult && state.lastResult.ok && song === state.lastResult.song;
      timelineHtml += cardHtml(song, {
        cls: isNewlyCorrect ? "correct" : "",
        tag: song.__starter && !isNewlyCorrect ? "Start" : (isNewlyCorrect ? "richtig" : ""),
        tagCls: isNewlyCorrect ? "ok" : "start"

  const tokenDots = Array.from({length:s.maxTokens}, (_,i) => `<span class="${i < state.tokens ? 'filled':''}"></span>`).join("");

  let drawZoneHtml = "";
  if(state.phase === "feedback"){

        ${(!r.timedOut && (diff !== "normal" || (s.tokens && s.mode !== 'coop'))) ? `

            <div class="row ${r.positionOk ? 'ok':'bad'}">

            </div>` : ``}
            <div class="row ${r.guessCheck.titleOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.titleOk ? '✓':'✕'}</span>
              <span>Titel <span class="said">— du: „${esc(r.guessCheck.said.t) || '—'}"</span></span>
            </div>
            <div class="row ${r.guessCheck.artistOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.artistOk ? '✓':'✕'}</span>
              <span>Interpret <span class="said">— du: „${esc(r.guessCheck.said.a) || '—'}"</span></span>
            </div>
            ${diff === "expert" ? `
            <div class="row ${r.guessCheck.yearOk ? 'ok':'bad'}">
              <span class="mark">${r.guessCheck.yearOk ? '✓':'✕'}</span>

      </div>`;
  } else if(state.current){
    const spinning = state.phase === "placing" || state.phase === "revealed_pending";
    const showPlaybackUI = (state.phase === "placing" || state.phase === "revealed_pending") && state.current.id;

    drawZoneHtml = `

        ${state.skippedInfo ? `

          </button>
        </div>
        ${(state.phase === "placing" || state.phase === "revealed_pending") ? turnTimerHtml() : ``}
        ${showPlaybackUI ? (useFallbackEmbed ? `
          <div class="embed-crop">

          <div class="preview-bar running"><div class="fill"></div></div>

        ` : `

          ${s.tokens && s.mode !== 'coop' && canAct ? `

          </div>` : ``}
        ` : ``}
        ${state.phase === "placing" ? `
          ${!canAct ? netWatchCaption() : `<div class="draw-caption">${state.current.id ? 'Klicke auf der Zeitleiste die Stelle an, wo die Karte hin soll.' : 'Song läuft auf Spotify (neuer Tab). Klicke auf der Zeitleiste die Stelle an, wo die Karte hin soll.'}</div>`}
          ${s.tokens && s.mode !== 'coop' && canAct ? `
          <div class="draw-actions">
            <button class="btn-ghost btn-small" onclick="requestSkip()" ${state.tokens<1?'disabled':''}>Song unbekannt — überspringen (1 ${icon('token')})</button>
          </div>` : ``}
        ` : ``}
        ${state.phase === "revealed_pending" ? `
          <div class="draw-caption">Karte liegt bereit. Aufdecken?</div>

          <div class="guess-box">

              s.difficulty === 'expert' ? 'Titel, Interpret &amp; Jahr — Pflicht für den Punkt!'

            }</div>
            <input class="guess-input" type="text" autocomplete="off" spellcheck="false"
              placeholder="Titel" value="${esc(state.guess.t)}"
              oninput="state.guess.t=this.value; netGuessSend()" ${canAct ? '' : 'readonly'}>
            <input class="guess-input" type="text" autocomplete="off" spellcheck="false"
              placeholder="Interpret" value="${esc(state.guess.a)}"
              oninput="state.guess.a=this.value; netGuessSend()" ${canAct ? '' : 'readonly'}>
            ${s.difficulty === 'expert' ? `
            <input class="guess-input" type="number" inputmode="numeric" autocomplete="off"
              placeholder="Jahr (z.B. 1998)" value="${esc(state.guess.y)}"
              oninput="state.guess.y=this.value; netGuessSend()" ${canAct ? '' : 'readonly'}>` : ``}
            <div class="guess-hint">${
              s.difficulty !== 'normal'
                ? 'Tippfehler, Akzente und Groß-/Kleinschreibung sind egal. Position, Titel & Interpret' + (s.difficulty==='expert' ? ' & exaktes Jahr' : '') + ' müssen stimmen, sonst zählt die Karte nicht.'
                : 'Tippfehler, Akzente und Groß-/Kleinschreibung sind egal — „enrike iglesias" zählt. Leer lassen = kein Rateversuch.'
            }</div>
          </div>` : ``}
          ${canAct ? `<div class="reveal-actions">
            <button class="btn-ghost btn-small" onclick="changePosition()">Position ändern</button>
            <button class="btn-primary" onclick="revealCard()">Aufdecken</button>
          </div>` : `<div class="draw-caption">${esc((netSeatsNow()[netActiveSeat()] || {}).name || '')} deckt gleich auf …</div>`}
        ` : ``}

  }

    <div class="topbar">
      <div class="stat">Richtig <b>${state.correctCount} / ${s.target}</b></div>
      <div class="stat">Stapel <b>${deckSize()}</b></div>

      <div class="turn-banner">

            ${online && NET.role === "guest" ? `<button class="btn-danger" onclick="netLeave()">Raum verlassen</button>` : `<button class="btn-primary" onclick="saveAndMenu()">Speichern und zum Menü</button>
            <button class="btn-danger" onclick="discardAndMenu()">Ohne Speichern zum Menü</button>`}
            <button class="btn-ghost" onclick="closeExitDialog()">Zurück zum Spiel</button>
          </div>
        </div>
      </div>
    ` : ``}

    ${state.pendingSpend ? `
      <div class="modal-backdrop" onclick="if(event.target===this) cancelSpend()">
        <div class="modal-box">
          <h3>Chrono-Tokens ausgeben?</h3>
          <p>${state.pendingSpend.type === "buy"
            ? "Willst du wirklich 3 Chrono-Tokens ausgeben, um diese Karte garantiert richtig einsortiert auf deine Zeitleiste zu legen?"
            : "Willst du wirklich 1 Chrono-Token ausgeben, um diesen Song zu überspringen und eine neue Karte zu ziehen?"}</p>
          <div class="modal-actions">
            <button class="btn-primary" onclick="confirmSpend()">Ja, ${state.pendingSpend.amount} ${icon('token')} ausgeben</button>
            <button class="btn-ghost" onclick="cancelSpend()">Abbrechen</button>
          </div>
        </div>
      </div>
    ` : ``}

    ${state.saveSlotDialogOpen ? renderSaveSlotModal() : ``}
    ${state.confirmOverwriteSave ? renderOverwriteConfirmModal() : ``}
    ${state.confirmDeleteSlot ? renderDeleteSlotModal() : ``}
  `;

  // Zur gerade relevanten Karte scrollen, falls die Zeitleiste breiter
  // als das Fenster geworden ist.
  requestAnimationFrame(() => {
    const wrap = app.querySelector('.timeline-wrap');
    if(!wrap || wrap.scrollWidth <= wrap.clientWidth) return;
    const target = wrap.querySelector('.card.pending, .card.correct, .card.wrong, .gap.active')
                || wrap.querySelector('.timeline > *:last-child');
    if(!target) return;
    const r = target.getBoundingClientRect();
    const w = wrap.getBoundingClientRect();
    wrap.scrollBy({ left: (r.left - w.left) - (w.width/2) + (r.width/2), behavior: prefs.reduceMotion ? 'auto' : 'smooth' });
  });
}

function simpleCardHtml(song, isStart, isWrong){
  return `
    <div class="card ${isWrong ? 'wrong' : ''}">
      ${isStart ? `<span class="tag start">Start</span>` : ``}
      ${isWrong ? `<span class="tag bad">falsch</span>` : ``}
      <div><div class="year">${song.y}</div></div>
      <div>
        <div class="title">${song.t}</div>
        <div class="artist">${song.a}</div>
      </div>
    </div>`;
}

function isMultiRound(){ return isMulti() && state.players.length > 1; }

function rankedPlayers(){
  const list = state.players.map((_, i) => ({ i, v: playerView(i) }));
  list.forEach(r => { r.pos = 1 + list.filter(o => o.v.correctCount > r.v.correctCount).length; });
  list.sort((a, b) => (b.v.correctCount - a.v.correctCount) || (a.v.wrongCount - b.v.wrongCount) || (a.i - b.i));
  return list;
}

function renderEnd(){
  const s = state.settings;
  if(isMultiRound()){
    const ranking = rankedPlayers();
    const winners = state.winners || [];
    const heading = winners.length === 1

    const rows = ranking.map(r => `
      <div class="rank-row ${winners.includes(r.i) ? 'winner' : ''}">
        <span class="rank-pos">${r.pos}.</span>
        <span class="rank-name">${esc(r.v.name)}</span>
        <span class="rank-score"><b>${r.v.correctCount}</b> / ${s.target} · ${r.v.wrongCount} falsch</span>
      </div>`).join('');
    app.innerHTML = `
      <div class="brand">
        <div class="mark">SPIELENDE</div>
      </div>

function timelineCardsHtml(timeline, wrongSongs, showWrong){
  let items = timeline.map(song => ({ song, wrong:false }));
  if(showWrong && wrongSongs.length){
    // Falsche Songs chronologisch (nach Jahr) einsortieren; bei Gleichstand nach den richtigen
    wrongSongs.forEach(song => {
      let idx = items.findIndex(it => it.song.y > song.y);
      if(idx === -1) idx = items.length;
      items.splice(idx, 0, { song, wrong:true });
    });
  }
  return items.map(it => simpleCardHtml(it.song, !it.wrong && !!it.song.__starter, it.wrong)).join('');
}

function renderTimelineOnly(){
  const multi = isMultiRound();

function hexToRgba(hex, alpha){
  const h = hex.replace("#","");
  return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${alpha})`;
}
function mixHex(hex, towardHex, amount){
  const a = hex.replace("#",""), b = towardHex.replace("#","");
  const ch = (s,i) => parseInt(s.substring(i,i+2),16);
  const mix = i => Math.round(ch(a,i) + (ch(b,i) - ch(a,i)) * amount);
  const toHex = n => n.toString(16).padStart(2,"0");
  return "#" + toHex(mix(0)) + toHex(mix(2)) + toHex(mix(4));
}
function relativeLuminance(hex){
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function ensureGoogleFont(query){
  if(!query) return;
  const id = "gf-" + query.split(":")[0];
  if(document.getElementById(id)) return;
  const link = document.createElement("link");
  link.id = id;
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${query}&display=swap`;
  document.head.appendChild(link);
}

function clearCustomOverrides(){
  const root = document.documentElement.style;
  CUSTOM_PROPS.forEach(p => root.removeProperty(p));
  root.removeProperty("font-synthesis");
}
function applyCustomTheme(){
  const c = customTheme;
  const d = DESIGN_OPTIONS.some(o => o.key === c.design) ? c.design : "standard";
  const root = document.documentElement.style;

  // Je nach Stil sind die Flächen unterschiedlich durchsichtig, die Opazität-Regler wirkt darauf
  const alphaMul = d === "glass" ? 0.16 : d === "modern" ? 0.82 : 1;
  const panelAlpha = c.opacity * alphaMul;
  const panel2Alpha = d === "glass" ? c.opacity * 0.26 : panelAlpha;

  let blur = c.opacity < 1 ? Math.round((1 - c.opacity) * 24 + 4) + "px" : "0px";
  let line = hexToRgba(mixHex(c.bg, "#ffffff", 0.3), Math.max(c.opacity, 0.5));
  let bgImage = "none";

  if(d === "glass"){
    blur = "16px";
    line = hexToRgba(c.text, 0.32);
    bgImage =
      `radial-gradient(640px 460px at 12% 18%, ${hexToRgba(mixHex(c.accent, "#ff5fbe", 0.5), 0.5)}, transparent 65%),` +
      `radial-gradient(720px 520px at 88% 26%, ${hexToRgba(c.accent, 0.45)}, transparent 65%),` +
      `radial-gradient(820px 620px at 55% 95%, ${hexToRgba(mixHex(c.accent, "#8c5fff", 0.5), 0.55)}, transparent 65%),` +
      `linear-gradient(160deg, ${c.bg} 0%, ${mixHex(c.bg, c.accent, 0.25)} 50%, ${mixHex(c.bg, c.accent, 0.5)} 100%)`;
  } else if(d === "modern"){
    blur = "10px";
    bgImage = `radial-gradient(900px 500px at 85% 0%, ${hexToRgba(c.accent, 0.08)}, transparent 60%)`;
  } else if(d === "norisk"){
    line = hexToRgba(c.text, 0.1);
    bgImage = `radial-gradient(900px 420px at 50% -10%, ${hexToRgba(c.accent, 0.12)}, transparent 70%)`;
  }

  root.setProperty("--bg", c.bg);
  root.setProperty("--bg-2", mixHex(c.bg, "#ffffff", 0.06));
  root.setProperty("--bg-highlight", mixHex(c.bg, "#ffffff", 0.12));
  root.setProperty("--panel", hexToRgba(c.panel, panelAlpha));
  root.setProperty("--panel-2", hexToRgba(mixHex(c.panel, "#ffffff", 0.08), panel2Alpha));
  root.setProperty("--line", line);
  root.setProperty("--text", c.text);
  root.setProperty("--muted", mixHex(c.text, c.bg, 0.45));
  root.setProperty("--accent", c.accent);
  root.setProperty("--accent-ink", relativeLuminance(c.accent) > 0.55 ? "#14151d" : "#ffffff");
  root.setProperty("--correct", c.correct);
  root.setProperty("--wrong", c.wrong);
  root.setProperty("--panel-blur", blur);
  const f = FONT_OPTIONS.find(x => x.key === c.font) || FONT_OPTIONS[0];
  ensureGoogleFont(f.google);
  root.setProperty("--heading-font", f.family);
  root.setProperty("--body-font", f.family);
  // Pixelschrift hat nur einen Schnitt: kein künstliches Fett/Kursiv
  if(f.key === "Minecraft") root.setProperty("font-synthesis", "none");
  else root.removeProperty("font-synthesis");
  root.setProperty("--body-bg-image", bgImage);
}

/* Cursor-Leuchtkreis: folgt der Maus mit weichem Nachziehen (Easing) */
const cg = { x:0, y:0, tx:0, ty:0, raf:null, seen:false };
function cursorGlowTick(){
  const el = document.getElementById("cursor-glow");
  if(el){
    cg.x += (cg.tx - cg.x) * 0.12;
    cg.y += (cg.ty - cg.y) * 0.12;
    el.style.transform = `translate3d(${cg.x - 230}px, ${cg.y - 230}px, 0)`;
  }
  cg.raf = requestAnimationFrame(cursorGlowTick);
}
function startCursorGlow(){ if(!cg.raf) cg.raf = requestAnimationFrame(cursorGlowTick); }
function stopCursorGlow(){ if(cg.raf){ cancelAnimationFrame(cg.raf); cg.raf = null; } }
window.addEventListener("pointermove", e => {
  cg.tx = e.clientX; cg.ty = e.clientY;
  if(!cg.seen){ cg.seen = true; cg.x = cg.tx; cg.y = cg.ty; }
  const el = document.getElementById("cursor-glow");
  if(el) el.classList.add("seen");
}, { passive:true });
document.documentElement.addEventListener("mouseleave", () => {
  const el = document.getElementById("cursor-glow");
  if(el) el.classList.remove("seen");
});

/* Stil (data-design): bei den fertigen Themes Modern/Liquid Glass/NRC identisch zum Theme,
   beim benutzerdefinierten Theme frei wählbar. Alle anderen: "standard". */
function currentDesign(){
  if(currentTheme === "custom"){
    return DESIGN_OPTIONS.some(o => o.key === customTheme.design) ? customTheme.design : "standard";

}

}

/* ============ ZEITLIMIT PRO ZUG ============
   Läuft ab dem Start des Songs (Schallplatte) bis zum Aufdecken. Bei geöffneten Dialogen
   (Verlassen, Speichern, Token-Rückfrage) pausiert die Zeit. Nach dem Laden eines
   Spielstands startet der laufende Zug mit der vollen Zeit neu. */
let turnLastTick = Date.now();
let turnLastSec = null;
let autoRevealFlag = false;
function turnLimitMs(){
  const t = state && state.settings ? state.settings.turnLimit : 0;
  return t > 0 ? t * 1000 : 0;
}
function turnTimerActive(){
  return state.screen === "game" && turnLimitMs() > 0 && !!state.current &&
    (state.phase === "placing" || state.phase === "revealed_pending");
}
function turnDialogOpen(){
  if(state.online) return netWaitingSeat() >= 0;
  return !!(state.showExitDialog || state.saveSlotDialogOpen || state.confirmOverwriteSave ||
            state.confirmDeleteSlot || state.pendingSpend);
}
function turnTimerHtml(){
  const total = turnLimitMs();
  if(!total) return ``;
  const left = state.turnDeadline ? Math.max(0, state.turnDeadline - Date.now()) : total;
  return `
    <div class="turn-timer ${left <= 5000 ? 'low' : ''}" id="turn-timer" role="timer" aria-label="Verbleibende Zeit für diesen Zug">
      <div class="bar"><div class="fill" id="turn-timer-fill" style="width:${Math.min(100, left / total * 100)}%"></div></div>
      <span class="time" id="turn-timer-text">${Math.ceil(left / 1000)} s</span>
    </div>`;
}
function updateTurnTimerUi(left){
  const fill = document.getElementById("turn-timer-fill");
  const txt = document.getElementById("turn-timer-text");
  const box = document.getElementById("turn-timer");
  if(!fill || !txt || !box) return;
  const total = turnLimitMs();
  fill.style.width = Math.max(0, Math.min(100, left / total * 100)) + "%";
  txt.textContent = Math.max(0, Math.ceil(left / 1000)) + " s";
  box.classList.toggle("low", left <= 5000);
}
function turnTick(){
  const now = Date.now();
  const dt = now - turnLastTick;
  turnLastTick = now;
  if(!turnTimerActive()) return;
  if(!state.turnDeadline && state.online && NET.role === "guest") return;
  if(!state.turnDeadline){
    state.turnDeadline = now + turnLimitMs();
    turnLastSec = Math.round(turnLimitMs() / 1000);
  }
  if(turnDialogOpen()) state.turnDeadline += dt;
  const left = state.turnDeadline - now;
  updateTurnTimerUi(left);
  // Ticken: ein Tick bei 15 s und 10 s, ab 5 s jede Sekunde (die Startsekunde selbst tickt nicht)
  const sec = Math.ceil(left / 1000);
  if(sec !== turnLastSec){
    turnLastSec = sec;
    if(sec === 15 || sec === 10 || (sec <= 5 && sec >= 1)) sfx("tick", 0, sec);
  }
  if(left <= 0 && !(state.online && NET.role === "guest")) timeoutTurn();
}
function timeoutTurn(){
  if(!turnTimerActive()) return;
  // Position schon gewählt, nur noch nicht bestätigt: die Auswahl wird gewertet (richtig oder falsch)
  if(state.phase === "revealed_pending" && state.pendingGap != null){
    pauseSpotifyPlayback();
    state.turnDeadline = null; state.pendingSpend = null; turnLastSec = null;
    autoRevealFlag = true;
    NET.depth++;
    try{ revealCard(); } finally { NET.depth--; autoRevealFlag = false; }
    return;
  }
  pauseSpotifyPlayback();
  const song = state.current;
  state.turnDeadline = null;
  state.pendingSpend = null;
  state.discard.push(song);
  state.wrongCount += 1;
  if(!state.wrongSongs) state.wrongSongs = [];
  state.wrongSongs.push(song);
  if(state.settings.mode === "coop"){
    state.tokens = Math.max(0, state.tokens - 1);
  }
  statsAddTurn(false, true);
  turnLastSec = null;
  sfx("timeout");
  state.lastResult = {
    ok: false, song, positionOk: false, timedOut: true,
    guessCheck: { said:{ t:"", a:"", y:"" }, titleOk:false, artistOk:false, yearOk:false, both:false },
    difficulty: state.settings.difficulty, bonusAwarded: false
  };
  state.guessResult = null;
  state.guess = { t:"", a:"", y:"" };
  state.pendingGap = null;
  state.phase = "feedback";
  render(); saveState();
}

   Liegen nur lokal in diesem Browser (localStorage). Karten werden live gezählt
   (auch aus abgebrochenen Runden), Spiele beim Erreichen des Endbildschirms. */
const STATS_KEY = "chronohit_stats_v1";
function freshStats(){
  return {
    since: null,
    games: { solo:{ played:0, won:0 }, coop:{ played:0, won:0 }, multiplayer:{ played:0 } },
    correct: 0, wrong: 0, timeouts: 0, curStreak: 0, bestStreak: 0
  };
}
let stats = freshStats();
function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const p = JSON.parse(raw), f = freshStats();
      stats = { ...f, ...p, games: {
        solo: { ...f.games.solo, ...((p.games || {}).solo || {}) },
        coop: { ...f.games.coop, ...((p.games || {}).coop || {}) },
        multiplayer: { ...f.games.multiplayer, ...((p.games || {}).multiplayer || {}) }
      } };
    }
  }catch(e){}
}
function saveStats(){
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch(e){}
}
function statsTouch(){ if(!stats.since) stats.since = Date.now(); }
function statsAddTurn(ok, timedOut){
  statsTouch();
  if(ok) stats.correct += 1; else stats.wrong += 1;
  if(timedOut) stats.timeouts += 1;
  // Serien nur ohne Mehrspieler zählen, sonst vermischen sich die Spieler
  if(!isMultiRound()){
    if(ok){ stats.curStreak += 1; stats.bestStreak = Math.max(stats.bestStreak, stats.curStreak); }
    else stats.curStreak = 0;
  }
  saveStats();
}
function maybeRecordGameEnd(){
  if(state.statsRecorded) return;
  state.statsRecorded = true;

  const mode = state.settings.mode === "coop" ? "coop"

  stats.games[mode].played += 1;
  if(mode !== "multiplayer" && state.won) stats.games[mode].won += 1;
  sfx(mode === "multiplayer" || state.won ? "win" : "lose", 0.7);
  saveStats();
}

/* ============ SOUNDEFFEKTE ============
   Alles wird live per Web Audio erzeugt (keine Dateien). Leise und kurz gehalten, damit der Song
   (Spotify-Player) nicht übertönt wird. Je Stil ein eigenes Klang-Paket (Wellenform, Tonhöhe,
   Ausklang). Audio startet erst nach einer Nutzer-Interaktion (Browser-Vorgabe). */
const SFX_MASTER_MAX = 0.44; // Regler 100 %; Standard 50 % entspricht dem bisherigen Pegel
function sfxMaster(){ return SFX_MASTER_MAX * Math.max(0, Math.min(1, prefs.soundVolume)); }
const SFX_PACKS = {
  standard: { wave:"sine",   pitch:1,    decay:1,   vol:1,    shimmer:false, clicky:true },
  modern:   { wave:"square", pitch:1.25, decay:.7,  vol:.5,   shimmer:false },
  glass:    { wave:"sine",   pitch:1.6,  decay:1.6, vol:.9,   shimmer:true  },
  norisk:   { wave:"square", pitch:1,    decay:.8,  vol:.45,  shimmer:false }
};
let audioCtx = null;
let sfxSpecificAt = 0;
function sfxCtx(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function sfxTone(ctx, pack, t, freq, dur, vol, o){
  o = o || {};
  const mul = o.fixed ? 1 : pack.pitch;
  const d = dur * (o.abs ? 1 : pack.decay);
  const v = Math.max(0.0002, vol * (o.abs ? 1 : pack.vol) * sfxMaster());
  const voices = [{ f: freq * mul, to: o.slideTo ? o.slideTo * mul : null, v, wave: o.wave || pack.wave }];
  if(pack.shimmer && !o.fixed) voices.push({ f: freq * mul * 2.01, to: null, v: v * 0.35, wave: "sine" });
  voices.forEach(x => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = x.wave;
    osc.frequency.setValueAtTime(x.f, t);
    if(x.to) osc.frequency.exponentialRampToValueAtTime(x.to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(x.v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + d + 0.03);
  });
}
function sfxNoise(ctx, pack, t, dur, vol, f0, f1){
  const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const flt = ctx.createBiquadFilter(); flt.type = "bandpass";
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  const v = Math.max(0.0002, vol * sfxMaster());
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + dur * 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}
const SFX = {
  click:   (c, p, t) => {
    if(p.clicky){ // mechanisches Klicken: kurzer Rauschimpuls + knackiger Ton
      sfxNoise(c, p, t, .03, .9, 3800, 1800);
      sfxTone(c, p, t, 2000, .022, .35, { wave:"square", fixed:true, abs:true });
    } else sfxTone(c, p, t, 880, .045, .5);
  },
  place:   (c, p, t) => {
    sfxNoise(c, p, t, .06, .35, 900, 380);
    sfxTone(c, p, t, 520, .09, .7, { slideTo:340 });
  },
  unplace: (c, p, t) => {
    sfxNoise(c, p, t, .04, .25, 700, 1600);
    sfxTone(c, p, t, 340, .08, .6, { slideTo:520 });
  },
  theme:   (c, p, t) => { sfxTone(c, p, t, 660, .09, .6); sfxTone(c, p, t + .08, 990, .14, .6); },
  flip:    (c, p, t) => sfxNoise(c, p, t, .12, .5, 600, 2600),
  correct: (c, p, t) => { sfxTone(c, p, t, 660, .11, .8); sfxTone(c, p, t + .09, 880, .2, .8); },
  wrong:   (c, p, t) => sfxTone(c, p, t, 300, .3, .8, { slideTo:150, fixed:true }),
  timeout: (c, p, t) => { sfxTone(c, p, t, 392, .5, .9, { fixed:true }); sfxTone(c, p, t + .2, 294, .6, .9, { fixed:true }); },
  tick:    (c, p, t, sec) => {
    // Bewusst grell und eckig (Rechteckwelle, hohe Töne, unabhängig vom Stil), damit es sich von der Musik abhebt
    const o = { wave:"square", fixed:true, abs:true };
    sfxNoise(c, p, t, .03, .9, 4200, 2200);
    if(sec > 5){                       // 15 s und 10 s: doppeltes "Tik-Tik"
      sfxTone(c, p, t, 1500, .05, .9, o);
      sfxTone(c, p, t + .09, 1500, .05, .9, o);
    } else {                           // ab 5 s: jede Sekunde ein Alarm-Piep, steigend
      const f = 1400 + (5 - sec) * 180;
      sfxTone(c, p, t, f, .11, 1, o);
      if(sec <= 2) sfxTone(c, p, t + .13, f, .11, 1, o);
    }
  },
  token:   (c, p, t) => { sfxTone(c, p, t, 1175, .3, .7); sfxTone(c, p, t + .08, 1568, .38, .7); },
  spend:   (c, p, t) => { [1319, 1568, 1760].forEach((f, i) => sfxTone(c, p, t + i * .05, f, .09, .6)); },
  streak:  (c, p, t) => { [523, 659, 784, 1047].forEach((f, i) => sfxTone(c, p, t + i * .08, f, .12, .7)); },
  win:     (c, p, t) => { [523, 659, 784].forEach((f, i) => sfxTone(c, p, t + i * .12, f, .14, .8)); sfxTone(c, p, t + .36, 1047, .55, .9); },
  lose:    (c, p, t) => { sfxTone(c, p, t, 392, .26, .8, { fixed:true }); sfxTone(c, p, t + .26, 349, .26, .8, { fixed:true }); sfxTone(c, p, t + .52, 294, .6, .8, { fixed:true, slideTo:262 }); },
  turn:    (c, p, t) => sfxTone(c, p, t, 523, .32, .7)
};
const SOUND_GROUPS = [
  { key:"klicks",     label:"Menü-Klicks",           hint:"Klicks bei Buttons, Schaltern und beim Wechsel von Theme/Stil", sample:"click" },
  { key:"platzieren", label:"Karte platzieren",      hint:"Beim Setzen der Karte und bei „Position ändern“", sample:"place" },
  { key:"ergebnis",   label:"Aufdecken & Ergebnis",  hint:"Whoosh, richtig, falsch und „Zeit abgelaufen“", sample:"correct" },
  { key:"timer",      label:"Timer-Ticken",          hint:"Ticks bei 15 s und 10 s, ab 5 s jede Sekunde", sample:"tick", sampleArg:3 },
  { key:"tokens",     label:"Tokens & Serien",       hint:"Bonus-Token, Token ausgeben, Serien-Fanfare", sample:"token" },
  { key:"spielende",  label:"Spielende & Zugwechsel", hint:"Sieg/Niederlage und Gong beim Zugwechsel (Mehrspieler)", sample:"turn" }
];
const SFX_GROUP = {
  click:"klicks", theme:"klicks", place:"platzieren", unplace:"platzieren",
  flip:"ergebnis", correct:"ergebnis", wrong:"ergebnis", timeout:"ergebnis", tick:"timer",
  token:"tokens", spend:"tokens", streak:"tokens", win:"spielende", lose:"spielende", turn:"spielende"
};
function defaultSoundGroups(){
  const g = {}; SOUND_GROUPS.forEach(x => { g[x.key] = true; }); return g;
}
function sfx(name, delay, arg, force){
  if(!prefs.sound || prefs.soundVolume <= 0) return;
  const fn = SFX[name];
  if(!fn) return;
  const grp = SFX_GROUP[name];
  if(!force && grp && prefs.soundGroups && prefs.soundGroups[grp] === false) return;
  const ctx = sfxCtx();
  if(!ctx) return;
  if(name !== "click" || force) sfxSpecificAt = Date.now();
  const pack = SFX_PACKS[currentDesign()] || SFX_PACKS.standard;
  try{ fn(ctx, pack, ctx.currentTime + 0.01 + (delay || 0), arg); }catch(e){}
}
// Menü-Klick: erst nach dem eigentlichen Handler prüfen, ob schon ein spezieller Sound lief
document.addEventListener("click", e => {

  if(!el || el.disabled) return;
  setTimeout(() => { if(Date.now() - sfxSpecificAt > 120) sfx("click"); }, 0);

/* ============ DARSTELLUNG & BARRIEREFREIHEIT ============ */
const PREFS_KEY = "chronohit_prefs";
const PREF_DEFAULTS = { reduceMotion: null, fontScale: 1, highContrast: false, colorSafe: false, sound: true, soundVolume: 0.5, soundGroups: null };
let prefs = { ...PREF_DEFAULTS, reduceMotion: false, soundGroups: defaultSoundGroups() };
function loadPrefs(){
  let saved = {};
  try{ const raw = localStorage.getItem(PREFS_KEY); if(raw) saved = JSON.parse(raw) || {}; }catch(e){}
  prefs = { ...PREF_DEFAULTS, ...saved };
  // Ohne eigene Wahl folgt "Animationen reduzieren" der Systemeinstellung
  if(typeof prefs.reduceMotion !== "boolean"){
    prefs.reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  prefs.soundGroups = { ...defaultSoundGroups(), ...((saved && saved.soundGroups) || {}) };
  const sv = parseFloat(prefs.soundVolume);
  prefs.soundVolume = isFinite(sv) ? Math.min(1, Math.max(0, sv)) : 0.5;
  const fs = parseFloat(prefs.fontScale);
  prefs.fontScale = isFinite(fs) ? Math.min(1.3, Math.max(0.85, fs)) : 1;
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){}
}
function applyPrefs(){
  const root = document.documentElement;
  root.classList.toggle("reduce-motion", !!prefs.reduceMotion);
  // Liquid Glass: Lichtbrechung nur ohne "Animationen reduzieren" (dann bleibt Blur + Glanz)
  root.classList.toggle("glass-refract", refractionSupported && !prefs.reduceMotion);
  root.classList.toggle("high-contrast", !!prefs.highContrast);
  root.classList.toggle("cb-safe", !!prefs.colorSafe);
  root.style.setProperty("--font-scale", String(prefs.fontScale));
  syncDesign();
}
function togglePref(key){
  prefs[key] = !prefs[key];
  savePrefs(); applyPrefs();
  if(state.screen === "settings") render();
  else if(quickMenuOpen) renderQuickMenuContent();
}
function prefSwitchHtml(key){
  return `<div class="switch ${prefs[key] ? 'on' : ''}" role="switch" aria-checked="${!!prefs[key]}" tabindex="0"
      onclick="togglePref('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePref('${key}');}"><div class="knob"></div></div>`;
}
function setFontScale(percent){
  prefs.fontScale = Math.min(1.3, Math.max(0.85, parseInt(percent, 10) / 100));

let soundGroupsOpen = false;

function toggleSoundGroup(key){

/* ============ ONLINE-MULTIPLAYER (Peer-to-Peer, PeerJS) ============

   Zustand. Spieldaten laufen direkt zwischen den Browsern (WebRTC-Datenkanal, DTLS-verschlüsselt);
   der Vermittlungsserver (PeerJS Cloud) sieht nur Verbindungsdaten.
   Passwort: Aus Raumname + Passwort wird per PBKDF2 (300.000 Runden) die Raum-Adresse und ein

/* ---------- Krypto-Helfer ---------- */
const netEnc = new TextEncoder();

  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt, iterations: NET_PBKDF2_ITER }, base, 8 * 52));
  const macKey = await crypto.subtle.importKey("raw", bits.slice(20), { name:"HMAC", hash:"SHA-256" }, false, ["sign", "verify"]);

    if(NET.bypass || NET.depth > 0){
      NET.depth++; try{ return orig.apply(this, args); } finally { NET.depth--; }
    }
    if(NET.role === "guest"){
      if(!netMayAct(netMySeat(), name, args)) return;
      if(name === "revealCard") netFlushGuess();
      netSendHost({ t: "act", a: name, args: name === "chooseGap" ? [args[0]] : [] });

  } finally { NET.depth--; }

  if(!(window.peerjs && peerjs.Peer)) return netFail("Die Netzwerk-Bibliothek konnte nicht geladen werden.");
  netHostPeer();
  NET.tickTimer = setInterval(netPeriodic, NET_PING_MS);
}
function netHostPeer(){
  const peer = new peerjs.Peer(NET.roomId, NET_PEER_OPTIONS);
  NET.peer = peer;
  peer.on("open", () => {
    if(NET.peer !== peer) return;
    NET.status = "open"; NET.error = ""; NET.idRetry = 0;
    netSeatsChanged();
  });
  peer.on("connection", conn => netHostAccept(conn));
  peer.on("disconnected", () => {
    if(NET.peer !== peer || peer.destroyed) return;
    setTimeout(() => { try{ if(NET.peer === peer && !peer.destroyed) peer.reconnect(); }catch(e){} }, 2000);
  });
  peer.on("error", err => {
    if(NET.peer !== peer) return;
    const type = err && err.type;
    if(type === "unavailable-id"){
      if(NET.idRetry < 3){
        NET.idRetry++;
        try{ peer.destroy(); }catch(e){}
        setTimeout(() => { if(NET.role === "host") netHostPeer(); }, 2500);
        return;
      }
      return netFail("Dieser Raum ist schon geöffnet (vielleicht in einem anderen Tab oder auf einem anderen Gerät). Warte kurz und versuche es erneut.");
    }
    if(["network", "server-error", "socket-error", "socket-closed"].includes(type)){
      if(NET.status === "opening") return netFail("Der Vermittlungsserver ist nicht erreichbar. Prüfe deine Internetverbindung und versuche es später noch einmal.");
      return;
    }
    if(type === "browser-incompatible") return netFail("Dieser Browser unterstützt WebRTC nicht.");
    if(type === "peer-unavailable" || type === "disconnected") return;
    netFail("Verbindungsfehler: " + (type || "unbekannt"));
  });
}
function netHostAccept(conn){
  if(NET.pending.size >= 20){ try{ conn.close(); }catch(e){} return; }
  const entry = { conn, authed: false, key: "", nh: netRandHex(16), last: Date.now(), q: Promise.resolve(), authTimer: null, lastGuess: 0 };
  NET.pending.add(entry);
  conn.on("open", () => {
    netSend(conn, { t: "challenge", nh: entry.nh, v: 1 });
    entry.authTimer = setTimeout(() => { if(!entry.authed){ try{ conn.close(); }catch(e){} NET.pending.delete(entry); } }, 10000);
  });
  conn.on("data", data => {
    entry.last = Date.now();
    if(!data || typeof data !== "object" || typeof data.t !== "string") return;
    entry.q = entry.q.then(() => netHostHandle(entry, data)).catch(() => {});
  });
  conn.on("close", () => netHostOnClose(entry));
  conn.on("error", () => {});
}
function netDeny(entry, code){
  netSend(entry.conn, { t: "deny", code });
  setTimeout(() => { try{ entry.conn.close(); }catch(e){} }, 300);
}
async function netHostHandle(entry, d){
  if(!entry.authed){ if(d.t === "auth") await netHostAuth(entry, d); return; }
  switch(d.t){
    case "ping": netSend(entry.conn, { t: "pong" }); break;
    case "act": netHostAct(entry, d); break;
    case "guess": netHostGuess(entry, d); break;
    case "bye": try{ entry.conn.close(); }catch(e){} break;
  }
}
async function netHostAuth(entry, d){
  if(entry.authing) return;
  entry.authing = true;
  const name = netCleanName(d.name);
  if(!name || !/^[0-9a-f]{32}$/.test(String(d.ng))) return netDeny(entry, "bad");
  const fp = netFingerprints(entry.conn);
  if(!fp) return netDeny(entry, "sec");
  const ok = await netMacOk(NET.macKey, ["guest", entry.nh, d.ng, name, fp.local, fp.remote], d.mac);
  if(!ok) return netDeny(entry, "auth");
  let seat = NET.seats.findIndex(s => netSameName(s.name, name));
  if(seat === 0) return netDeny(entry, "name");
  const key = netKey(name);
  if(seat >= 0){
    const old = NET.entries.get(key);
    if(old && old !== entry){
      netSend(old.conn, { t: "kick", reason: "Du hast dich an einem anderen Gerät angemeldet." });
      NET.entries.delete(key);
      try{ old.conn.close(); }catch(e){}
    }
  } else {
    if(NET.started || NET.resume) return netDeny(entry, "started");
    if(NET.seats.length >= NET_MAX_PLAYERS) return netDeny(entry, "full");
    NET.seats.push({ name, connected: false });
    seat = NET.seats.length - 1;
  }
  entry.authed = true; entry.key = key; clearTimeout(entry.authTimer);
  NET.pending.delete(entry);
  NET.entries.set(key, entry);
  NET.seats[seat].connected = true;
  const mac = await netMac(NET.macKey, ["host", d.ng, entry.nh, fp.local, fp.remote, String(seat)]);
  netSend(entry.conn, { t: "welcome", seat, mac, started: NET.started });
  netSeatsChanged();
  if(NET.started) netBroadcastState(true, key);
}
function netHostOnClose(entry){
  NET.pending.delete(entry);
  clearTimeout(entry.authTimer);
  if(!entry.authed || NET.entries.get(entry.key) !== entry) return;
  NET.entries.delete(entry.key);
  const seat = NET.seats.findIndex(s => netKey(s.name) === entry.key);
  if(seat > 0){
    if(NET.started || NET.resume) NET.seats[seat].connected = false;
    else NET.seats.splice(seat, 1);
  }
  netSeatsChanged();
}
function netSeatsChanged(){
  if(NET.started && state.online){ state.net.seats = NET.seats; render(); return; }
  if(NET.status === "open") NET.error = "";
  netBroadcastLobby();
  netUiUpdate();
}
function netLobbyInfo(){
  const s = NET.resume ? state.settings : (NET.config && NET.config.settings) || {};
  return { room: NET.roomLabel, mode: s.mode, difficulty: s.difficulty, target: s.target, turnLimit: s.turnLimit || 0, tokens: !!s.tokens, resume: NET.resume };
}
function netBroadcastLobby(){
  if(NET.role !== "host" || NET.started) return;
  netBroadcast({ t: "lobby", seats: NET.seats.map(x => ({ name: x.name, connected: !!x.connected })), info: netLobbyInfo() });
}
function netHostAct(entry, d){
  if(!state.online || !NET.started || state.screen !== "game") return;
  const seat = NET.seats.findIndex(s => netKey(s.name) === entry.key);
  const a = d.a, args = Array.isArray(d.args) ? d.args.slice(0, 1) : [];
  if(!NET_ACTIONS.includes(a)) return;
  if(!netMayAct(seat, a, args)){ netBroadcastState(true, entry.key); return; }
  NET.bypass = true;
  try{ window[a].apply(null, a === "chooseGap" ? [args[0]] : []); }
  finally { NET.bypass = false; }
}
function netHostGuess(entry, d){
  if(!state.online || state.phase !== "revealed_pending") return;
  const seat = NET.seats.findIndex(s => netKey(s.name) === entry.key);
  if(seat !== netActiveSeat()) return;
  const now = Date.now();
  if(now - entry.lastGuess < 30) return;
  entry.lastGuess = now;
  const g = netCleanGuess(d.g);
  state.guess = g;
  netApplyGuessDom(g);
  netBroadcast({ t: "guess", g }, entry.key);
}
function netKick(i){
  if(NET.role !== "host" || NET.started || i < 1) return;
  const s = NET.seats[i]; if(!s) return;
  const e = NET.entries.get(netKey(s.name));
  if(e){ netSend(e.conn, { t: "kick", reason: "Der Host hat dich aus dem Raum entfernt." }); setTimeout(() => { try{ e.conn.close(); }catch(_){} }, 200); }
}
async function netHostStartGame(){
  if(NET.role !== "host") return;
  if(NET.resume){
    NET.started = true; NET.lastSig = "";
    state.online = true; state.net.seats = NET.seats; state.turnDeadline = null; state.screen = "game";
    render();
    if(state.phase === "placing" && state.current && state.current.id && !useFallbackEmbed) requestSpotifyPlay(state.current);
    return;
  }
  if(NET.seats.filter(s => s.connected).length < 2){ NET.error = "Es werden mindestens 2 Spieler benötigt."; return render(); }
  NET.seats = NET.seats.filter(s => s.connected);
  const cfg = NET.config, names = NET.seats.map(s => s.name);
  const settings = JSON.parse(JSON.stringify(cfg.settings));
  if(settings.mode === "multiplayer"){ settings.playerCount = names.length; newGame(settings, names); }
  else newGame(settings);
  state.online = true; state.net = { seats: NET.seats, turn: 0 }; state.turnNo = state.turnNo || 1;
  state.activeSlot = cfg.slot; state.activeSaveName = cfg.room;
  NET.started = true; NET.lastSig = "";
  const snap = JSON.parse(JSON.stringify(state)); snap.savedAt = Date.now(); snap.name = cfg.room;
  await writeSlot(cfg.slot, snap);
  render();
}
function netPeriodic(){
  const now = Date.now();
  if(NET.role === "host"){
    NET.entries.forEach(e => {
      if(!e.authed) return;
      netSend(e.conn, { t: "ping" });
      if(now - e.last > NET_DEAD_MS){ try{ e.conn.close(); }catch(_){} netHostOnClose(e); }
    });
  } else if(NET.role === "guest" && NET.hostConn && NET.status === "connected"){
    netSendHost({ t: "ping" });
    if(now - NET.lastHost > NET_DEAD_MS){ try{ NET.hostConn.close(); }catch(_){} netGuestLost(); }
  }
}

async function netJoin(){
  const f = NET.form;
  const name = netCleanName(f.name), room = String(f.room || "").trim();
  if(!name){ NET.error = "Bitte gib deinen Spielernamen ein."; return render(); }
  if(room.length < 3){ NET.error = "Bitte gib den Raumnamen ein."; return render(); }
  if(!f.pw){ NET.error = "Bitte gib das Passwort ein."; return render(); }
  try{ localStorage.setItem("chronohit_netname", name); }catch(e){}
  if(state.online){ state.online = false; state.net = null; }
  const prevSettings = state.settings;
  netResetRuntime();
  NET.prevSettings = prevSettings;
  NET.role = "guest"; NET.myName = name; NET.roomLabel = room; NET.status = "connecting"; NET.error = "";
  render();
  let keys;
  try{ keys = await netDeriveKeys(room, f.pw); }
  catch(e){ NET.error = "Die nötige Verschlüsselung ist in diesem Browser nicht verfügbar (öffne das Spiel über https:// oder als lokale Datei)."; NET.status = "error"; return render(); }
  if(NET.role !== "guest") return;
  NET.roomId = keys.roomId; NET.macKey = keys.macKey;
  f.pw = "";
  if(!(window.peerjs && peerjs.Peer)){ NET.error = "Die Netzwerk-Bibliothek konnte nicht geladen werden."; NET.status = "error"; return render(); }
  NET.tickTimer = setInterval(netPeriodic, NET_PING_MS);
  netGuestConnect(true);
}
function netGuestConnect(first){
  if(NET.role !== "guest") return;
  NET.status = first ? "connecting" : "reconnecting";
  try{ if(NET.hostConn) NET.hostConn.close(); }catch(e){}
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  NET.hostConn = null;
  const peer = new peerjs.Peer("chg-" + netRandHex(12), NET_PEER_OPTIONS);
  NET.peer = peer;
  let nh = null, ng = null, done = false, opened = false;
  const giveUp = msg => {
    if(done || NET.peer !== peer) return; done = true;
    if(first || !NET.started){ NET.error = msg; NET.status = "error"; try{ peer.destroy(); }catch(e){} NET.peer = null; if(!state.online) state.screen = "join"; render(); }
    else netGuestLost();
  };
  const timeout = setTimeout(() => giveUp("Zeitüberschreitung: Der Host hat nicht geantwortet. Stimmen Raumname und Passwort, und ist der Raum geöffnet?"), 20000);
  peer.on("error", err => {
    const type = err && err.type;
    if(type === "unavailable-id"){ clearTimeout(timeout); return netGuestConnect(first); }
    clearTimeout(timeout);
    if(type === "peer-unavailable") giveUp("Raum nicht gefunden. Prüfe Raumname und Passwort — und ob der Host den Raum geöffnet hat.");
    else if(["network", "server-error", "socket-error", "socket-closed"].includes(type)) giveUp("Der Vermittlungsserver ist nicht erreichbar. Prüfe deine Internetverbindung.");
    else if(type === "browser-incompatible") giveUp("Dieser Browser unterstützt WebRTC nicht.");
    else giveUp("Verbindungsfehler: " + (type || "unbekannt"));
  });
  peer.on("disconnected", () => {
    if(NET.peer === peer && !peer.destroyed) setTimeout(() => { try{ if(NET.peer === peer && !peer.destroyed) peer.reconnect(); }catch(e){} }, 1500);
  });
  peer.on("open", () => {
    if(NET.peer !== peer || opened) return;
    opened = true;
    const conn = peer.connect(NET.roomId, { reliable: true, serialization: "json" });
    NET.hostConn = conn;
    let q = Promise.resolve(), verified = false;
    conn.on("data", d => {
      if(NET.hostConn !== conn || !d || typeof d !== "object" || typeof d.t !== "string") return;
      NET.lastHost = Date.now();
      q = q.then(() => handle(d)).catch(err => {
        console.error("Chronohit Online:", err);
        if(!verified) giveUp("Beitritt fehlgeschlagen: " + ((err && err.message) || "unbekannter Fehler"));
      });
    });
    const handle = async d => {
      if(!verified && !["challenge", "welcome", "deny"].includes(d.t)) return;
      switch(d.t){
        case "challenge": {
          if(!/^[0-9a-f]{32}$/.test(String(d.nh))) return giveUp("Ungültige Antwort vom Host.");
          nh = d.nh; ng = netRandHex(16);
          const fp = netFingerprints(conn);
          if(!fp) return giveUp("Die Sicherheitsprüfung der Verbindung war nicht möglich.");
          const mac = await netMac(NET.macKey, ["guest", nh, ng, NET.myName, fp.remote, fp.local]);
          netSend(conn, { t: "auth", name: NET.myName, ng, mac });
          setTimeout(() => { if(!verified && !done && NET.hostConn === conn) giveUp("Der Host hat die Anmeldung nicht beantwortet. Versuche es noch einmal."); }, 10000);
          break;
        }
        case "welcome": {
          const fp = netFingerprints(conn);
          const seat = netInt(d.seat, -1, -1, NET_MAX_PLAYERS);
          if(!fp || !nh || !ng || seat < 0 || !(await netMacOk(NET.macKey, ["host", ng, nh, fp.remote, fp.local, String(seat)], d.mac)))
            return giveUp("Der Host konnte nicht verifiziert werden. Die Verbindung wurde aus Sicherheitsgründen abgebrochen.");
          clearTimeout(timeout); done = true; verified = true;
          NET.status = "connected"; NET.reconnectTries = 0; NET.started = !!d.started;
          if(!state.online) state.screen = "lobby";
          render();
          break;
        }
        case "deny": {
          const m = { auth: "Anmeldung abgelehnt: Passwort oder Sicherheitsprüfung stimmt nicht.", sec: "Die Sicherheitsprüfung der Verbindung war nicht möglich.",
            name: "Dieser Name ist der Host-Name und kann nicht verwendet werden.", started: "Das Spiel läuft schon. Nur Spieler, die schon dabei waren, können mit ihrem alten Namen wieder beitreten.",
            full: "Der Raum ist voll.", bad: "Ungültige Anmeldung." };
          giveUp(m[d.code] || "Der Host hat die Anmeldung abgelehnt.");
          break;
        }
        case "kick": NET.notice = String(d.reason || "Du wurdest aus dem Raum entfernt.").slice(0, 200); netLeave(); break;
        case "closed": NET.notice = "Der Host hat den Raum geschlossen."; netLeave(); break;
        case "lobby": {
          const seats = Array.isArray(d.seats) ? d.seats.slice(0, NET_MAX_PLAYERS).map(x => ({ name: netCleanName(x && x.name), connected: !!(x && x.connected) })).filter(x => x.name) : [];
          const i = d.info || {};
          NET.lobby = { seats, info: { room: String(i.room || "").slice(0, 60), mode: i.mode, difficulty: i.difficulty, target: netInt(i.target, 10, 1, 50), turnLimit: netInt(i.turnLimit, 0, 0, 600), tokens: !!i.tokens, resume: !!i.resume } };
          if(!state.online){ if(state.screen === "join" || state.screen === "online") state.screen = "lobby"; netUiUpdate(); }
          break;
        }
        case "state": netGuestApplyState(d); break;
        case "guess": {
          if(!state.online || netMyTurn()) break;
          state.guess = netCleanGuess(d.g); netApplyGuessDom(state.guess); break;
        }
      }
    };
    conn.on("close", () => { clearTimeout(timeout); if(NET.hostConn === conn) netGuestLost(); });
    conn.on("error", () => {});
  });
}
function netGuestLost(){
  if(NET.role !== "guest" || NET.leaving) return;
  if(NET.status === "error") return;
  if(!NET.started && !state.online){ NET.error = "Die Verbindung zum Host wurde getrennt."; NET.status = "error"; state.screen = "join"; return render(); }
  NET.status = "lost";
  try{ if(NET.hostConn) NET.hostConn.close(); }catch(e){}
  NET.hostConn = null;
  clearTimeout(NET.reconnectTimer);
  if(NET.reconnectTries >= 30){ NET.status = "error"; NET.error = "Die Verbindung konnte nicht wiederhergestellt werden."; return render(); }
  NET.reconnectTries++;
  render();
  NET.reconnectTimer = setTimeout(() => netGuestConnect(false), 3000);
}
function netRetryNow(){ NET.reconnectTries = 0; NET.status = "lost"; netGuestConnect(false); render(); }

        <div class="hint" style="color:var(--muted); font-size:calc(13px * var(--font-scale)); line-height:1.6;">
          Raumname = der Name deines Spielstands (Schritt 1). Gib Raumname und Passwort an deine Mitspieler weiter.
          Das Passwort verlässt dein Gerät nie; es dient nur dazu, die Raum-Adresse und einen Schlüssel zu berechnen.
        </div>
      </div>
    </div>`;
}
async function netHostFromWizard(){
  const w = state.wizard;
  const settings = w.mode === "coop" ? {
    tokens: true, target: w.target, maxTokens: w.coopTokens, startTokens: w.coopTokens, mode: w.mode, difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0, ...songFilterFromWizard(w)
  } : {
    tokens: w.tokens, target: w.target, maxTokens: w.maxTokens, startTokens: w.startTokens, mode: w.mode, difficulty: w.difficulty,
    turnLimit: w.timer ? w.turnLimit : 0, ...songFilterFromWizard(w)
  };
  const room = (w.name || "").trim(), hostName = netCleanName(w.hostName), pw = w.password;
  try{ localStorage.setItem("chronohit_netname", hostName); }catch(e){}
  const config = { settings, slot: w.slot, room };
  state.wizard = null;
  await netHostOpen(room, pw, hostName, config, false);
}
function netOpenResume(n){
  NET.error = ""; NET.resumeSlot = n;
  state.screen = "resume"; render();
}
function renderResume(){
  const name = state.activeSaveName || "Online-Spiel";
  app.innerHTML = `
    <div class="brand"><h1 style="font-size:calc(30px * var(--font-scale));">Online-Spiel fortsetzen</h1></div>
    <div class="menu-card">
      <h3>${esc(name)}</h3>
      <p style="color:var(--muted); font-size:calc(14px * var(--font-scale)); line-height:1.6; margin-bottom:12px;">
        Gib das Passwort dieses Raums ein, um ihn wieder zu öffnen. Mitspieler treten mit ihrem alten Namen bei und sitzen wieder an ihrem Platz.
        Ein neues Passwort ist erlaubt — dann brauchen die Mitspieler das neue.
      </p>
      <input class="guess-input" type="${NET.showPw ? 'text' : 'password'}" maxlength="64" autocomplete="off" spellcheck="false" placeholder="Passwort (mind. 8 Zeichen)"
        value="${esc(NET.form.pw)}" oninput="NET.form.pw=this.value" onkeydown="if(event.key==='Enter') netResumeHost()">
      <button class="btn-ghost btn-small" style="margin-top:8px;" onclick="NET.showPw=!NET.showPw; render()">${NET.showPw ? 'Verbergen' : 'Anzeigen'}</button>
      ${NET.error ? `<div class="planned-notice" style="border-color:var(--wrong); margin-top:14px;">${esc(NET.error)}</div>` : ``}
    </div>
    <div class="menu-actions">
      <button class="btn-primary" onclick="netResumeHost()">Raum öffnen</button>
      <button class="btn-ghost" onclick="NET.form.pw=''; state=freshMenuState(state.settings); state.screen='loadgame'; render()">← Zurück</button>
    </div>`;
}
async function netResumeHost(){
  const pw = NET.form.pw || "";
  if(pw.length < 8){ NET.error = "Das Passwort muss mindestens 8 Zeichen lang sein."; return render(); }
  NET.form.pw = "";
  const hostName = (state.net && state.net.seats[0] && state.net.seats[0].name) || "Host";
  await netHostOpen(state.activeSaveName, pw, hostName, { resume: true }, true);
}
function netCopy(text){
  try{ navigator.clipboard.writeText(text); }catch(e){}
}
function renderLobby(){
  const host = NET.role === "host";
  const seats = host ? NET.seats : NET.lobby.seats;
  const info = host ? netLobbyInfo() : (NET.lobby.info || {});
  const rows = seats.map((x, i) => `
    <div class="lobby-row">
      <span class="net-dot ${x.connected ? '' : 'off'}"></span>
      <span class="lobby-name">${esc(x.name)}${i === 0 ? ' <small>(Host)</small>' : ''}${netSameName(x.name, NET.myName) ? ' <small>(du)</small>' : ''}</span>
      ${host && !NET.started && !NET.resume && i > 0 ? `<button class="btn-ghost btn-small" onclick="netKick(${i})">Entfernen</button>` : ``}
    </div>`).join("");
  const connected = seats.filter(x => x.connected).length;
  const canStart = host && NET.status === "open" && (NET.resume ? true : connected >= 2);
  const statusText = NET.status === "opening" ? "Raum wird geöffnet … (Schlüssel wird berechnet)"
    : NET.status === "connecting" || NET.status === "reconnecting" ? "Verbinde …"
    : NET.status === "lost" ? "Verbindung verloren – versuche es erneut …" : "";
  const pw = NET.hostPw || "";
  app.innerHTML = `
    <div class="brand"><h1 style="font-size:calc(30px * var(--font-scale));">${host ? (NET.resume ? 'Raum fortsetzen' : 'Lobby') : 'Lobby'}</h1></div>
    <div class="menu-card">
      <h3>${esc(info.room || NET.roomLabel || '')}</h3>
      <div class="hint" style="color:var(--muted); font-size:calc(13px * var(--font-scale)); margin-bottom:10px;">
        ${info.mode ? esc(modeLabel(info.mode)) : ''}${info.difficulty ? ' · ' + esc(difficultyLabel(info.difficulty)) : ''}${info.target ? ' · Ziel ' + info.target : ''}${info.turnLimit ? ' · ' + info.turnLimit + ' s pro Zug' : ''}
      </div>
      ${host ? `
        <div class="pw-row">
          <span>Passwort: <b>${NET.showPw ? esc(pw) : '••••••••'}</b></span>
          <button class="btn-ghost btn-small" onclick="NET.showPw=!NET.showPw; render()">${NET.showPw ? 'Verbergen' : 'Anzeigen'}</button>
          <button class="btn-ghost btn-small" onclick="netCopy('Chronohit – Raum: ' + NET.roomLabel + '  Passwort: ' + NET.hostPw)">Einladung kopieren</button>
        </div>` : ``}
      <div class="lobby-list">${rows}</div>
      <div class="hint" style="color:var(--muted); font-size:calc(13px * var(--font-scale)); margin-top:10px;">${connected} / ${NET_MAX_PLAYERS} Spieler verbunden</div>
      ${statusText ? `<div class="planned-notice" style="margin-top:12px;">${statusText}</div>` : ``}
      ${NET.error ? `<div class="planned-notice" style="border-color:var(--wrong); margin-top:12px;">${esc(NET.error)}</div>` : ``}
      ${!host && NET.status === "connected" ? `<div class="planned-notice" style="margin-top:12px;">${NET.started ? 'Das Spiel läuft – Spielstand wird geladen …' : 'Warte darauf, dass der Host das Spiel startet …'}</div>` : ``}
    </div>
    <div class="menu-actions">
      ${host ? `<button class="btn-primary" onclick="netHostStartGame()" ${canStart ? '' : 'disabled'}>${NET.resume ? 'Spiel fortsetzen' : 'Spiel starten'}</button>` : ``}
      <button class="btn-ghost" onclick="netLobbyClose()">${host ? 'Raum schließen' : 'Verlassen'}</button>
    </div>`;
}
function netLobbyClose(){
  const wasHost = NET.role === "host";
  netShutdown();
  if(wasHost) state = freshMenuState(state.settings);
  state.screen = "menu"; render();
}
function netBannerHtml(){
  const seats = state.net.seats, a = netActiveSeat(), w = netWaitingSeat();
  const chips = seats.map((x, i) => `<span class="net-chip ${i === a ? 'active' : ''} ${x.connected ? '' : 'off'}" title="${x.connected ? 'verbunden' : 'getrennt'}">${esc(x.name)}</span>`).join("");
  const lost = NET.role === "guest" && NET.status !== "connected";
  return `
    <div class="turn-banner">
      <span class="turn-label">Am Zug</span>
      <span class="turn-name">${esc((seats[a] || {}).name || '')}</span>
      <div class="net-chips">${chips}</div>
      ${lost ? `<div class="net-wait">Verbindung zum Host verloren – verbinde neu … <button class="btn-ghost btn-small" onclick="netRetryNow()">Jetzt erneut versuchen</button></div>` : ``}
      ${w >= 0 && !lost ? `<div class="net-wait">Warte auf ${esc(seats[w].name)} – die Verbindung ist getrennt.
        ${NET.role === "host" ? `<button class="btn-ghost btn-small" onclick="netSkipWaiting()">Zug überspringen</button>` : `Der Host kann den Zug überspringen.`}</div>` : ``}
    </div>`;
}
function netWatchCaption(){
  const seats = state.net.seats, a = netActiveSeat();
  const who = esc((seats[a] || {}).name || '');
  const noId = state.current && !state.current.id;
  if(state.phase === "draw") return `<div class="draw-caption">${who} startet gleich die Runde …</div>`;
  if(state.phase === "placing") return `<div class="draw-caption">${who} platziert die Karte. Du hörst den Song auf deinem Gerät.${noId ? ' <a href="' + esc(spotifySearchUrl(state.current)) + '" target="_blank" rel="noopener">Bei Spotify suchen ↗</a>' : ''}</div>`;
  return ``;
}


/* ============ INIT ============ */
(async function init(){
  loadPrefs();
  loadStats();
  loadTheme();
  applyPrefs();
  setInterval(turnTick, 250);
  slotsCache = await loadAllSlots();
  const saved = await loadSave();
  if(saved){
    state.settings = saved.settings || state.settings;
    if(typeof state.settings.maxTokens !== "number") state.settings.maxTokens = 5;
  if(typeof state.settings.startTokens !== "number") state.settings.startTokens = 2;
  if(!state.settings.mode) state.settings.mode = "solo";
  if(!state.settings.difficulty) state.settings.difficulty = "normal";
    state.hasSave = saved.screen === "game";
  }
  render();
})();
</script>
</body>
</html>
