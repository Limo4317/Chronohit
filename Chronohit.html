<style>
  :root{
    --bg: #14151d;
    --bg-2: #1b1d29;
    --bg-highlight: #23263a;
    --panel: #21232f;
    --panel-2: #2a2d3c;
    --card-face: #f3ead9;
    --card-face-2: #e9dcc2;
    --ink: #22201a;
    --text: #ece7db;
    --muted: #9a97a8;
    --accent: #e8a33d;
    --accent-ink: #3a2a0f;
    --correct: #5a9c78;
    --wrong: #c1483b;
    --line: #34364a;
    --radius: 14px;
    --btn-radius: 999px;
    --heading-font: 'Fraunces', serif;
    --body-font: 'Space Grotesk', sans-serif;
    --body-weight: 400;
    --panel-blur: 0px;
    --body-bg-image: none;
  }

  /* ---- Theme: Dunkel (Gelb->Weiß, Blau->Schwarz) ---- */
  :root[data-theme="dark"]{
    --bg: #0a0a0a;
    --bg-2: #000000;
    --bg-highlight: #1a1a1a;
    --panel: #161616;
    --panel-2: #1f1f1f;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #ffffff;
    --accent-ink: #14151d;
    --correct: #6fbf8f;
    --wrong: #d6564a;
    --line: #2c2c2c;
  }

  /* ---- Theme: Hell (Dunkel-Theme invertiert) ---- */
  :root[data-theme="light"]{
    --bg: #ebeae2;
    --bg-2: #e4e2d6;
    --bg-highlight: #f5f4ee;
    --panel: #dedcd0;
    --panel-2: #d5d2c3;
    --card-face: #0c1526;
    --card-face-2: #16233d;
    --ink: #dddfe5;
    --text: #131824;
    --muted: #6b6d5c;
    --accent: #175cc2;
    --accent-ink: #eaf1fc;
    --correct: #2f7d52;
    --wrong: #b23b30;
    --line: #c9c7b3;
  }

  /* ---- Theme: Modern (Konsolen-Look, leicht angeglast) ---- */
  :root[data-theme="modern"]{
    --bg: #0d1416;
    --bg-2: #10181a;
    --bg-highlight: #16302c;
    --panel: rgba(20, 29, 33, 0.82);
    --panel-2: rgba(24, 34, 38, 0.82);
    --text: #dfe9ea;
    --muted: #6d8288;
    --accent: #5eead4;
    --accent-ink: #06302a;
    --correct: #34d399;
    --wrong: #e0453f;
    --line: #233034;
    --radius: 10px;
    --btn-radius: 8px;
    --heading-font: 'Space Mono', monospace;
    --panel-blur: 10px;
    --body-bg-image: radial-gradient(900px 500px at 85% 0%, rgba(94,234,212,0.08), transparent 60%);
  }
  /* ---- Theme: Liquid Glass ----
     Material in Schichten: Hintergrund mit bunten Lichtflecken, darüber Flächen mit
     Blur + Sättigung, diagonalem Glanzverlauf, hellen Lichtkanten (oben links stark,
     unten rechts schwach) und einem Glanzreflex. In Chromium-Browsern kommt zusätzlich
     eine echte Lichtbrechung (SVG-Verzerrung des Hintergrunds) dazu. */
  :root[data-theme="glass"]{
    --bg: #13224a;
    --bg-2: #1b2c5c;
    --bg-highlight: #3a5a9c;
    --panel: rgba(255,255,255,0.07);
    --panel-2: rgba(255,255,255,0.12);
    --card-face: rgba(255,255,255,0.84);
    --card-face-2: rgba(255,255,255,0.70);
    --ink: #0d2038;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.74);
    --accent: #00DEFF;
    --accent-ink: #04233a;
    --correct: #30d158;
    --wrong: #ff453a;
    --line: rgba(255,255,255,0.32);
    --radius: 24px;
    --btn-radius: 999px;
    --heading-font: 'Space Grotesk', sans-serif;
    --panel-blur: 16px;
    --glass-filter: blur(var(--panel-blur)) saturate(185%) brightness(1.1);
    --body-bg-image:
      radial-gradient(640px 460px at 12% 18%, rgba(255,95,190,.55), transparent 65%),
      radial-gradient(720px 520px at 88% 26%, rgba(0,222,255,.45), transparent 65%),
      radial-gradient(820px 620px at 55% 95%, rgba(140,95,255,.60), transparent 65%),
      linear-gradient(160deg, #1e3c72 0%, #2a5298 38%, #6a4fc2 70%, #1fa9c4 100%);
  }
  :root.glass-refract[data-theme="glass"]{
    --glass-filter: url(#glass-refract) blur(5px) saturate(190%) brightness(1.1);
  }
  :root[data-theme="glass"] body{ text-shadow:0 1px 10px rgba(8,16,60,.35); }

  /* Große, schwebende Flächen (mit Backdrop-Blur/Brechung) */
  :root[data-theme="glass"] .menu-card,
  :root[data-theme="glass"] .modal-box,
  :root[data-theme="glass"] .players-drawer,
  :root[data-theme="glass"] .stat,
  :root[data-theme="glass"] .todo-fab,
  :root[data-theme="glass"] .drawer-handle,
  :root[data-theme="glass"] .skip-notice,
  :root[data-theme="glass"] .guess-box,
  :root[data-theme="glass"] .guess-result{
    background-color:var(--panel);
    background-image:linear-gradient(135deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 30%, rgba(255,255,255,.02) 58%, rgba(255,255,255,.12) 100%);
    border:1px solid rgba(255,255,255,.26);
    box-shadow:
      inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.80),
      inset -1px -1px 1px -.5px rgba(255,255,255,.40),
      inset 0 0 26px rgba(255,255,255,.06),
      0 14px 44px rgba(6,12,45,.34);
    backdrop-filter:var(--glass-filter);
    -webkit-backdrop-filter:var(--glass-filter);
  }
  :root[data-theme="glass"] .players-drawer{ background-color:rgba(24,40,92,.55); }
  :root[data-theme="glass"] .modal-box{ background-color:rgba(255,255,255,.10); }

  /* Glanzreflex oben links + schwacher Gegenreflex unten rechts */
  :root[data-theme="glass"] .menu-card,
  :root[data-theme="glass"] .modal-box{ position:relative; isolation:isolate; }
  :root[data-theme="glass"] .menu-card::before,
  :root[data-theme="glass"] .modal-box::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; border-radius:inherit;
    background:
      radial-gradient(130% 70% at 14% -8%, rgba(255,255,255,.42), rgba(255,255,255,0) 52%),
      radial-gradient(90% 60% at 96% 112%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%);
  }

  /* Kleine Elemente innerhalb der Flächen: nur Glanz + Lichtkanten */
  :root[data-theme="glass"] .save-slot,
  :root[data-theme="glass"] .theme-swatch,
  :root[data-theme="glass"] .pp,
  :root[data-theme="glass"] .suggest-opt,
  :root[data-theme="glass"] .info-desc,
  :root[data-theme="glass"] .slot-settings-panel,
  :root[data-theme="glass"] .dropdown,
  :root[data-theme="glass"] .chip,
  :root[data-theme="glass"] .btn-ghost,
  :root[data-theme="glass"] .stepper button,
  :root[data-theme="glass"] .player-reload{
    background-color:var(--panel-2);
    background-image:linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.04) 45%, rgba(255,255,255,.10) 100%);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:
      inset 1px 1px .5px -.5px rgba(255,255,255,.75),
      inset -1px -1px .5px -.5px rgba(255,255,255,.30),
      0 6px 18px rgba(6,12,45,.22);
  }
  :root[data-theme="glass"] .btn-ghost:hover:not(:disabled),
  :root[data-theme="glass"] .chip:hover,
  :root[data-theme="glass"] .save-slot:hover,
  :root[data-theme="glass"] .theme-swatch:hover,
  :root[data-theme="glass"] .suggest-opt:hover{ background-color:rgba(255,255,255,.2); }
  :root[data-theme="glass"] .chip.on{ background-color:var(--accent); background-image:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%); border-color:rgba(255,255,255,.6); }
  :root[data-theme="glass"] .theme-swatch.selected,
  :root[data-theme="glass"] .wizard-slot.selected,
  :root[data-theme="glass"] .pp.current{ border-color:var(--accent); }

  /* Primärbutton: glänzender, leuchtender Glas-Knopf */
  :root[data-theme="glass"] .btn-primary{
    background-color:var(--accent);
    background-image:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 58%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -3px 8px rgba(0,70,110,.28),
      0 8px 26px rgba(0,222,255,.38);
    text-shadow:none;
  }
  :root[data-theme="glass"] .switch.on{ box-shadow:0 0 18px rgba(0,222,255,.55); }

  /* Karten: gefrostetes Milchglas */
  :root[data-theme="glass"] .card{
    background-image:linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 50%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 1px 1px 1px rgba(255,255,255,.95), 0 10px 26px rgba(6,12,45,.30);
    backdrop-filter:blur(10px) saturate(170%);
    -webkit-backdrop-filter:blur(10px) saturate(170%);
    text-shadow:none;
  }
  :root[data-theme="glass"] .card.pending{ border:1px dashed var(--accent); background-image:none; }

  /* ---- Theme: Norisk (angelehnt an die NoRisk-Website) ----
     Reines Schwarz, blauer Akzent, Pixel-Überschriften (Minecraft-Look), schlanke
     Outfit-Schrift, hauchdünne Rahmen, Listenzeilen mit Akzentbalken. */
  :root[data-theme="norisk"]{
    --bg: #000000;
    --bg-2: #070707;
    --bg-highlight: #0b1220;
    --panel: rgba(255,255,255,0.04);
    --panel-2: rgba(255,255,255,0.07);
    --card-face: #f2f2f2;
    --card-face-2: #e2e2e2;
    --ink: #0a0a0a;
    --text: #f7f7f7;
    --muted: #979a9f;
    --accent: #4f8eff;
    --accent-ink: #04101f;
    --correct: #4ade80;
    --wrong: #f87171;
    --line: rgba(255,255,255,0.08);
    --radius: 16px;
    --btn-radius: 8px;
    --heading-font: 'Pixelify Sans', 'Minecraft', monospace;
    --body-font: 'Outfit', sans-serif;
    --body-weight: 300;
    --panel-blur: 0px;
    --body-bg-image: radial-gradient(900px 420px at 50% -10%, rgba(79,142,255,.12), transparent 70%);
  }
  :root[data-theme="norisk"] h1,
  :root[data-theme="norisk"] h2,
  :root[data-theme="norisk"] h3{ font-weight:400; letter-spacing:-.02em; line-height:1.1; }
  :root[data-theme="norisk"] .brand h1{ font-size:clamp(2rem, 6vw, 3rem); line-height:1; }
  /* Kleine Abschnittsüberschriften wie in der NoRisk-Seitenleiste */
  :root[data-theme="norisk"] .menu-card h3{
    font-family:var(--body-font); font-size:.6875rem; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted); line-height:1;
    margin-bottom:18px;
  }
  :root[data-theme="norisk"] .menu-card{ background:var(--panel); border:1px solid var(--line); }
  :root[data-theme="norisk"] .modal-box{
    background:#0a0a0a; border:1px solid rgba(255,255,255,.10); box-shadow:0 24px 60px rgba(0,0,0,.65);
  }
  :root[data-theme="norisk"] .btn-ghost{
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.82); font-weight:500;
  }
  :root[data-theme="norisk"] .btn-ghost:hover:not(:disabled){
    background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;
  }
  :root[data-theme="norisk"] .btn-primary{ font-weight:600; box-shadow:0 0 24px rgba(79,142,255,.28); }
  :root[data-theme="norisk"] .chip{ border-radius:999px; }
  :root[data-theme="norisk"] .switch{ border-radius:999px; }
  :root[data-theme="norisk"] .card{ border:1px solid rgba(255,255,255,.18); border-radius:8px; }
  :root[data-theme="norisk"] .card .tag{ border-radius:4px; }
  :root[data-theme="norisk"] button:focus-visible,
  :root[data-theme="norisk"] a:focus-visible,
  :root[data-theme="norisk"] input:focus-visible,
  :root[data-theme="norisk"] select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* Listen: eine Umrandung, Zeilen mit Haarlinien und Akzentbalken beim Hover */
  :root[data-theme="norisk"] .save-slot-list,
  :root[data-theme="norisk"] .theme-list,
  :root[data-theme="norisk"] .suggest-list{
    gap:0; border:1px solid rgba(255,255,255,.07); border-radius:8px; overflow:hidden;
    background:rgba(255,255,255,.013);
  }
  :root[data-theme="norisk"] .save-slot,
  :root[data-theme="norisk"] .theme-swatch,
  :root[data-theme="norisk"] .suggest-opt{
    position:relative; overflow:hidden; background:transparent; border:none; border-radius:0;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  :root[data-theme="norisk"] .save-slot:last-child,
  :root[data-theme="norisk"] .theme-swatch:last-child,
  :root[data-theme="norisk"] .suggest-opt:last-child{ border-bottom:none; }
  :root[data-theme="norisk"] .save-slot:hover,
  :root[data-theme="norisk"] .theme-swatch:hover,
  :root[data-theme="norisk"] .suggest-opt:hover{ background:rgba(255,255,255,.02); }
  :root[data-theme="norisk"] .save-slot::before,
  :root[data-theme="norisk"] .theme-swatch::before,
  :root[data-theme="norisk"] .suggest-opt::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent);
    transform:scaleY(0); transition:transform .4s cubic-bezier(.16, 1, .3, 1);
  }
  :root[data-theme="norisk"] .save-slot:hover::before,
  :root[data-theme="norisk"] .theme-swatch:hover::before,
  :root[data-theme="norisk"] .suggest-opt:hover::before,
  :root[data-theme="norisk"] .theme-swatch.selected::before,
  :root[data-theme="norisk"] .wizard-slot.selected::before{ transform:scaleY(1); }
  :root[data-theme="norisk"] .theme-swatch.selected{ border-color:transparent; }
  :root[data-theme="norisk"] .timeline-wrap{ scrollbar-width:thin; }
  :root[data-theme="norisk"] .timeline-wrap::-webkit-scrollbar{ height:4px; }
  :root[data-theme="norisk"] .timeline-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.22); }
  :root[data-theme="norisk"] .timeline-wrap::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  :root[data-theme="norisk"] .players-drawer::-webkit-scrollbar{ width:2px; }
  :root[data-theme="norisk"] .players-drawer::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); }

  /* Farb-Variablen als echte <color>-Typen registrieren: dann lassen sie sich
     weich ineinander überblenden (inkl. Verläufe, Rahmen, Schatten usw.) */
  @property --bg{ syntax:'<color>'; inherits:true; initial-value:#14151d; }
  @property --bg-2{ syntax:'<color>'; inherits:true; initial-value:#1b1d29; }
  @property --bg-highlight{ syntax:'<color>'; inherits:true; initial-value:#23263a; }
  @property --panel{ syntax:'<color>'; inherits:true; initial-value:#21232f; }
  @property --panel-2{ syntax:'<color>'; inherits:true; initial-value:#2a2d3c; }
  @property --card-face{ syntax:'<color>'; inherits:true; initial-value:#f3ead9; }
  @property --card-face-2{ syntax:'<color>'; inherits:true; initial-value:#e9dcc2; }
  @property --ink{ syntax:'<color>'; inherits:true; initial-value:#22201a; }
  @property --text{ syntax:'<color>'; inherits:true; initial-value:#ece7db; }
  @property --muted{ syntax:'<color>'; inherits:true; initial-value:#9a97a8; }
  @property --accent{ syntax:'<color>'; inherits:true; initial-value:#e8a33d; }
  @property --accent-ink{ syntax:'<color>'; inherits:true; initial-value:#3a2a0f; }
  @property --correct{ syntax:'<color>'; inherits:true; initial-value:#5a9c78; }
  @property --wrong{ syntax:'<color>'; inherits:true; initial-value:#c1483b; }
  @property --line{ syntax:'<color>'; inherits:true; initial-value:#34364a; }
  @property --radius{ syntax:'<length>'; inherits:true; initial-value:14px; }
  @property --panel-blur{ syntax:'<length>'; inherits:true; initial-value:0px; }
  :root.theme-animating{
    transition-property:--bg, --bg-2, --bg-highlight, --panel, --panel-2, --card-face, --card-face-2,
      --ink, --text, --muted, --accent, --accent-ink, --correct, --wrong, --line, --radius, --panel-blur;
    transition-duration:.9s;
    transition-timing-function:cubic-bezier(.4, 0, .2, 1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{
    background:
      var(--body-bg-image),
      radial-gradient(1200px 600px at 50% -10%, var(--bg-highlight) 0%, var(--bg) 55%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body-font);
    font-weight:var(--body-weight);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1,h2,h3, .num{
    font-family:var(--heading-font);
    font-weight:600;
    margin:0;
  }
  #app{width:100%;max-width:760px;}
  .brand{
    text-align:center;
    margin-bottom:28px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--accent);
    margin-bottom:6px;
  }
  .brand .mark::before, .brand .mark::after{
    content:"";
    width:26px;height:1px;background:var(--line);
  }
  .brand h1{
    font-size:42px;
    color:var(--text);
  }
  .brand p{
    color:var(--muted);
    margin-top:8px;
    font-size:15px;
  }

  /* ---- splash ---- */
  .splash-wrap{
    min-height:70vh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:36px;
  }
  .splash-title{
    font-family:var(--heading-font); font-weight:700; font-size:44px;
    color:var(--accent); letter-spacing:.03em; text-align:center;
  }
  .splash-play{
    width:130px; height:130px; border-radius:50%;
    background:var(--panel-2);
    border:3px solid var(--accent);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 36px rgba(0,0,0,.45);
    transition:transform .15s ease;
    padding:0;
  }
  .splash-play:hover{ transform:scale(1.06); }

  /* ---- loading ---- */
  .loading-box{
    display:flex; flex-direction:column; align-items:center; gap:16px; width:260px;
    animation: loadingBoxFadeOut .4s ease 1.1s forwards;
  }
  @keyframes loadingBoxFadeOut{ from{opacity:1} to{opacity:0} }
  #app.fade-in{ animation: appFadeIn .4s ease; }
  @keyframes appFadeIn{ from{opacity:0} to{opacity:1} }
  .loading-label{ font-family:var(--heading-font); font-size:20px; color:var(--accent); }
  .loading-frame{
    width:100%; height:16px; border:2px solid var(--accent); border-radius:5px;
    overflow:hidden; background:var(--panel-2); padding:2px;
  }
  .loading-fill{
    height:100%; width:0%; background:var(--accent); border-radius:2px;
    animation: loadingFill 1.2s ease-in-out forwards;
  }
  @keyframes loadingFill{ from{width:0%} to{width:100%} }

  /* ---- to-do fab ---- */
  .fab-stack{
    position:fixed; right:18px; bottom:18px; z-index:20;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .todo-fab{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:var(--btn-radius); padding:10px 16px; font-size:13px; font-weight:600;
    text-decoration:none; display:inline-block;
  }
  .todo-fab:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---- wizard ---- */
  .wizard-steps{ display:flex; justify-content:center; gap:8px; margin-top:12px; }
  .wizard-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .wizard-dot.active{ background:var(--accent); width:20px; border-radius:999px; }
  .wizard-dot.done{ background:var(--correct); }
  .wizard-actions{ flex-direction:row !important; justify-content:space-between; }
  .wizard-actions button{ width:auto; }
  .wizard-slot{ cursor:pointer; }

  /* ---- theme picker ---- */
  .theme-list{ display:flex; flex-direction:column; gap:10px; }
  .theme-swatch{
    display:flex; align-items:center; gap:14px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .theme-swatch.selected{ border-color:var(--accent); }
  .theme-dots{ display:flex; gap:5px; flex:none; }
  .theme-dots span{
    width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.15);
  }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(1){ background:#14151d; }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(2){ background:#21232f; }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(3){ background:#e8a33d; }
  .theme-swatch[data-theme-preview="dark"] .theme-dots span:nth-child(1){ background:#0a0a0a; }
  .theme-swatch[data-theme-preview="dark"] .theme-dots span:nth-child(2){ background:#161616; }
  .theme-swatch[data-theme-preview="dark"] .theme-dots span:nth-child(3){ background:#ffffff; }
  .theme-swatch[data-theme-preview="light"] .theme-dots span:nth-child(1){ background:#ebeae2; }
  .theme-swatch[data-theme-preview="light"] .theme-dots span:nth-child(2){ background:#dedcd0; }
  .theme-swatch[data-theme-preview="light"] .theme-dots span:nth-child(3){ background:#175cc2; }
  .theme-swatch[data-theme-preview="modern"] .theme-dots span:nth-child(1){ background:#0d1416; }
  .theme-swatch[data-theme-preview="modern"] .theme-dots span:nth-child(2){ background:#141d21; }
  .theme-swatch[data-theme-preview="modern"] .theme-dots span:nth-child(3){ background:#5eead4; }
  .theme-swatch[data-theme-preview="glass"] .theme-dots span:nth-child(1){ background:linear-gradient(135deg,#2a5298,#7e57c2); border-color:transparent; }
  .theme-swatch[data-theme-preview="glass"] .theme-dots span:nth-child(2){ background:rgba(255,255,255,0.35); }
  .theme-swatch[data-theme-preview="glass"] .theme-dots span:nth-child(3){ background:#0a84ff; }
  .theme-swatch[data-theme-preview="norisk"] .theme-dots span:nth-child(1){ background:#000000; }
  .theme-swatch[data-theme-preview="norisk"] .theme-dots span:nth-child(2){ background:#161616; }
  .theme-swatch[data-theme-preview="norisk"] .theme-dots span:nth-child(3){ background:#4f8eff; }
  .theme-swatch[data-theme-preview="custom"] .theme-dots span:nth-child(1){ background:conic-gradient(from 0deg, #e8a33d, #5a9c78, #175cc2, #c1483b, #e8a33d); }
  .theme-swatch[data-theme-preview="custom"] .theme-dots span:nth-child(2),
  .theme-swatch[data-theme-preview="custom"] .theme-dots span:nth-child(3){ display:none; }
  .custom-theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; }
  .custom-color-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:13px; color:var(--muted);
  }
  .custom-color-row input[type="color"]{
    width:42px; height:32px; padding:2px; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; background:none;
  }
  .skip-notice{
    display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center;
    background:var(--panel-2); border:1px dashed var(--line); border-radius:12px;
    padding:8px 14px; font-size:13px; max-width:340px;
  }
  .skip-notice .skip-label{ color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  .skip-notice .skip-song{ color:var(--text); }
  .skip-notice .skip-song b{ color:var(--accent); font-weight:600; }
  .wrong-toggle{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:0 auto 18px; font-size:14px; color:var(--muted);
  }
  .wrong-toggle.none{ font-size:13px; }
  .wrong-toggle .wrong-count{ color:var(--wrong); }
  /* ---- mehrspieler ---- */
  .player-list{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .player-row{ display:flex; align-items:center; gap:8px; }
  .player-row .guess-input{ flex:1; min-width:0; }
  .player-num{
    width:24px; height:24px; border-radius:50%; flex:none; font-size:12px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .turn-banner{
    display:flex; flex-direction:column; align-items:center; gap:2px; margin:4px 0 6px;
  }
  .turn-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .turn-name{ font-family:var(--heading-font); font-size:26px; color:var(--accent); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .drawer-handle{
    position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:30;
    writing-mode:vertical-rl; padding:16px 8px; border-radius:12px 0 0 12px;
    background:var(--panel); color:var(--muted); border:1px solid var(--line); border-right:none;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    backdrop-filter:blur(var(--panel-blur)); -webkit-backdrop-filter:blur(var(--panel-blur));
  }
  .drawer-handle:hover{ color:var(--accent); }
  .drawer-handle.open{ opacity:0; pointer-events:none; }
  .drawer-backdrop{
    position:fixed; inset:0; z-index:31; background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .players-drawer{
    position:fixed; top:0; right:0; bottom:0; z-index:32;
    width:min(88vw, 360px); padding:18px 16px 28px; overflow-y:auto;
    background:var(--bg-2); border-left:1px solid var(--line);
    box-shadow:-12px 0 32px rgba(0,0,0,.35);
    transform:translateX(106%); transition:transform .28s ease;
  }
  .players-drawer.open{ transform:none; }
  .drawer-title{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    font-family:var(--heading-font); font-size:20px;
  }
  .pp{ border:1px solid var(--line); border-radius:12px; background:var(--panel-2); margin-bottom:8px; overflow:hidden; }
  .pp.current{ border-color:var(--accent); }
  .pp-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; }
  .pp.current .pp-head{ cursor:default; }
  .pp-order{
    width:22px; height:22px; border-radius:50%; flex:none; font-size:12px;
    background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .pp-name{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pp-now{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase; flex:none;
    background:var(--accent); color:var(--accent-ink); padding:2px 8px; border-radius:999px;
  }
  .pp-stats{ font-size:12px; color:var(--muted); white-space:nowrap; flex:none; }
  .pp-chevron{ color:var(--muted); transition:transform .2s ease; flex:none; }
  .pp.open .pp-chevron{ transform:rotate(90deg); }
  .pp-body{ display:none; padding:2px 12px 10px; border-top:1px solid var(--line); }
  .pp.open .pp-body{ display:block; }
  .pp-card{ display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .pp-card:last-child{ border-bottom:none; }
  .pp-year{ font-family:var(--heading-font); font-weight:700; color:var(--accent); min-width:44px; }
  .pp-song{ flex:1; min-width:0; }
  .pp-song small{ display:block; color:var(--muted); font-size:11px; }
  .pp-tag{ font-size:10px; color:var(--muted); flex:none; }
  .pp-empty{ padding:8px 0; font-size:12px; color:var(--muted); }

  .rank-list{ display:flex; flex-direction:column; gap:8px; margin:18px 0 6px; text-align:left; }
  .rank-row{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
  }
  .rank-row.winner{ border-color:var(--correct); }
  .rank-pos{ font-family:var(--heading-font); font-size:18px; color:var(--muted); min-width:22px; }
  .rank-row.winner .rank-pos{ color:var(--correct); }
  .rank-name{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-score{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .rank-score b{ color:var(--text); font-family:var(--heading-font); font-size:16px; }
  .player-section{ margin-bottom:18px; }
  .player-section h3{ font-size:18px; margin:0 0 4px; text-align:center; }
  .player-section .sub{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .suggest-list{ display:flex; flex-direction:column; gap:10px; }
  .suggest-opt{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text);
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .suggest-opt:hover{ border-color:var(--accent); }
  .suggest-icon{ display:flex; flex:none; }
  .suggest-text{ flex:1; display:flex; flex-direction:column; gap:1px; }
  .suggest-text small{ color:var(--muted); font-size:12px; }
  .suggest-arrow{ color:var(--muted); }
  .chip-group{ display:flex; flex-direction:column; gap:10px; }
  .chip-group-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .chip-quick{ display:flex; gap:6px; }
  .chip-quick .btn-small{ padding:5px 11px; font-size:12px; }
  .chip-n{ margin-left:7px; font-size:11px; opacity:.6; }
  .chip.on .chip-n{ opacity:.75; }
  .pool-info{
    margin-top:20px; padding:10px 14px; border-radius:12px; font-size:13px; text-align:center;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  }
  .pool-info b{ color:var(--text); }
  .pool-info.bad{ border-color:var(--wrong); }
  .pool-info.bad div{ margin-top:4px; color:var(--wrong); }
  .theme-info{ flex:1; }
  .theme-label{ font-family:var(--heading-font); font-size:16px; color:var(--text); }
  .theme-label .wizard-check{ font-size:14px; }
  .theme-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .wizard-slot.selected{ border-color:var(--accent); }
  .wizard-check{ color:var(--correct); font-family:var(--heading-font); font-size:18px; flex:none; }

  /* ---- info-i ---- */
  .label-with-info{ display:flex; align-items:center; gap:8px; }
  .info-btn{
    width:18px; height:18px; padding:0; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    font-family:var(--heading-font); font-style:italic; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .info-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .info-desc{
    background:var(--panel-2); border:1px dashed var(--line); border-radius:10px;
    padding:10px 12px; font-size:13px; color:var(--muted); line-height:1.5;
    margin-top:-8px;
  }

  /* ---- slot settings panel ---- */
  .slot-settings-panel{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-top:-4px; font-size:13px;
  }
  .slot-settings-panel .row{ display:flex; justify-content:space-between; padding:3px 0; color:var(--muted); }
  .slot-settings-panel .row b{ color:var(--text); font-weight:600; }
  .icon-btn{ font-size:15px; padding:8px 10px; }

  /* ---- buttons ---- */
  button{
    font-family:'Space Grotesk', sans-serif;
    cursor:pointer;
    border:none;
    border-radius:var(--btn-radius);
    font-size:15px;
    font-weight:600;
    padding:13px 22px;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(.96);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){opacity:.92;}
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .btn-danger{ background:transparent; color:var(--wrong); border:1px solid var(--wrong); }
  .btn-small{ padding:8px 14px; font-size:13px; border-radius:var(--btn-radius); }

  /* ---- menu ---- */
  .menu-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px;
    margin-bottom:16px;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .menu-card h3{ font-size:18px; margin-bottom:14px; }
  .menu-actions{display:flex; flex-direction:column; gap:12px; align-items:stretch;}
  .menu-actions button{width:100%;}

  .settings-grid{display:flex; flex-direction:column; gap:22px;}
  .setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  .setting-row .label{font-weight:600; font-size:15px;}
  .setting-row .hint{color:var(--muted); font-size:13px; margin-top:3px;}

  .switch{
    position:relative; width:46px; height:26px; border-radius:var(--btn-radius);
    background:var(--panel-2); border:1px solid var(--line); flex:none;
  }
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch .knob{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--text); transition:left .15s ease;
  }
  .switch.on .knob{left:22px; background:var(--accent-ink);}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:7px 14px; border-radius:var(--btn-radius); border:1px solid var(--line);
    font-size:13px; font-weight:600; color:var(--muted); background:transparent;
  }
  .chip.on{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }

  .dropdown{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:var(--btn-radius); padding:9px 14px; font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; flex:none;
  }
  .dropdown:hover{ border-color:var(--accent); }

  .planned-notice{
    background:var(--panel-2); border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; font-size:13px; color:var(--muted); line-height:1.5;
    margin-top:-8px;
  }
  .planned-notice a{ color:var(--accent); font-weight:600; }

  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{
    width:32px; height:32px; padding:0; border-radius:50%;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    font-size:16px; line-height:1;
  }
  .stepper .val{ font-family:var(--heading-font); font-size:20px; min-width:28px; text-align:center; }

  details.info{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 22px; margin-top:8px;
  }
  details.info summary{cursor:pointer; font-weight:600; color:var(--accent); font-size:14px;}
  details.info .body, .menu-card .body{margin-top:2px; color:var(--muted); font-size:14px; line-height:1.6;}
  details.info .body p, .menu-card .body p{margin:0 0 10px;}

  .note{
    font-size:13px; color:var(--muted); border-top:1px dashed var(--line);
    padding-top:14px; margin-top:18px; line-height:1.6;
  }
  .note strong{color:var(--text);}

  /* ---- game header ---- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center;
  }
  .stat b{color:var(--text); font-family:var(--heading-font); font-size:15px;}
  .token-dots{display:flex; gap:4px;}
  .token-dots span{width:9px;height:9px;border-radius:50%; background:var(--line);}
  .token-dots span.filled{background:var(--accent);}

  /* ---- draw area ---- */
  .draw-zone{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    margin:20px 0 32px;
  }
  .vinyl-wrap{
    width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .vinyl-wrap.clickable{cursor:pointer;}
  .player-reload{
    position:absolute; right:-8px; bottom:-8px; z-index:2;
    width:34px; height:34px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); color:var(--muted); border:1px solid var(--line);
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .player-reload:hover{ color:var(--accent); border-color:var(--accent); }
  .player-reload:active{ transform:rotate(180deg) scale(.94); transition:transform .25s ease; }
  .vinyl-wrap.clickable:hover .vinyl{filter:brightness(1.08);}
  .vinyl{
    width:100%;height:100%;border-radius:50%;
    background:
      radial-gradient(circle at center, var(--card-face) 0 18px, #0000 18px),
      repeating-radial-gradient(circle at center, #2c2e3d 0 3px, #23252f 3px 6px);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transform-origin:50% 50%;
  }
  .vinyl .label{
    width:60px;height:60px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent-ink);
  }
  .vinyl.spin{animation:spin 5s linear infinite;}
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .preview-bar{ width:150px; height:4px; border-radius:999px; background:var(--panel-2); overflow:hidden; }
  .preview-bar .fill{ height:100%; width:0%; background:var(--accent); }
  .preview-bar.running .fill{ animation: fillbar 30s linear forwards; }
  @keyframes fillbar{ from{width:0%} to{width:100%} }

  .draw-caption{text-align:center; color:var(--muted); font-size:14px; max-width:320px;}
  .draw-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  .embed-crop{
    width:300px; height:64px; margin:2px auto 0;
    overflow:hidden; border-radius:10px; position:relative;
    background:var(--panel-2); border:1px solid var(--line);
    opacity:0; animation: embedFadeIn .35s ease .45s forwards;
  }
  .embed-crop iframe{
    position:absolute; top:-88px; left:0; width:300px; height:152px; border:0;
  }
  @keyframes embedFadeIn{ to{opacity:1} }
  .embed-crop .crop-hint{
    position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:2px; pointer-events:none; font-size:10px; color:var(--muted); opacity:.6;
  }
  .embed-full{
    width:100%; max-width:300px; margin:2px auto 0; border-radius:10px; overflow:hidden;
  }
  .embed-full iframe{ width:100%; height:152px; border:0; display:block; }

  /* ---- timeline ---- */
  /* Volle Fensterbreite: erst scrollen, wenn die Karten wirklich
     über den kompletten Bildschirm hinauslaufen. */
  .timeline-wrap{
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    padding:14px 20px 8px;
    overflow-x:auto;
    overflow-y:hidden;
    overscroll-behavior-x:contain;
    scrollbar-width:thin;
    scrollbar-color:var(--accent) var(--panel);
  }
  .timeline-wrap::-webkit-scrollbar{ height:10px; }
  .timeline-wrap::-webkit-scrollbar-track{
    background:var(--panel); border-radius:999px; margin:0 20px;
  }
  .timeline-wrap::-webkit-scrollbar-thumb{
    background:var(--accent); border-radius:999px;
    border:2px solid var(--panel);
  }
  .timeline-wrap::-webkit-scrollbar-thumb:hover{ background:#f4bb62; }
  .timeline{
    display:flex; align-items:stretch; gap:0; min-height:150px;
    padding:6px 0 20px;
    width:max-content;
    margin:0 auto;   /* zentriert, solange nichts überläuft */
  }
  .gap{
    flex:none; width:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
  }
  .gap .dot{
    width:14px;height:14px; border-radius:50%; border:2px solid var(--line);
    background:var(--bg-2); transition:all .12s ease;
  }
  .gap.active .dot{ border-color:var(--accent); background:var(--accent); transform:scale(1.3); }
  .gap:not(.locked):hover .dot{ border-color:var(--accent); }
  .gap.locked{cursor:default;}

  .card{
    flex:none; width:118px; background:var(--card-face);
    border-radius:10px; color:var(--ink);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:12px 10px; position:relative;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    border:1px solid rgba(0,0,0,.08);
  }
  .card .year{font-family:var(--heading-font); font-size:26px; font-weight:700;}
  .card .title{font-size:12px; font-weight:600; line-height:1.3; margin-top:6px;}
  .card .artist{font-size:11px; color:#5c5645; margin-top:2px;}
  .card.pending{
    background:var(--panel-2); border:1px dashed var(--accent);
    align-items:center; justify-content:center;
  }
  .card.pending .q{font-family:var(--heading-font); font-size:28px; color:var(--muted);}
  .card.correct{outline:2px solid var(--correct);}
  .card.wrong{outline:2px solid var(--wrong); opacity:.55;}
  .card .tag{
    position:absolute; top:-9px; right:8px; font-size:10px; padding:2px 7px;
    border-radius:999px; font-weight:700; letter-spacing:.02em;
  }
  .card .tag.ok{background:var(--correct); color:#fff;}
  .card .tag.bad{background:var(--wrong); color:#fff;}
  .card .tag.start{background:var(--accent); color:var(--accent-ink);}

  .reveal-actions{display:flex; justify-content:center; gap:10px; margin-top:8px;}

  .token-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-top:10px; display:flex; flex-direction:column; gap:12px;
  }
  .token-panel .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .token-panel .row .desc{font-size:13px; color:var(--muted);}

  .feedback{
    text-align:center; font-size:15px; font-weight:600; margin:6px 0 4px;
  }
  .feedback.ok{color:var(--correct);}
  .feedback.bad{color:var(--wrong);}

  .self-report{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:13px; color:var(--muted); margin-top:10px;
  }
  .self-report input{width:16px;height:16px;}

  /* ---- Titel/Interpret raten ---- */
  .guess-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:6px; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:9px;
  }
  .guess-box .head{
    font-size:13px; font-weight:600; color:var(--text);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .guess-box .head span{color:var(--accent); font-size:12px;}
  .guess-input{
    font-family:'Space Grotesk',sans-serif; font-size:14px;
    background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); width:100%;
  }
  .guess-input:focus{outline:none; border-color:var(--accent);}
  .guess-input::placeholder{color:var(--muted);}
  .guess-hint{font-size:11px; color:var(--muted); line-height:1.45;}

  .guess-result{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 16px; margin-top:6px; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:6px; font-size:13px;
  }
  .guess-result .row{display:flex; gap:8px; align-items:baseline;}
  .guess-result .row .mark{font-weight:700; width:14px; flex:none;}
  .guess-result .row.ok .mark{color:var(--correct);}
  .guess-result .row.bad .mark{color:var(--wrong);}
  .guess-result .row .said{color:var(--muted); font-size:12px;}
  .guess-result .verdict{
    margin-top:4px; padding-top:8px; border-top:1px dashed var(--line);
    font-weight:600;
  }
  .guess-result .verdict.ok{color:var(--accent);}
  .guess-result .verdict.bad{color:var(--muted);}

  /* ---- win screen ---- */
  .win-card{
    text-align:center; padding:40px 26px;
  }
  .win-card .num{font-size:64px; color:var(--accent);}
  .win-card p{color:var(--muted); margin-top:6px;}
  .end-heading{
    font-family:var(--heading-font); font-weight:700; font-size:42px;
    margin-bottom:4px;
  }
  .end-heading.won{ color:var(--correct); }
  .end-heading.lost{ color:var(--wrong); }
  .timeline.final-view{ gap:10px; }
  .win-stats{display:flex; justify-content:center; gap:26px; margin:22px 0; flex-wrap:wrap;}
  .win-stats div{text-align:center;}
  .win-stats .n{font-family:var(--heading-font); font-size:24px;}
  .win-stats .l{font-size:12px; color:var(--muted);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; max-width:360px; width:100%;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .modal-box h3{font-size:19px; margin-bottom:8px;}
  .modal-box p{color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 20px;}
  .modal-actions{display:flex; flex-direction:column; gap:10px;}
  .modal-actions button{width:100%;}

  .save-slot-list{display:flex; flex-direction:column; gap:10px;}
  .save-slot{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .slot-title{font-family:var(--heading-font); font-size:16px;}
  .slot-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .slot-actions{display:flex; gap:8px; flex:none;}

  .top-links{display:flex; justify-content:space-between; width:100%; max-width:760px; margin-bottom:6px;}
  .top-links button{background:none;border:none;color:var(--muted);font-size:13px;padding:6px 0;}
  .top-links button:hover{color:var(--accent);}

  @media (max-width:480px){
    .brand h1{font-size:32px;}
    .vinyl-wrap{width:120px;height:120px;}
  }

</head>

/* ============ STORAGE ============ */
const SAVE_KEY = "chronohit_solo_v1";
const LEGACY_SAVE_KEYS = ["jahrgang_solo_v1"];   // Spielstände aus der Zeit vor der Umbenennung
let memorySave = null;   // Fallback, falls localStorage blockiert ist
async function saveState(){
  const raw = JSON.stringify(state);
  memorySave = raw;
  try{ localStorage.setItem(SAVE_KEY, raw); }catch(e){ /* best effort */ }
}
async function loadSave(){
  try{
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw){
      for(const k of LEGACY_SAVE_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; localStorage.setItem(SAVE_KEY, old); localStorage.removeItem(k); break; }
      }
    }
    raw = raw || memorySave;
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    try{ return memorySave ? JSON.parse(memorySave) : null; }catch(_){ return null; }
  }
}
async function clearSave(){
  memorySave = null;
  try{
    localStorage.removeItem(SAVE_KEY);
    LEGACY_SAVE_KEYS.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}

/* ============ 4 SPEICHERPLÄTZE (Zelda-artig) ============
   Zusätzlich zum automatischen Fortsetzen-Speicherstand oben: bis zu 4
   benannte, manuelle Spielstände. Werden separat gehalten, damit das
   normale Fortsetzen/Autosave unverändert weiterläuft.
*/
const SLOT_COUNT = 4;
const SLOT_KEY_PREFIX = "chronohit_slot_";
let memorySlots = [null, null, null, null];   // Fallback, falls localStorage blockiert ist

function slotKey(n){ return SLOT_KEY_PREFIX + n; }

async function loadAllSlots(){
  const result = [];
  for(let n = 1; n <= SLOT_COUNT; n++){
    let raw = null;
    try{ raw = localStorage.getItem(slotKey(n)); }catch(e){}
    raw = raw || memorySlots[n-1];
    result.push(raw ? JSON.parse(raw) : null);
  }
  return result;
}

async function writeSlot(n, data){
  const raw = JSON.stringify(data);
  memorySlots[n-1] = raw;
  try{ localStorage.setItem(slotKey(n), raw); }catch(e){ /* best effort */ }
  slotsCache[n-1] = data;
}

async function deleteSlot(n){
  memorySlots[n-1] = null;
  try{ localStorage.removeItem(slotKey(n)); }catch(e){}
  slotsCache[n-1] = null;
}

let slotsCache = [null, null, null, null];

function formatSlotDate(ts){
  try{
    return new Date(ts).toLocaleString('de-DE', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return ''; }
}

function openSaveSlotDialog(){
  state.saveSlotDialogOpen = true;
  render();
}
function closeSaveSlotDialog(){
  state.saveSlotDialogOpen = false;
  render();
}
async function saveToSlot(n){
  const snapshot = JSON.parse(JSON.stringify(state));
  snapshot.savedAt = Date.now();
  snapshot.saveSlotDialogOpen = false;
  snapshot.name = (state.saveNameDraft || "").trim();
  await writeSlot(n, snapshot);
  state.saveSlotDialogOpen = false;
  state.saveNameDraft = "";
  render();
}
function loadSlot(n){
  pauseSpotifyPlayback();
  const data = slotsCache[n-1];
  if(!data) return;
  state = JSON.parse(JSON.stringify(data));
  // Felder aus älteren Spielständen nachziehen
  if(!state.guess) state.guess = { t:"", a:"", y:"" };
  if(state.guessResult === undefined) state.guessResult = null;
  if(typeof state.correctCount !== "number") state.correctCount = 0;
  if(typeof state.settings.maxTokens !== "number") state.settings.maxTokens = 5;
  if(typeof state.settings.startTokens !== "number") state.settings.startTokens = 2;
  if(!state.settings.mode) state.settings.mode = "solo";
  if(!state.settings.difficulty) state.settings.difficulty = "normal";
  state.pendingSpend = null;
  state.showExitDialog = false;
  state.saveSlotDialogOpen = false;
  state.confirmOverwriteSave = false;
  state.openSlotSettings = null;
  state.infoOpen = null;
  state.activeSlot = n;
  state.activeSaveName = data.name || "";
  state.playersDrawerOpen = false;
  state.openPlayerPanels = [];
  if(!Array.isArray(state.players)) state.players = [];
  if(isMulti()) syncActiveToPlayer();
  state.screen = "game";
  render();
}
function requestDeleteSlot(n){
  state.confirmDeleteSlot = n;
  render();
}
function cancelDeleteSlot(){
  state.confirmDeleteSlot = null;
  render();
}
async function confirmDeleteSlotNow(){
  const n = state.confirmDeleteSlot;
  state.confirmDeleteSlot = null;
  if(n){ await deleteSlot(n); }
  render();
}

/* ============ TITEL/INTERPRET-PRÜFUNG ============
   Großzügiger Vergleich statt exaktem Textabgleich: Groß-/Kleinschreibung,
   Akzente, Umlaut-Schreibweisen (ue/ae/oe), Satzzeichen, Artikel und
   Feature-Zusätze werden ignoriert; danach erlaubt eine Levenshtein-Distanz
   echte Tippfehler. "enrike iglesias" zählt also als richtig.
*/
function normText(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/&/g," und ")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\b(feat|ft|featuring|the|der|die|das|el|la|los)\b/g," ")
    .replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")
    .replace(/\s+/g," ")
    .trim();
}

function levenshtein(a,b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let prev = new Array(n+1), cur = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j] = j;
  for(let i=1;i<=m;i++){
    cur[0] = i;
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    const tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}

function withinTolerance(a,b){
  const L = Math.max(a.length, b.length);
  // je länger der Text, desto mehr Tippfehler sind erlaubt (max. 4)
  const tol = L <= 4 ? 1 : Math.min(4, Math.max(2, Math.floor(L * 0.25)));
  return levenshtein(a,b) <= tol;
}

function fuzzyEq(a,b){
  if(!a || !b) return false;
  if(a === b) return true;
  if(withinTolerance(a,b)) return true;
  // Anfang genügt, wenn er lang genug ist: "Atemlos" für
  // "Atemlos durch die Nacht".
  const short = a.length <= b.length ? a : b;
  const long  = a.length <= b.length ? b : a;
  if(short.length >= 6 && short.length >= long.length * 0.35){
    if(withinTolerance(short, long.slice(0, short.length))) return true;
  }
  return false;
}

function titleVariants(t){
  const raw = new Set([t]);
  raw.add(t.replace(/\(.*?\)/g," "));           // "Waka Waka (This Time...)" -> "Waka Waka"
  const inside = t.match(/\((.*?)\)/);
  if(inside) raw.add(inside[1]);
  raw.add(t.split(/\s[-–]\s/)[0]);
  raw.add(t.replace(/^[.\s]+/,""));             // "...Baby One More Time"
  return [...raw].map(normText).filter(Boolean);
}

function artistVariants(a){
  const raw = new Set([a]);
  a.replace(/\(.*?\)/g," ")
   .split(/\s*(?:feat\.|ft\.|featuring|&|,|\bx\b|\bund\b)\s*/i)
   .forEach(p => {
     p = p.trim();
     if(!p) return;
     raw.add(p);
     // Nachname allein reicht: "Grönemeyer" statt "Herbert Grönemeyer"
     const words = p.split(/\s+/);
     if(words.length > 1){
       const last = words[words.length-1];
       if(last.length >= 4) raw.add(last);
     }
   });
  return [...raw].map(normText).filter(Boolean);
}

function fuzzyMatch(input, variants){
  const a = normText(input);
  if(!a) return false;
  return variants.some(v => fuzzyEq(a, v));
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ============ SONGAUSWAHL: SPRACHE, GENRE, JAHRZEHNT, KATEGORIE ============
   Innerhalb einer Gruppe genügt EIN Treffer (ODER): ein Song, der Pop UND Rock ist,
   ist dabei, sobald eines von beiden aktiv ist. Zwischen den Gruppen müssen alle
   passen (UND). Songs ohne besondere Kategorie zählen zu "Sonstige". */
const LANG_DEFS = [
  { key:"de", label:"Deutsch" }, { key:"en", label:"Englisch" }, { key:"es", label:"Spanisch" }
];
const STYLE_DEFS = [
  { key:"pop", label:"Pop" }, { key:"rock", label:"Rock" }, { key:"indie", label:"Indie/Alternative" },
  { key:"hiphop", label:"Rap/Hip-Hop" }, { key:"rnb", label:"R&B/Soul" }, { key:"dance", label:"Dance/Electro" },
  { key:"funk", label:"Disco/Funk" }, { key:"latin", label:"Latin" }, { key:"reggae", label:"Reggae/Dancehall" },
  { key:"country", label:"Country/Folk" }, { key:"jazz", label:"Jazz/Blues" }, { key:"schlager", label:"Schlager" }
];
const THEME_DEFS = [
  { key:"film", label:"Film & TV" }, { key:"ballad", label:"Balladen" }, { key:"sport", label:"Sport & WM" },
  { key:"esc", label:"Eurovision" }, { key:"xmas", label:"Weihnachten" }, { key:"ndw", label:"Neue Deutsche Welle" },
  { key:"klassik", label:"Klassik" }, { key:"other", label:"Sonstige" }
];
function decadeOf(y){ return Math.floor(y / 10) * 10; }
function decadeLabel(d){ return d >= 2000 ? `${d}er` : `${String(d).slice(2)}er`; }
function songThemes(song){ return (song.c && song.c.length) ? song.c : ["other"]; }

// Welche Optionen gibt es überhaupt (mit Anzahl)? Leere Gruppen werden in der Oberfläche ausgeblendet.
function buildLibraryStats(){
  const count = (defs, getKeys) => defs.map(d => ({ ...d, count: SONGS.filter(s => getKeys(s).includes(d.key)).length })).filter(d => d.count > 0);
  const decades = [...new Set(SONGS.map(s => decadeOf(s.y)))].sort((a, b) => a - b)
    .map(d => ({ key:String(d), label:decadeLabel(d), count: SONGS.filter(s => decadeOf(s.y) === d).length }));
  return {
    langs:   count(LANG_DEFS,  s => [s.g]),
    styles:  count(STYLE_DEFS, s => s.s || []),
    themes:  count(THEME_DEFS, s => songThemes(s)),
    decades
  };
}
const LIB = buildLibraryStats();

// f: { genres:{de:true,...} (Sprachen), styles|decades|themes: Array oder null = alle }
function songMatches(song, f){
  if(f.genres && !f.genres[song.g]) return false;
  if(f.styles && !(song.s || []).some(k => f.styles.includes(k))) return false;
  if(f.decades && !f.decades.map(Number).includes(decadeOf(song.y))) return false;
  if(f.themes && !songThemes(song).some(k => f.themes.includes(k))) return false;
  return true;
}
function filteredPool(settings){
  const s = settings || state.settings;
  return SONGS.filter(song => songMatches(song, s));
}

function spotifySearchUrl(song){
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  return `https://open.spotify.com/search/${q}`;
}

/* ============ GAME ACTIONS ============ */
function newGame(customSettings, playerNames){
  pauseSpotifyPlayback();
  const settings = customSettings || state.settings;
  const pool = filteredPool(settings);
  let deck = shuffle(pool);
  const startTok = settings.tokens ? (typeof settings.startTokens === "number" ? settings.startTokens : 2) : 0;
  const multi = settings.mode === "multiplayer" && Array.isArray(playerNames) && playerNames.length > 0;
  let players = [];
  let timeline;
  if(multi){
    // Jeder Spieler bekommt eine eigene Startkarte und eine eigene Zeitleiste
    players = playerNames.map(name => ({
      name,
      timeline: [{ ...deck.shift(), __starter: true }],
      tokens: startTok,
      correctCount: 0,
      wrongCount: 0,
      wrongSongs: []
    }));
    timeline = players[0].timeline;
  } else {
    timeline = [{ ...deck.shift(), __starter: true }];
  }
  state = {
    screen: "game",
    settings,
    deck, discard: [],
    timeline,
    current: null,
    phase: "draw",
    pendingGap: null,
    lastResult: null,
    tokens: startTok,
    correctCount: 0,
    wrongCount: 0,
    won: false,
    hasSave: true,
    showExitDialog: false,
    bonusClaimed: false,
    guess: { t:"", a:"", y:"" },
    guessResult: null,
    pendingSpend: null,
    saveSlotDialogOpen: false,
    saveNameDraft: "",
    confirmDeleteSlot: null,
    openSlotSettings: null,
    infoOpen: null,
    activeSlot: null,
    activeSaveName: "",
    confirmOverwriteSave: false,
    confirmDeleteOnFinish: false,
    skippedInfo: null,
    wrongSongs: [],
    showWrongOnTimeline: false,
    players,
    currentPlayer: 0,
    winners: [],
    playersDrawerOpen: false,
    openPlayerPanels: []
  };
  drawNext();
  saveState();
  render();
}

/* ============ MEHRSPIELER (lokal) ============
   Die Top-Level-Felder (timeline, tokens, correctCount, wrongCount,
   wrongSongs) gehören immer dem Spieler, der gerade am Zug ist. Beim
   Zugwechsel werden sie in den Spieler-Eintrag zurückgeschrieben und die
   des nächsten Spielers geladen. So bleibt die gesamte Einzelspieler-Logik
   unverändert nutzbar.
*/
function isMulti(){
  return state.settings.mode === "multiplayer" && Array.isArray(state.players) && state.players.length > 0;
}
function syncActiveToPlayer(){
  if(!isMulti()) return;
  const p = state.players[state.currentPlayer];
  p.timeline = state.timeline;
  p.tokens = state.tokens;
  p.correctCount = state.correctCount;
  p.wrongCount = state.wrongCount;
  p.wrongSongs = state.wrongSongs || [];
}
function loadActiveFromPlayer(){
  const p = state.players[state.currentPlayer];
  state.timeline = p.timeline;
  state.tokens = p.tokens;
  state.correctCount = p.correctCount;
  state.wrongCount = p.wrongCount;
  state.wrongSongs = p.wrongSongs || [];
}
// Aktueller Stand eines Spielers (der aktive kommt aus den Top-Level-Feldern)
function playerView(i){
  const p = state.players[i];
  if(i === state.currentPlayer){
    return { name:p.name, timeline:state.timeline, tokens:state.tokens,
             correctCount:state.correctCount, wrongCount:state.wrongCount,
             wrongSongs:state.wrongSongs || [] };
  }
  return p;
}
function currentPlayerName(){ return isMulti() ? state.players[state.currentPlayer].name : ""; }
function nextPlayerIndex(){ return (state.currentPlayer + 1) % state.players.length; }
function advancePlayer(){
  syncActiveToPlayer();
  state.currentPlayer = nextPlayerIndex();
  loadActiveFromPlayer();
}
function finalizeMultiplayer(){
  if(!isMulti()) return;
  syncActiveToPlayer();
  const counts = state.players.map(p => p.correctCount);
  const max = Math.max(...counts);
  state.winners = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  state.won = true;
}

/* ============ SPOTIFY IFRAME API ============
   Offizielle Embed-Steuerung (kein Login nötig): erlaubt Play/Pause
   programmatisch auszulösen und liefert echte Wiedergabe-Events
   (Position/Dauer) -> der Embed bleibt komplett unsichtbar, der Vinyl-
   Klick startet wirklich die Wiedergabe, und der Fortschrittsbalken ist
   echt statt geraten.
   Fällt automatisch auf den sichtbaren Zuschnitt-Player zurück, falls die
   API blockiert wird (z.B. Adblocker) oder nicht rechtzeitig lädt.
*/
let spotifyController = null;
let spotifyApiObj = null;
let spotifyPendingUri = null;
let spotifyWatchdogStarted = false;
let useFallbackEmbed = false;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  spotifyApiObj = IFrameAPI;
  if(spotifyPendingUri){
    createSpotifyController(spotifyPendingUri);
    spotifyPendingUri = null;
  }
};

function createSpotifyController(uri){
  if(!spotifyApiObj || spotifyController) return;
  const el = document.getElementById('spotify-embed-root');
  if(!el) return;
  spotifyApiObj.createController(el, {uri, width:'300', height:'80'}, (controller) => {
    spotifyController = controller;
    controller.addListener('ready', () => {
      try{ controller.play(); }catch(e){}
    });
    controller.addListener('playback_update', e => {
      onSpotifyPlaybackUpdate(e.data);
    });
  });
}

function onSpotifyPlaybackUpdate(data){
  const fill = document.getElementById('live-progress-fill');
  if(fill && data && data.duration){
    const pct = Math.max(0, Math.min(100, (data.position / data.duration) * 100));
    fill.style.width = pct + '%';
  }
}

function requestSpotifyPlay(song){
  if(useFallbackEmbed) return;
  const uri = 'spotify:track:' + song.id;
  if(spotifyController){
    spotifyController.loadUri(uri);
    setTimeout(() => { try{ spotifyController.play(); }catch(e){} }, 150);
  } else if(spotifyApiObj){
    createSpotifyController(uri);
  } else {
    spotifyPendingUri = uri;
  }
  if(!spotifyWatchdogStarted){
    spotifyWatchdogStarted = true;
    setTimeout(() => {
      if(!spotifyController){
        useFallbackEmbed = true;
        render();
      }
    }, 4000);
  }
}

// Verwirft den (unsichtbaren) Spotify-Player komplett und baut ihn neu auf.
// Läuft der Song gerade (Karte gezogen und abgespielt), startet er direkt wieder.
function reloadPlayer(){
  const song = state.current;
  try{ if(spotifyController) spotifyController.destroy(); }catch(e){}
  spotifyController = null;
  spotifyPendingUri = null;
  const host = document.getElementById("spotify-embed-host");
  if(host) host.innerHTML = '<div id="spotify-embed-root"></div>';
  // API-Modus erneut versuchen, auch wenn vorher auf den sichtbaren Player zurückgefallen wurde
  useFallbackEmbed = false;
  spotifyWatchdogStarted = false;
  const wasStarted = state.phase === "placing" || state.phase === "revealed_pending";
  render();   // setzt auch den Fortschrittsbalken zurück
  if(wasStarted && song && song.id){ requestSpotifyPlay(song); }
}

function toggleSpotifyPlayback(){
  if(!spotifyController || useFallbackEmbed) return;
  try{ spotifyController.togglePlay(); }catch(e){}
}

function pauseSpotifyPlayback(){
  if(spotifyController){ try{ spotifyController.pause(); }catch(e){} }
}

function reshuffleIfNeeded(){
  // Verworfene Karten bleiben dauerhaft draußen (wie im echten Hitster) —
  // kein Nachmischen mehr, sonst wird der Stapel praktisch nie leer und
  // die Niederlage (leerer Stapel) ist so gut wie unerreichbar.
}

function drawNext(){
  pauseSpotifyPlayback();
  state.skippedInfo = null;
  if(state.settings.mode === "coop" && state.tokens <= 0){
    state.current = null;
    state.won = false;
    state.screen = "end";
    return;
  }
  reshuffleIfNeeded();
  if(state.deck.length === 0){
    state.current = null;
    state.phase = "empty";
    state.won = false;
    if(isMulti()) finalizeMultiplayer();
    state.screen = "end";
    return;
  }
  state.current = state.deck.shift();
  state.phase = "draw";
  state.pendingGap = null;
  state.lastResult = null;
  state.bonusClaimed = false;
  state.guess = { t:"", a:"", y:"" };
  state.guessResult = null;
}

function playCurrent(){
  if(!state.current) return;
  state.phase = "placing";
  render(); saveState();
  if(state.current.id){
    if(!useFallbackEmbed){
      requestSpotifyPlay(state.current);
    }
    // im Fallback-Modus übernimmt der sichtbare zugeschnittene Player (siehe render())
  } else {
    window.open(spotifySearchUrl(state.current), "_blank", "noopener");
  }
}

function requestSkip(){
  if(state.tokens < 1 || !state.current) return;
  state.pendingSpend = {type:"skip", amount:1};
  render();
}
function requestBuy(){
  if(state.tokens < 3 || !state.current) return;
  state.pendingSpend = {type:"buy", amount:3};
  render();
}
function cancelSpend(){
  state.pendingSpend = null;
  render();
}
function confirmSpend(){
  const p = state.pendingSpend;
  state.pendingSpend = null;
  if(!p) return;
  if(p.type === "skip") doSkipWithToken();
  else if(p.type === "buy") doBuyWithTokens();
}

function doSkipWithToken(){
  if(state.tokens < 1 || !state.current) return;
  const skipped = state.current;
  state.tokens -= 1;
  state.discard.push(skipped);
  drawNext();
  // Nach drawNext setzen (drawNext leert den Hinweis), damit er bei der neuen Karte erscheint
  state.skippedInfo = { t: skipped.t, a: skipped.a, y: skipped.y };
  render(); saveState();
}

function doBuyWithTokens(){
  if(state.tokens < 3 || !state.current) return;
  state.tokens -= 3;
  // Gekaufte Karte: garantiert korrekt, wird automatisch chronologisch einsortiert
  const song = state.current;
  let idx = state.timeline.findIndex(c => c.y > song.y);
  if(idx === -1) idx = state.timeline.length;
  state.timeline.splice(idx, 0, song);
  state.correctCount += 1;
  checkWin();
  if(state.screen === "game"){ drawNext(); }
  render(); saveState();
}

function chooseGap(gapIndex){
  if(state.phase !== "placing") return;
  state.pendingGap = gapIndex;
  state.phase = "revealed_pending";
  render(); saveState();
}

function isPlacementCorrect(song, gapIndex){
  const left = state.timeline[gapIndex - 1];
  const right = state.timeline[gapIndex];
  if(left && song.y < left.y) return false;
  if(right && song.y > right.y) return false;
  /* "Exaktes Jahr bei Gleichstand" – vorerst deaktiviert.
     War als Zeile unten ohnehin ein No-Op (Bug), da sie so oder so auf
     "return true" hinauslief. Zwei mögliche echte Umsetzungen für später:

     A) Pro-Modus (näher am echten Hitster): Nach dem Platzieren muss
        zusätzlich das exakte Jahr eingegeben werden. Nur richtige Position
        UND richtiges Jahr zählt als Treffer – spürbar schwerer als reines
        chronologisches Einsortieren.

     B) Reine Gleichstand-Regel: Nur wenn eine neue Karte exakt dasselbe
        Jahr wie eine direkt benachbarte Karte auf der Zeitleiste hat, wird
        eine strengere Sonderprüfung angewendet. Ändert im Normalfall
        (unterschiedliche Jahre) nichts am Verhalten.

     if(state.settings.strictYear && left && song.y === left.y) return true;
  */
  return true;
}

function computeGuessCheck(song){
  const said = {
    t:(state.guess.t||"").trim(),
    a:(state.guess.a||"").trim(),
    y:(state.guess.y||"").trim()
  };
  const titleOk  = said.t ? fuzzyMatch(said.t, titleVariants(song.t))  : false;
  const artistOk = said.a ? fuzzyMatch(said.a, artistVariants(song.a)) : false;
  const yearOk   = said.y !== "" ? (parseInt(said.y, 10) === song.y) : false;
  return { said, titleOk, artistOk, yearOk, both: titleOk && artistOk };
}

function revealCard(){
  if(state.phase !== "revealed_pending") return;
  pauseSpotifyPlayback();
  const song = state.current;
  const gapIndex = state.pendingGap;
  const positionOk = isPlacementCorrect(song, gapIndex);
  const diff = state.settings.difficulty;
  const guessCheck = computeGuessCheck(song);

  let ok = positionOk;
  if(diff === "pro"){
    ok = positionOk && guessCheck.titleOk && guessCheck.artistOk;
  } else if(diff === "expert"){
    ok = positionOk && guessCheck.titleOk && guessCheck.artistOk && guessCheck.yearOk;
  }

  if(ok){
    state.timeline.splice(gapIndex, 0, song);
    state.correctCount += 1;
  } else {
    state.discard.push(song);
    state.wrongCount += 1;
    if(!state.wrongSongs) state.wrongSongs = [];
    state.wrongSongs.push(song);
    if(state.settings.mode === "coop"){
      state.tokens = Math.max(0, state.tokens - 1);
    }
  }

  // Bonus-Chrono-Token fürs richtige Titel/Interpret-Raten — gilt in JEDEM
  // Modus, auch in Profi/Experte, wo das Raten ohnehin Pflicht fürs
  // Zählen der Karte ist. Ein Treffer verdient den Token trotzdem.
  let bonusAwarded = false;
  if(state.settings.tokens && state.settings.mode !== "coop" && guessCheck.both && !state.bonusClaimed){
    state.bonusClaimed = true;
    if(state.tokens < state.settings.maxTokens){
      state.tokens += 1;
      bonusAwarded = true;
    }
  }

  state.lastResult = { ok, song, positionOk, guessCheck, difficulty: diff, bonusAwarded };
  state.guessResult = null;
  state.guess = { t:"", a:"", y:"" };

  state.phase = "feedback";
  render(); saveState();
  checkWin();
}

function evaluateGuess(song){
  state.guessResult = null;
  if(!state.settings.tokens) return;
  const said = { t:(state.guess.t||"").trim(), a:(state.guess.a||"").trim() };
  if(!said.t && !said.a){ state.guess = {t:"",a:"",y:""}; return; }

  const titleOk  = said.t ? fuzzyMatch(said.t, titleVariants(song.t))  : false;
  const artistOk = said.a ? fuzzyMatch(said.a, artistVariants(song.a)) : false;
  const both = titleOk && artistOk;

  let awarded = false;
  if(both && !state.bonusClaimed){
    state.bonusClaimed = true;
    if(state.tokens < state.settings.maxTokens){ state.tokens += 1; awarded = true; }
  }
  state.guessResult = { titleOk, artistOk, both, awarded, said };
  state.guess = { t:"", a:"", y:"" };
}

function nextTurn(){
  if(isMulti() && state.players.length > 1) advancePlayer();
  drawNext();
  render(); saveState();
}

function checkWin(){
  // Die Startkarte zählt nicht mit: bei Ziel 10 müssen 10 Karten
  // wirklich richtig platziert worden sein.
  if(state.correctCount >= state.settings.target){
    pauseSpotifyPlayback();
    state.won = true;
    if(isMulti()) finalizeMultiplayer();
    state.screen = "end";
    render(); saveState();
    return true;
  }
  return false;
}

function backToMenu(){
  pauseSpotifyPlayback();
  state.screen = "menu";
  render();
}

function openExitDialog(){
  state.showExitDialog = true;
  render();
}
function closeExitDialog(){
  state.showExitDialog = false;
  render();
}
async function saveAndMenu(){
  pauseSpotifyPlayback();
  state.showExitDialog = false;
  state.hasSave = true;
  if(state.activeSlot){
    const snapshot = JSON.parse(JSON.stringify(state));
    snapshot.savedAt = Date.now();
    snapshot.name = state.activeSaveName;
    await writeSlot(state.activeSlot, snapshot);
  }
  state.screen = "menu";
  saveState();
  render();
}
async function discardAndMenu(){
  pauseSpotifyPlayback();
  await clearSave();
  const keepSettings = state.settings;
  state = {
    screen: "menu",
    settings: keepSettings,
    deck: [], discard: [], timeline: [],
    current: null, phase: "draw", pendingGap: null, lastResult: null,
    tokens: 0, correctCount: 0, wrongCount: 0, won: false, hasSave: false, showExitDialog: false, bonusClaimed: false, pendingSpend: null, saveSlotDialogOpen: false, saveNameDraft: "", confirmDeleteSlot: null, openSlotSettings: null, infoOpen: null, activeSlot: null, activeSaveName: "", confirmOverwriteSave: false, confirmDeleteOnFinish: false, skippedInfo: null, wrongSongs: [], showWrongOnTimeline: false, players: [], currentPlayer: 0, winners: [], playersDrawerOpen: false, openPlayerPanels: [], wizard: null
  };
  render();
}
function abandonGame(){
  pauseSpotifyPlayback();
  clearSave();
  state.hasSave = false;
  state.screen = "menu";
  render();
}

/* ============ RENDER ============ */
const app = document.getElementById("app");

function icon(name){
  const map = {
    play: "▶", check:"✓", cross:"✕", token:"◆"
  };
  return map[name] || "";
}

function slotProgress(slot){
  if(slot.settings && slot.settings.mode === "multiplayer" && Array.isArray(slot.players) && slot.players.length){
    return `${slot.players.length} Spieler`;
  }
  return `${slot.correctCount}/${slot.settings.target}`;
}

function renderSaveSlotModal(){
  const rows = [1,2,3,4].map(n => {
    const slot = slotsCache[n-1];
    return `
      <div class="save-slot">
        <div class="slot-info">
          <div class="slot-title">${slot && slot.name ? esc(slot.name) : `Slot ${n}`}</div>
          <div class="slot-meta">${slot ? `Slot ${n} · ${slotProgress(slot)} · ${formatSlotDate(slot.savedAt)}` : 'leer'}</div>
        </div>
        <button class="btn-primary btn-small" onclick="saveToSlot(${n})">${slot ? 'Überschreiben' : 'Speichern'}</button>
      </div>`;
  }).join('');
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeSaveSlotDialog()">
      <div class="modal-box">
        <h3>In welchen Slot speichern?</h3>
        <input class="guess-input" type="text" maxlength="40" autocomplete="off"
          placeholder="Name für den Spielstand (optional)"
          value="${esc(state.saveNameDraft || '')}"
          oninput="state.saveNameDraft=this.value"
          style="margin-bottom:14px;">
        <div class="save-slot-list">${rows}</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button class="btn-ghost" onclick="closeSaveSlotDialog()">Abbrechen</button>
        </div>
      </div>

}

/* ============ LABELS ============ */
function modeLabel(m){ return m==='multiplayer' ? 'Mehrspieler' : m==='coop' ? 'Koop' : 'Solo'; }
function difficultyLabel(d){ return d==='expert' ? 'Experte' : d==='pro' ? 'Profi' : 'Normal'; }
function genreLabel(g){
  const names = { de:'Deutsch', en:'Englisch', es:'Spanisch' };
  const active = Object.keys(g||{}).filter(k => g[k]).map(k => names[k] || k);
  return active.length ? active.join(', ') : '—';
}

let themeAnimTimer = null;
function selectTheme(key){
  if(key === currentTheme) return;
  const root = document.documentElement;
  // Klasse zuerst setzen, damit die Farbwechsel als Übergang laufen
  root.classList.add("theme-animating");
  applyTheme(key);
  render();
  clearTimeout(themeAnimTimer);
  themeAnimTimer = setTimeout(() => root.classList.remove("theme-animating"), 1000);
}

function startCreateWizard(){
  let defaultSlot = 1;
  for(let n=1; n<=4; n++){ if(!slotsCache[n-1]){ defaultSlot = n; break; } }
  state.wizard = {
    step: 1,
    slot: defaultSlot,
    name: "",
    mode: "solo",
    difficulty: "normal",
    tokens: false,
    maxTokens: 5,
    startTokens: 2,
    coopTokens: 5,
    target: 10,
    playerCount: 2,
    playerNames: ["", ""],
    orderMode: "random",
    genres: Object.fromEntries(LIB.langs.map(l => [l.key, true])),
    styles: Object.fromEntries(LIB.styles.map(x => [x.key, true])),
    decades: Object.fromEntries(LIB.decades.map(x => [x.key, true])),
    themes: Object.fromEntries(LIB.themes.map(x => [x.key, true]))
  };
  state.infoOpen = null;
  state.screen = "create";
  render();
}
// Schritte: Slot, Modus, (Spieler nur bei Mehrspieler), Einstellungen, Songs
function wizardStepKeys(){
  const keys = ["slot", "mode"];
  if(state.wizard.mode === "multiplayer") keys.push("players");
  keys.push("settings", "songs");
  return keys;
}
function wizardNext(){
  if(state.wizard.step < wizardStepKeys().length){ state.wizard.step++; state.infoOpen = null; render(); }
}
function wizardBack(){
  if(state.wizard.step > 1){ state.wizard.step--; state.infoOpen = null; render(); }
  else { state.wizard = null; state.screen = "menu"; render(); }
}
function wizardSetSlot(n){ state.wizard.slot = n; render(); }
function wizardStepPlayerCount(delta){
  const w = state.wizard;
  const n = w.playerCount + delta;
  if(n < 1 || n > 10) return;
  w.playerCount = n;
  while(w.playerNames.length < n) w.playerNames.push("");

function wizardStepStartTokens(delta){

async function createGameFromWizard(){
  const w = state.wizard;
  const settings = w.mode === "coop" ? {
    tokens: true,
    target: w.target,
    maxTokens: w.coopTokens,
    startTokens: w.coopTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    ...songFilterFromWizard(w)
  } : {
    tokens: w.tokens,
    target: w.target,
    maxTokens: w.maxTokens,
    startTokens: w.startTokens,
    mode: w.mode,
    difficulty: w.difficulty,
    ...songFilterFromWizard(w)
  };
  const slotNum = w.slot;
  const saveName = (w.name || "").trim();
  let playerNames = null;
  if(w.mode === "multiplayer"){
    // Leere Namen vor dem Mischen auffüllen, damit "Spieler 3" auch nach dem Auslosen "Spieler 3" bleibt
    playerNames = w.playerNames.map((nm, i) => (nm || "").trim() || `Spieler ${i+1}`);
    if(w.orderMode === "random") playerNames = shuffle(playerNames);
    settings.playerCount = playerNames.length;
  }
  state.wizard = null;
  newGame(settings, playerNames);
  state.activeSlot = slotNum;
  state.activeSaveName = saveName;
  const snapshot = JSON.parse(JSON.stringify(state));
  snapshot.savedAt = Date.now();
  snapshot.name = saveName;
  await writeSlot(slotNum, snapshot);
  render();
}
