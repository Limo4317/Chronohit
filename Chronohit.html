    --card-face-2: #e9dcc2;
    --ink: #22201a;
    --text: #ece7db;
    --muted: #9a97a8;
    --accent: #e8a33d;
    --accent-ink: #3a2a0f;
    --correct: #5a9c78;
    --wrong: #c1483b;
    --line: #34364a;
    --radius: 14px;
    --btn-radius: 999px;
    --heading-font: 'Fraunces', serif;
    --body-font: 'Space Grotesk', sans-serif;
    --body-weight: 400;
    --panel-blur: 0px;
    --body-bg-image: none;
  }

  /* ---- Theme: Dunkel (Gelb->Weiß, Blau->Schwarz) ---- */
  :root[data-theme="dark"]{
    --bg: #0a0a0a;
    --bg-2: #000000;
    --bg-highlight: #1a1a1a;
    --panel: #161616;
    --panel-2: #1f1f1f;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #ffffff;
    --accent-ink: #14151d;
    --correct: #6fbf8f;
    --wrong: #d6564a;
    --line: #2c2c2c;
  }

  /* ---- Theme: Hell (Dunkel-Theme invertiert) ---- */
  :root[data-theme="light"]{
    --bg: #ebeae2;
    --bg-2: #e4e2d6;
    --bg-highlight: #f5f4ee;
    --panel: #dedcd0;
    --panel-2: #d5d2c3;
    --card-face: #0c1526;
    --card-face-2: #16233d;
    --ink: #dddfe5;
    --text: #131824;
    --muted: #6b6d5c;
    --accent: #175cc2;
    --accent-ink: #eaf1fc;
    --correct: #2f7d52;
    --wrong: #b23b30;
    --line: #c9c7b3;
  }

  /* ---- Theme: Modern (Konsolen-Look, leicht angeglast) ---- */
  :root[data-design="modern"]{
    --bg: #0d1416;
    --bg-2: #10181a;
    --bg-highlight: #16302c;
    --panel: rgba(20, 29, 33, 0.82);
    --panel-2: rgba(24, 34, 38, 0.82);
    --text: #dfe9ea;
    --muted: #6d8288;
    --accent: #5eead4;
    --accent-ink: #06302a;
    --correct: #34d399;
    --wrong: #e0453f;
    --line: #233034;
    --radius: 10px;
    --btn-radius: 8px;
    --heading-font: 'Space Mono', monospace;
    --panel-blur: 10px;
    --body-bg-image: radial-gradient(900px 500px at 85% 0%, rgba(94,234,212,0.08), transparent 60%);
  }
  /* ---- Theme: Liquid Glass ----
     Material in Schichten: Hintergrund mit bunten Lichtflecken, darüber Flächen mit
     Blur + Sättigung, diagonalem Glanzverlauf, hellen Lichtkanten (oben links stark,
     unten rechts schwach) und einem Glanzreflex. In Chromium-Browsern kommt zusätzlich
     eine echte Lichtbrechung (SVG-Verzerrung des Hintergrunds) dazu. */
  :root[data-design="glass"]{
    --bg: #13224a;
    --bg-2: #1b2c5c;
    --bg-highlight: #3a5a9c;
    --panel: rgba(255,255,255,0.07);
    --panel-2: rgba(255,255,255,0.12);
    --card-face: rgba(255,255,255,0.84);
    --card-face-2: rgba(255,255,255,0.70);
    --ink: #0d2038;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.74);
    --accent: #00DEFF;
    --accent-ink: #04233a;
    --correct: #30d158;
    --wrong: #ff453a;
    --line: rgba(255,255,255,0.32);
    --radius: 24px;
    --btn-radius: 999px;
    --heading-font: 'Space Grotesk', sans-serif;
    --panel-blur: 16px;
    --glass-filter: blur(var(--panel-blur)) saturate(185%) brightness(1.1);
    --body-bg-image:
      radial-gradient(640px 460px at 12% 18%, rgba(255,95,190,.55), transparent 65%),
      radial-gradient(720px 520px at 88% 26%, rgba(0,222,255,.45), transparent 65%),
      radial-gradient(820px 620px at 55% 95%, rgba(140,95,255,.60), transparent 65%),
      linear-gradient(160deg, #1e3c72 0%, #2a5298 38%, #6a4fc2 70%, #1fa9c4 100%);
  }
  :root.glass-refract[data-design="glass"]{
    --glass-filter: url(#glass-refract) blur(5px) saturate(190%) brightness(1.1);
  }
  :root[data-design="glass"] body{ text-shadow:0 1px 10px rgba(8,16,60,.35); }

  /* Große, schwebende Flächen (mit Backdrop-Blur/Brechung) */
  :root[data-design="glass"] .menu-card,
  :root[data-design="glass"] .modal-box,
  :root[data-design="glass"] .players-drawer,
  :root[data-design="glass"] .stat,
  :root[data-design="glass"] .todo-fab,
  :root[data-design="glass"] .drawer-handle,
  :root[data-design="glass"] .skip-notice,
  :root[data-design="glass"] .guess-box,
  :root[data-design="glass"] .guess-result{
    background-color:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent);
    background-image:linear-gradient(135deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 30%, rgba(255,255,255,.02) 58%, rgba(255,255,255,.12) 100%);
    border:1px solid rgba(255,255,255,.26);
    box-shadow:
      inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.80),
      inset -1px -1px 1px -.5px rgba(255,255,255,.40),
      inset 0 0 26px rgba(255,255,255,.06),
      0 14px 44px rgba(6,12,45,.34);
    backdrop-filter:var(--glass-filter);
    -webkit-backdrop-filter:var(--glass-filter);
  }
  :root[data-design="glass"] .players-drawer{ background-color:rgba(24,40,92,.55); }
  :root[data-design="glass"] .modal-box{ background-color:rgba(255,255,255,.10); }

  /* Glanzreflex oben links + schwacher Gegenreflex unten rechts */
  :root[data-design="glass"] .menu-card,
  :root[data-design="glass"] .modal-box{ position:relative; isolation:isolate; }
  :root[data-design="glass"] .menu-card::before,
  :root[data-design="glass"] .modal-box::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; border-radius:inherit;
    background:
      radial-gradient(130% 70% at 14% -8%, rgba(255,255,255,.42), rgba(255,255,255,0) 52%),
      radial-gradient(90% 60% at 96% 112%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%);
  }

  /* Kleine Elemente innerhalb der Flächen: nur Glanz + Lichtkanten */
  :root[data-design="glass"] .save-slot,
  :root[data-design="glass"] .theme-swatch,
  :root[data-design="glass"] .pp,
  :root[data-design="glass"] .suggest-opt,
  :root[data-design="glass"] .info-desc,
  :root[data-design="glass"] .slot-settings-panel,
  :root[data-design="glass"] .dropdown,
  :root[data-design="glass"] .chip,
  :root[data-design="glass"] .btn-ghost,
  :root[data-design="glass"] .stepper button,
  :root[data-design="glass"] .player-reload{
    background-color:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent);
    background-image:linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.04) 45%, rgba(255,255,255,.10) 100%);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:
      inset 1px 1px .5px -.5px rgba(255,255,255,.75),
      inset -1px -1px .5px -.5px rgba(255,255,255,.30),
      0 6px 18px rgba(6,12,45,.22);
  }
  :root[data-design="glass"] .btn-ghost:hover:not(:disabled),
  :root[data-design="glass"] .chip:hover,
  :root[data-design="glass"] .save-slot:hover,
  :root[data-design="glass"] .theme-swatch:hover,
  :root[data-design="glass"] .suggest-opt:hover{ background-color:rgba(255,255,255,.2); }
  :root[data-design="glass"] .chip.on{ background-color:var(--accent); background-image:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%); border-color:rgba(255,255,255,.6); }
  :root[data-design="glass"] .theme-swatch.selected,
  :root[data-design="glass"] .wizard-slot.selected,
  :root[data-design="glass"] .pp.current{ border-color:var(--accent); }

  /* Primärbutton: glänzender, leuchtender Glas-Knopf */
  :root[data-design="glass"] .btn-primary{
    background-color:var(--accent);
    background-image:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 58%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -3px 8px rgba(0,70,110,.28),
      0 8px 26px rgba(0,222,255,.38);
    text-shadow:none;
  }
  :root[data-design="glass"] .switch.on{ box-shadow:0 0 18px rgba(0,222,255,.55); }

  /* Karten: gefrostetes Milchglas */
  :root[data-design="glass"] .card{
    background-image:linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 50%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 1px 1px 1px rgba(255,255,255,.95), 0 10px 26px rgba(6,12,45,.30);
    backdrop-filter:blur(10px) saturate(170%);
    -webkit-backdrop-filter:blur(10px) saturate(170%);
    text-shadow:none;
  }
  :root[data-design="glass"] .card.pending{ border:1px dashed var(--accent); background-image:none; }

  /* ---- Theme: NRC (angelehnt an die NRC-Website) ----
     Reines Schwarz, blauer Akzent, Pixel-Überschriften (Minecraft-Look), schlanke
     Outfit-Schrift, hauchdünne Rahmen, Listenzeilen mit Akzentbalken. */
  :root[data-design="norisk"]{
    --bg: #000000;
    --bg-2: #070707;
    --bg-highlight: #0b1220;
    --panel: rgba(255,255,255,0.04);
    --panel-2: rgba(255,255,255,0.07);
    --card-face: #f2f2f2;
    --card-face-2: #e2e2e2;
    --ink: #0a0a0a;
    --text: #f7f7f7;
    --muted: #979a9f;
    --accent: #4f8eff;
    --accent-ink: #04101f;
    --correct: #4ade80;
    --wrong: #f87171;
    --line: rgba(255,255,255,0.08);
    --radius: 16px;
    --btn-radius: 8px;
    --heading-font: 'NRCMinecraft', 'Pixelify Sans', monospace;
    --body-font: 'Outfit', sans-serif;
    --body-weight: 400;
    font-synthesis: none;
    --panel-blur: 0px;
    --body-bg-image: radial-gradient(900px 420px at 50% -10%, rgba(79,142,255,.12), transparent 70%);
  }
  :root[data-design="norisk"] h1,
  :root[data-design="norisk"] h2,
  :root[data-design="norisk"] h3{ font-weight:400; letter-spacing:0; line-height:1.15; }
  :root[data-design="norisk"] .brand h1{ font-size:clamp(2rem, 6vw, 3rem); line-height:1; }
  /* Kleine Abschnittsüberschriften wie in der NoRisk-Seitenleiste */
  :root[data-design="norisk"] .menu-card h3{
    font-family:var(--body-font); font-size:.6875rem; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted); line-height:1;
    margin-bottom:18px;
  }
  :root[data-design="norisk"] .menu-card{ background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); }
  :root[data-design="norisk"] .modal-box{
    background:#0a0a0a; border:1px solid rgba(255,255,255,.10); box-shadow:0 24px 60px rgba(0,0,0,.65);
  }
  :root[data-design="norisk"] .btn-ghost{
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.82); font-weight:500;
  }
  :root[data-design="norisk"] .btn-ghost:hover:not(:disabled){
    background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;
  }
  :root[data-design="norisk"] .btn-primary{ font-weight:600; box-shadow:0 0 24px rgba(79,142,255,.28); }
  :root[data-design="norisk"] .chip{ border-radius:999px; }
  :root[data-design="norisk"] .switch{ border-radius:999px; }
  :root[data-design="norisk"] .card{ border:1px solid rgba(255,255,255,.18); border-radius:8px; }
  :root[data-design="norisk"] .card .tag{ border-radius:4px; }
  :root[data-design="norisk"] button:focus-visible,
  :root[data-design="norisk"] a:focus-visible,
  :root[data-design="norisk"] input:focus-visible,
  :root[data-design="norisk"] select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* Listen: eine Umrandung, Zeilen mit Haarlinien und Akzentbalken beim Hover */
  :root[data-design="norisk"] .save-slot-list,
  :root[data-design="norisk"] .theme-list,
  :root[data-design="norisk"] .suggest-list{
    gap:0; border:1px solid rgba(255,255,255,.07); border-radius:8px; overflow:hidden;
    background:rgba(255,255,255,.013);
  }
  :root[data-design="norisk"] .save-slot,
  :root[data-design="norisk"] .theme-swatch,
  :root[data-design="norisk"] .suggest-opt{
    position:relative; overflow:hidden; background:transparent; border:none; border-radius:0;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  :root[data-design="norisk"] .save-slot:last-child,
  :root[data-design="norisk"] .theme-swatch:last-child,
  :root[data-design="norisk"] .suggest-opt:last-child{ border-bottom:none; }
  :root[data-design="norisk"] .save-slot:hover,
  :root[data-design="norisk"] .theme-swatch:hover,
  :root[data-design="norisk"] .suggest-opt:hover{ background:rgba(255,255,255,.02); }
  :root[data-design="norisk"] .save-slot::before,
  :root[data-design="norisk"] .theme-swatch::before,
  :root[data-design="norisk"] .suggest-opt::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent);
    transform:scaleY(0); transition:transform .4s cubic-bezier(.16, 1, .3, 1);
  }
  :root[data-design="norisk"] .save-slot:hover::before,
  :root[data-design="norisk"] .theme-swatch:hover::before,
  :root[data-design="norisk"] .suggest-opt:hover::before,
  :root[data-design="norisk"] .theme-swatch.selected::before,
  :root[data-design="norisk"] .wizard-slot.selected::before{ transform:scaleY(1); }
  :root[data-design="norisk"] .theme-swatch.selected{ border-color:transparent; }
  :root[data-design="norisk"] .timeline-wrap{ scrollbar-width:thin; }
  :root[data-design="norisk"] .timeline-wrap::-webkit-scrollbar{ height:4px; }
  :root[data-design="norisk"] .timeline-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.22); }
  :root[data-design="norisk"] .timeline-wrap::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  :root[data-design="norisk"] .players-drawer::-webkit-scrollbar{ width:2px; }
  :root[data-design="norisk"] .players-drawer::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); }

  /* Farb-Variablen als echte <color>-Typen registrieren: dann lassen sie sich
     weich ineinander überblenden (inkl. Verläufe, Rahmen, Schatten usw.) */
  @property --bg{ syntax:'<color>'; inherits:true; initial-value:#14151d; }
  @property --bg-2{ syntax:'<color>'; inherits:true; initial-value:#1b1d29; }
  @property --bg-highlight{ syntax:'<color>'; inherits:true; initial-value:#23263a; }
  @property --panel{ syntax:'<color>'; inherits:true; initial-value:#21232f; }
  @property --panel-2{ syntax:'<color>'; inherits:true; initial-value:#2a2d3c; }
  @property --card-face{ syntax:'<color>'; inherits:true; initial-value:#f3ead9; }
  @property --card-face-2{ syntax:'<color>'; inherits:true; initial-value:#e9dcc2; }
  @property --ink{ syntax:'<color>'; inherits:true; initial-value:#22201a; }
  @property --text{ syntax:'<color>'; inherits:true; initial-value:#ece7db; }
  @property --muted{ syntax:'<color>'; inherits:true; initial-value:#9a97a8; }
  @property --accent{ syntax:'<color>'; inherits:true; initial-value:#e8a33d; }
  @property --accent-ink{ syntax:'<color>'; inherits:true; initial-value:#3a2a0f; }
  @property --correct{ syntax:'<color>'; inherits:true; initial-value:#5a9c78; }
  @property --wrong{ syntax:'<color>'; inherits:true; initial-value:#c1483b; }
  @property --line{ syntax:'<color>'; inherits:true; initial-value:#34364a; }
  @property --radius{ syntax:'<length>'; inherits:true; initial-value:14px; }
  @property --panel-blur{ syntax:'<length>'; inherits:true; initial-value:0px; }
  :root.theme-animating{
    transition-property:--bg, --bg-2, --bg-highlight, --panel, --panel-2, --card-face, --card-face-2,
      --ink, --text, --muted, --accent, --accent-ink, --correct, --wrong, --line, --radius, --panel-blur;
    transition-duration:.9s;
    transition-timing-function:cubic-bezier(.4, 0, .2, 1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{
    background:
      var(--body-bg-image),
      radial-gradient(1200px 600px at 50% -10%, var(--bg-highlight) 0%, var(--bg) 55%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body-font);
    font-weight:var(--body-weight);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1,h2,h3, .num{
    font-family:var(--heading-font);
    font-weight:600;
    margin:0;
  }
  #app{width:100%;max-width:760px;}
  .brand{
    text-align:center;
    margin-bottom:28px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:calc(13px * var(--font-scale));
    letter-spacing:.14em;
    color:var(--accent);
    margin-bottom:6px;
  }
  .brand .mark::before, .brand .mark::after{
    content:"";
    width:26px;height:1px;background:var(--line);
  }
  .brand h1{
    font-size:calc(42px * var(--font-scale));
    color:var(--text);
  }
  .brand p{
    color:var(--muted);
    margin-top:8px;
    font-size:calc(15px * var(--font-scale));
  }

  /* ---- splash ---- */
  .splash-wrap{
    min-height:70vh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:36px;
  }
  .splash-title{
    font-family:var(--heading-font); font-weight:700; font-size:calc(44px * var(--font-scale));
    color:var(--accent); letter-spacing:.03em; text-align:center;
  }
  .splash-play{
    width:130px; height:130px; border-radius:50%;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent);
    border:3px solid var(--accent);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 36px rgba(0,0,0,.45);
    transition:transform .15s ease;
    padding:0;
  }
  .splash-play:hover{ transform:scale(1.06); }

  /* ---- loading ---- */
  .loading-box{
    display:flex; flex-direction:column; align-items:center; gap:16px; width:260px;
    animation: loadingBoxFadeOut .4s ease 1.1s forwards;
  }
  @keyframes loadingBoxFadeOut{ from{opacity:1} to{opacity:0} }
  #app.fade-in{ animation: appFadeIn .4s ease; }
  @keyframes appFadeIn{ from{opacity:0} to{opacity:1} }
  .loading-label{ font-family:var(--heading-font); font-size:calc(20px * var(--font-scale)); color:var(--accent); }
  .loading-frame{
    width:100%; height:16px; border:2px solid var(--accent); border-radius:5px;
    overflow:hidden; background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); padding:2px;
  }
  .loading-fill{
    height:100%; width:0%; background:var(--accent); border-radius:2px;
    animation: loadingFill 1.2s ease-in-out forwards;
  }
  @keyframes loadingFill{ from{width:0%} to{width:100%} }

  /* ---- to-do fab ---- */
  .fab-stack{
    position:fixed; right:18px; bottom:18px; z-index:20;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .todo-fab{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); color:var(--muted);
    border-radius:var(--btn-radius); padding:10px 16px; font-size:calc(13px * var(--font-scale)); font-weight:600;
    text-decoration:none; display:inline-block;
  }
  .todo-fab:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---- wizard ---- */
  .wizard-steps{ display:flex; justify-content:center; gap:8px; margin-top:12px; }
  .wizard-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .wizard-dot.active{ background:var(--accent); width:20px; border-radius:999px; }
  .wizard-dot.done{ background:var(--correct); }
  .wizard-actions{ flex-direction:row !important; justify-content:space-between; }
  .wizard-actions button{ width:auto; }
  .wizard-slot{ cursor:pointer; }

  /* ---- theme picker ---- */
  .theme-list{ display:flex; flex-direction:column; gap:10px; }
  .theme-swatch{
    display:flex; align-items:center; gap:14px; cursor:pointer;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .theme-swatch.selected{ border-color:var(--accent); }
  .theme-dots{ display:flex; gap:5px; flex:none; }
  .theme-dots span{
    width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.15);
  }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(1){ background:#14151d; }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(2){ background:#21232f; }
  .theme-swatch[data-theme-preview="og"] .theme-dots span:nth-child(3){ background:#e8a33d; }
  .theme-swatch[data-theme-preview="dark"] .theme-dots span:nth-child(1){ background:#0a0a0a; }

  .custom-theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; }
  .custom-color-row{

  /* ---- mehrspieler ---- */

  .players-drawer{

  .pp-order{
    width:22px; height:22px; border-radius:50%; flex:none; font-size:calc(12px * var(--font-scale));

  }

  .pp-now{
    font-size:calc(10px * var(--font-scale)); letter-spacing:.06em; text-transform:uppercase; flex:none;
    background:var(--accent); color:var(--accent-ink); padding:2px 8px; border-radius:999px;
  }
  .pp-stats{ font-size:calc(12px * var(--font-scale)); color:var(--muted); white-space:nowrap; flex:none; }
  .pp-chevron{ color:var(--muted); transition:transform .2s ease; flex:none; }

  .pp-body{ display:none; padding:2px 12px 10px; border-top:1px solid var(--line); }

  .pp-card{ display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:calc(13px * var(--font-scale)); }

  .pp-song{ flex:1; min-width:0; }

  .pp-tag{ font-size:calc(10px * var(--font-scale)); color:var(--muted); flex:none; }
  .pp-empty{ padding:8px 0; font-size:calc(12px * var(--font-scale)); color:var(--muted); }

  .rank-list{ display:flex; flex-direction:column; gap:8px; margin:18px 0 6px; text-align:left; }
  .rank-row{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:12px;
  }
  .rank-row.winner{ border-color:var(--correct); }
  .rank-pos{ font-family:var(--heading-font); font-size:calc(18px * var(--font-scale)); color:var(--muted); min-width:22px; }
  .rank-row.winner .rank-pos{ color:var(--correct); }
  .rank-name{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-score{ font-size:calc(13px * var(--font-scale)); color:var(--muted); white-space:nowrap; }
  .rank-score b{ color:var(--text); font-family:var(--heading-font); font-size:calc(16px * var(--font-scale)); }
  .player-section{ margin-bottom:18px; }
  .player-section h3{ font-size:calc(18px * var(--font-scale)); margin:0 0 4px; text-align:center; }
  .player-section .sub{ text-align:center; font-size:calc(12px * var(--font-scale)); color:var(--muted); margin-bottom:4px; }
  .suggest-list{ display:flex; flex-direction:column; gap:10px; }
  .suggest-opt{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text);
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .suggest-opt:hover{ border-color:var(--accent); }
  .suggest-icon{ display:flex; flex:none; }
  .suggest-text{ flex:1; display:flex; flex-direction:column; gap:1px; }
  .suggest-text small{ color:var(--muted); font-size:calc(12px * var(--font-scale)); }
  .suggest-arrow{ color:var(--muted); }
  .step-hint{ margin:-6px 0 18px; font-size:calc(13px * var(--font-scale)); line-height:1.5; color:var(--muted); }
  .chip-group{ display:flex; flex-direction:column; gap:10px; padding-bottom:16px; border-bottom:1px dashed var(--line); }
  .chip-group:last-child{ border-bottom:none; padding-bottom:0; }
  .stage-num{
    width:22px; height:22px; border-radius:50%; flex:none; font-size:calc(12px * var(--font-scale)); font-weight:600;
    background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
  }
  .stage-move{ display:flex; gap:6px; }
  .stage-move .icon-btn{ padding:5px 10px; font-size:calc(12px * var(--font-scale)); }
  .chip-group-sub{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .stage-after{ font-size:calc(12px * var(--font-scale)); color:var(--muted); }
  .stage-after b{ color:var(--text); }
  .chip.empty{ opacity:.35; }
  .chip-group-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .chip-quick{ display:flex; gap:6px; }
  .chip-quick .btn-small{ padding:5px 11px; font-size:calc(12px * var(--font-scale)); }
  .chip-n{ margin-left:7px; font-size:calc(11px * var(--font-scale)); opacity:.6; }
  .chip.on .chip-n{ opacity:.75; }
  .pool-info{
    margin-top:20px; padding:10px 14px; border-radius:12px; font-size:calc(13px * var(--font-scale)); text-align:center;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); color:var(--muted);
  }
  .pool-info b{ color:var(--text); }
  .pool-info.bad{ border-color:var(--wrong); }
  .pool-info.bad div{ margin-top:4px; color:var(--wrong); }
  /* ---- Seitenmenü ---- */
  .qm-button{
    position:fixed; top:14px; left:14px; z-index:29; width:46px; height:46px; padding:0;
    border-radius:50%; display:none; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); color:var(--text);
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    backdrop-filter:blur(var(--panel-blur)); -webkit-backdrop-filter:blur(var(--panel-blur));
  }
  .qm-button.show{ display:flex; }
  .qm-button:hover{ border-color:var(--accent); }
  .qm-backdrop{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .qm-backdrop.open{ opacity:1; pointer-events:auto; }
  .qm-panel{
    position:fixed; top:0; left:0; bottom:0; z-index:41; width:min(88vw, 340px);
    padding:18px 16px 28px; overflow-y:auto;
    background:var(--bg-2); border-right:1px solid var(--line);
    box-shadow:12px 0 32px rgba(0,0,0,.35);
    transform:translateX(-106%); transition:transform .28s ease;
  }
  .qm-panel.open{ transform:none; }
  .qm-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .qm-brand{ display:flex; align-items:center; gap:10px; font-family:var(--heading-font); font-size:calc(20px * var(--font-scale)); }
  .qm-section{ margin-bottom:24px; }
  .qm-title{ font-size:calc(11px * var(--font-scale)); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .qm-panel .theme-desc{ display:none; }
  .qm-panel .theme-swatch{ padding:9px 12px; }
  .qm-custom{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .qm-custom .custom-theme-grid{ grid-template-columns:1fr 1fr; gap:10px 14px; }
  .qm-custom .setting-row{ gap:10px; }
  .qm-custom input[type="range"]{ width:110px !important; }
  @media (max-width: 900px){ html.has-qm body{ padding-top:76px; } }
  :root[data-design="glass"] .qm-button,
  :root[data-design="glass"] .qm-panel{
    background-color:rgba(24,40,92,.55);
    background-image:linear-gradient(135deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 30%, rgba(255,255,255,.02) 58%, rgba(255,255,255,.12) 100%);
    border:1px solid rgba(255,255,255,.26);
    box-shadow:inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.8), inset -1px -1px 1px -.5px rgba(255,255,255,.4), 0 14px 44px rgba(6,12,45,.34);
    backdrop-filter:var(--glass-filter); -webkit-backdrop-filter:var(--glass-filter);

  /* Leuchtender Kreis, der dem Cursor folgt (nur im NRC-Theme) */

    pointer-events:none; z-index:-1; display:none; opacity:0; transition:opacity .5s ease; will-change:transform;
    background:radial-gradient(circle, rgba(79,142,255,.34) 0%, rgba(79,142,255,.14) 40%, rgba(79,142,255,0) 70%);

  .theme-label .wizard-check{ font-size:calc(14px * var(--font-scale)); }

  .label-with-info{ display:flex; align-items:center; gap:8px; }

    width:18px; height:18px; padding:0; border-radius:50%;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); color:var(--muted);
    font-family:var(--heading-font); font-style:italic; font-size:calc(12px * var(--font-scale)); line-height:1;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .info-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .info-desc{
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px dashed var(--line); border-radius:10px;
    padding:10px 12px; font-size:calc(13px * var(--font-scale)); color:var(--muted); line-height:1.5;
    margin-top:-8px;
  }

  /* ---- slot settings panel ---- */
  .slot-settings-panel{
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-top:-4px; font-size:calc(13px * var(--font-scale));
  }
  .slot-settings-panel .row{ display:flex; justify-content:space-between; padding:3px 0; color:var(--muted); }
  .slot-settings-panel .row b{ color:var(--text); font-weight:600; }
  .icon-btn{ font-size:calc(15px * var(--font-scale)); padding:8px 10px; }

  /* ---- buttons ---- */
  button{
    font-family:var(--body-font);
    cursor:pointer;
    border:none;
    border-radius:var(--btn-radius);
    font-size:calc(15px * var(--font-scale));
    font-weight:600;
    padding:13px 22px;
    transition:transform .12s ease, opacity .12s ease;
  }

  button:disabled{opacity:.35; cursor:not-allowed;}
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){opacity:.92;}
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .btn-danger{ background:transparent; color:var(--wrong); border:1px solid var(--wrong); }
  .btn-small{ padding:8px 14px; font-size:calc(13px * var(--font-scale)); border-radius:var(--btn-radius); }

  .menu-card{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent);

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  .setting-row .hint{color:var(--muted); font-size:calc(13px * var(--font-scale)); margin-top:3px;}

  .switch{
    position:relative; width:46px; height:26px; border-radius:var(--btn-radius);
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); flex:none;

  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch .knob{

  }
  .switch.on .knob{left:22px; background:var(--accent-ink);}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:7px 14px; border-radius:var(--btn-radius); border:1px solid var(--line);
    font-size:calc(13px * var(--font-scale)); font-weight:600; color:var(--muted); background:transparent;
  }
  .chip.on{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }

  .dropdown{
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); color:var(--text); border:1px solid var(--line);
    border-radius:var(--btn-radius); padding:9px 14px; font-family:'Space Grotesk',sans-serif;
    font-size:calc(14px * var(--font-scale)); font-weight:600; cursor:pointer; flex:none;
  }
  .dropdown:hover{ border-color:var(--accent); }

  .planned-notice{
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; font-size:calc(13px * var(--font-scale)); color:var(--muted); line-height:1.5;
    margin-top:-8px;
  }

  .stepper{display:flex; align-items:center; gap:14px;}

    width:32px; height:32px; padding:0; border-radius:50%;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); color:var(--text); border:1px solid var(--line);
    font-size:calc(16px * var(--font-scale)); line-height:1;

  .stepper .val{ font-family:var(--heading-font); font-size:calc(20px * var(--font-scale)); min-width:28px; text-align:center; }

  details.info{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 22px; margin-top:8px;
  }
  details.info summary{cursor:pointer; font-weight:600; color:var(--accent); font-size:calc(14px * var(--font-scale));}

  .note{
    font-size:calc(13px * var(--font-scale)); color:var(--muted); border-top:1px dashed var(--line);
    padding-top:14px; margin-top:18px; line-height:1.6;
  }

  /* ---- game header ---- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .stat{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-size:calc(13px * var(--font-scale)); color:var(--muted); display:flex; gap:8px; align-items:center;
  }
  .stat b{color:var(--text); font-family:var(--heading-font); font-size:calc(15px * var(--font-scale));}
  .token-dots{display:flex; gap:4px;}
  .token-dots span{width:9px;height:9px;border-radius:50%; background:var(--line);}
  .token-dots span.filled{background:var(--accent);}

  /* ---- draw area ---- */
  .draw-zone{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    margin:20px 0 32px;
  }
  .vinyl-wrap{
    width:150px;height:150px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .vinyl-wrap.clickable{cursor:pointer;}
  .player-reload{
    position:absolute; right:-8px; bottom:-8px; z-index:2;
    width:34px; height:34px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); color:var(--muted); border:1px solid var(--line);
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .player-reload:hover{ color:var(--accent); border-color:var(--accent); }
  .player-reload:active{ transform:rotate(180deg) scale(.94); transition:transform .25s ease; }
  .vinyl-wrap.clickable:hover .vinyl{filter:brightness(1.08);}
  .vinyl{
    width:100%;height:100%;border-radius:50%;
    background:
      radial-gradient(circle at center, var(--card-face) 0 18px, #0000 18px),
      repeating-radial-gradient(circle at center, #2c2e3d 0 3px, #23252f 3px 6px);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transform-origin:50% 50%;
  }
  .vinyl .label{
    width:60px;height:60px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent-ink);
  }
  .vinyl.spin{animation:spin 5s linear infinite;}
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .preview-bar{ width:150px; height:4px; border-radius:999px; background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); overflow:hidden; }
  .preview-bar .fill{ height:100%; width:0%; background:var(--accent); }
  .preview-bar.running .fill{ animation: fillbar 30s linear forwards; }
  @keyframes fillbar{ from{width:0%} to{width:100%} }

  .draw-caption{text-align:center; color:var(--muted); font-size:calc(14px * var(--font-scale)); max-width:320px;}
  .draw-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  .embed-crop{
    width:300px; height:64px; margin:2px auto 0;
    overflow:hidden; border-radius:10px; position:relative;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line);
    opacity:0; animation: embedFadeIn .35s ease .45s forwards;
  }
  .embed-crop iframe{
    position:absolute; top:-88px; left:0; width:300px; height:152px; border:0;
  }
  @keyframes embedFadeIn{ to{opacity:1} }
  .embed-crop .crop-hint{
    position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:2px; pointer-events:none; font-size:calc(10px * var(--font-scale)); color:var(--muted); opacity:.6;
  }
  .embed-full{
    width:100%; max-width:300px; margin:2px auto 0; border-radius:10px; overflow:hidden;
  }
  .embed-full iframe{ width:100%; height:152px; border:0; display:block; }

  /* ---- timeline ---- */
  /* Volle Fensterbreite: erst scrollen, wenn die Karten wirklich
     über den kompletten Bildschirm hinauslaufen. */
  .timeline-wrap{
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    padding:14px 20px 8px;
    overflow-x:auto;
    overflow-y:hidden;
    overscroll-behavior-x:contain;
    scrollbar-width:thin;
    scrollbar-color:var(--accent) color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent);
  }
  .timeline-wrap::-webkit-scrollbar{ height:10px; }
  .timeline-wrap::-webkit-scrollbar-track{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border-radius:999px; margin:0 20px;
  }
  .timeline-wrap::-webkit-scrollbar-thumb{
    background:var(--accent); border-radius:999px;
    border:2px solid color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent);
  }
  .timeline-wrap::-webkit-scrollbar-thumb:hover{ background:#f4bb62; }
  .timeline{
    display:flex; align-items:stretch; gap:0; min-height:150px;
    padding:6px 0 20px;
    width:max-content;
    margin:0 auto;   /* zentriert, solange nichts überläuft */
  }
  .gap{
    flex:none; width:var(--gap-w, 26px); display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
  }
  .gap .dot{
    width:14px;height:14px; border-radius:50%; border:2px solid var(--line);
    background:var(--bg-2); transition:all .12s ease;
  }
  .gap.active .dot{ border-color:var(--accent); background:var(--accent); transform:scale(1.3); }
  .gap:not(.locked):hover .dot{ border-color:var(--accent); }
  .gap.locked{cursor:default;}
  .gap.kb .dot{ border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); transform:scale(1.4); }

  .card{
    flex:none; width:var(--card-w, 118px); background:var(--card-face);
    border-radius:10px; color:var(--ink);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:12px 10px; position:relative;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
    border:1px solid rgba(0,0,0,.08);
  }
  .card .year{font-family:var(--heading-font); font-size:calc(26px * var(--font-scale) * var(--card-scale, 1)); font-weight:700;}
  .card .title{font-size:calc(12px * var(--font-scale) * var(--card-scale, 1)); font-weight:600; line-height:1.3; margin-top:6px;}
  .card .artist{font-size:calc(11px * var(--font-scale) * var(--card-scale, 1)); color:#5c5645; margin-top:2px;}
  .card.pending{
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px dashed var(--accent);
    align-items:center; justify-content:center;
  }
  .card.pending .q{font-family:var(--heading-font); font-size:calc(28px * var(--font-scale)); color:var(--muted);}
  .card.correct{outline:2px solid var(--correct);}
  .card.wrong{outline:2px solid var(--wrong); opacity:.55;}
  .card .tag{
    position:absolute; top:-9px; right:8px; font-size:calc(10px * var(--font-scale)); padding:2px 7px;
    border-radius:999px; font-weight:700; letter-spacing:.02em;
  }
  .card .tag.ok{background:var(--correct); color:#fff;}
  .card .tag.bad{background:var(--wrong); color:#fff;}
  .card .tag.start{background:var(--accent); color:var(--accent-ink);}

  .reveal-actions{display:flex; justify-content:center; gap:10px; margin-top:8px;}

  .token-panel{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-top:10px; display:flex; flex-direction:column; gap:12px;
  }
  .token-panel .row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .token-panel .row .desc{font-size:calc(13px * var(--font-scale)); color:var(--muted);}

  .feedback{
    text-align:center; font-size:calc(15px * var(--font-scale)); font-weight:600; margin:6px 0 4px;
  }
  .feedback.ok{color:var(--correct);}
  .feedback.bad{color:var(--wrong);}

  .self-report{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:calc(13px * var(--font-scale)); color:var(--muted); margin-top:10px;
  }
  .self-report input{width:16px;height:16px;}

  /* ---- Titel/Interpret raten ---- */
  .guess-box{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:6px; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:9px;
  }
  .guess-box .head{
    font-size:calc(13px * var(--font-scale)); font-weight:600; color:var(--text);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .guess-box .head span{color:var(--accent); font-size:calc(12px * var(--font-scale));}
  .guess-input{
    font-family:'Space Grotesk',sans-serif; font-size:calc(14px * var(--font-scale));
    background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); width:100%;
  }
  .guess-input:focus{outline:none; border-color:var(--accent);}
  .guess-input::placeholder{color:var(--muted);}
  .guess-hint{font-size:calc(11px * var(--font-scale)); color:var(--muted); line-height:1.45;}

  .guess-result{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 16px; margin-top:6px; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:6px; font-size:calc(13px * var(--font-scale));
  }
  .guess-result .row{display:flex; gap:8px; align-items:baseline;}
  .guess-result .row .mark{font-weight:700; width:14px; flex:none;}
  .guess-result .row.ok .mark{color:var(--correct);}
  .guess-result .row.bad .mark{color:var(--wrong);}
  .guess-result .row .said{color:var(--muted); font-size:calc(12px * var(--font-scale));}
  .guess-result .verdict{
    margin-top:4px; padding-top:8px; border-top:1px dashed var(--line);
    font-weight:600;
  }
  .guess-result .verdict.ok{color:var(--accent);}
  .guess-result .verdict.bad{color:var(--muted);}

  /* ---- win screen ---- */
  .win-card{
    text-align:center; padding:40px 26px;
  }
  .win-card .num{font-size:calc(64px * var(--font-scale)); color:var(--accent);}
  .win-card p{color:var(--muted); margin-top:6px;}
  .end-heading{
    font-family:var(--heading-font); font-weight:700; font-size:calc(42px * var(--font-scale));
    margin-bottom:4px;
  }
  .end-heading.won{ color:var(--correct); }
  .end-heading.lost{ color:var(--wrong); }
  .timeline.final-view{ gap:10px; }
  .win-stats{display:flex; justify-content:center; gap:26px; margin:22px 0; flex-wrap:wrap;}
  .win-stats div{text-align:center;}
  .win-stats .n{font-family:var(--heading-font); font-size:calc(24px * var(--font-scale));}
  .win-stats .l{font-size:calc(12px * var(--font-scale)); color:var(--muted);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-box{
    background:color-mix(in srgb, var(--panel) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; max-width:360px; width:100%;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .modal-box h3{font-size:calc(19px * var(--font-scale)); margin-bottom:8px;}
  .modal-box p{color:var(--muted); font-size:calc(14px * var(--font-scale)); line-height:1.5; margin:0 0 20px;}
  .modal-actions{display:flex; flex-direction:column; gap:10px;}
  .modal-actions button{width:100%;}

  .save-slot-list{display:flex; flex-direction:column; gap:10px;}
  .save-slot{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
    backdrop-filter:blur(var(--panel-blur)) saturate(150%);
    -webkit-backdrop-filter:blur(var(--panel-blur)) saturate(150%);
  }
  .slot-title{font-family:var(--heading-font); font-size:calc(16px * var(--font-scale));}
  .slot-meta{font-size:calc(12px * var(--font-scale)); color:var(--muted); margin-top:2px;}
  .slot-actions{display:flex; gap:8px; flex:none;}

  .top-links{display:flex; justify-content:space-between; width:100%; max-width:760px; margin-bottom:6px;}
  .top-links button{background:none;border:none;color:var(--muted);font-size:calc(13px * var(--font-scale));padding:6px 0;}
  .top-links button:hover{color:var(--accent);}

  @media (max-width:480px){
    .brand h1{font-size:calc(32px * var(--font-scale));}
    .vinyl-wrap{width:120px;height:120px;}
  }

  /* ---- Schriftgröße (skaliert alle Schrift in px/rem über --font-scale) ---- */
  :root{ --font-scale:1; }
  html{ font-size:calc(16px * var(--font-scale)); }

  /* ---- Zeitlimit pro Zug ---- */
  .turn-timer{ width:min(300px, 80vw); display:flex; align-items:center; gap:10px; font-size:calc(13px * var(--font-scale)); color:var(--muted); }
  .turn-timer .bar{ flex:1; height:6px; border-radius:999px; background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); overflow:hidden; }
  .turn-timer .fill{ height:100%; width:100%; background:var(--accent); transition:width .25s linear; }
  .turn-timer .time{ font-family:var(--heading-font); min-width:3.4ch; text-align:right; color:var(--text); }
  .turn-timer.low .fill{ background:var(--wrong); }
  .turn-timer.low .time{ color:var(--wrong); }

  /* ---- Statistiken ---- */
  .stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-tile{ background:color-mix(in srgb, var(--panel-2) var(--panel-a, 100%), transparent); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; text-align:center; }
  .stat-tile .n{ font-family:var(--heading-font); font-size:calc(26px * var(--font-scale)); color:var(--accent); }
  .stat-tile .l{ font-size:calc(12px * var(--font-scale)); color:var(--muted); margin-top:2px; }
  .stats-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:calc(14px * var(--font-scale)); }
  .stats-row:last-child{ border-bottom:none; }
  .stats-row span{ color:var(--muted); }
  .stats-note{ font-size:calc(12px * var(--font-scale)); color:var(--muted); line-height:1.5; margin-top:12px; }

  /* ---- Barrierefreiheit: Animationen reduzieren ---- */
  html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after{
    transition:none !important;
    animation-duration:.001ms !important; animation-delay:0s !important; animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
  /* Der 30-s-Fortschrittsbalken im Fallback-Player ist eine Information, keine Dekoration */
  html.reduce-motion .preview-bar.running .fill{
    animation:fillbar 30s linear forwards !important; animation-iteration-count:1 !important;
  }
  html.reduce-motion .vinyl.spin{ animation:none !important; }
  html.reduce-motion #app.fade-in{ animation:none !important; }
  html.reduce-motion #cursor-glow{ display:none !important; }

  /* ---- Barrierefreiheit: Hoher Kontrast ---- */
  html.high-contrast{
    --muted: color-mix(in srgb, var(--text) 88%, var(--bg)) !important;
    --line: color-mix(in srgb, var(--text) 70%, var(--bg)) !important;
    --panel: color-mix(in srgb, var(--bg) 92%, var(--text)) !important;
    --panel-2: color-mix(in srgb, var(--bg) 85%, var(--text)) !important;
    --panel-blur: 0px !important;
    --body-weight: 500 !important;
  }
  html.high-contrast body{ text-shadow:none !important; }
  html.high-contrast a{ text-decoration:underline; }
  html.high-contrast :is(button, select, input, .menu-card, .modal-box, .card, .stat, .stat-tile, .save-slot, .theme-swatch, .guess-box){
    border-color:var(--text) !important;
  }
  html.high-contrast :focus-visible{ outline:3px solid var(--accent) !important; outline-offset:2px; }

  /* ---- Barrierefreiheit: Farbenblind-freundlich (Blau/Orange statt Grün/Rot + Symbole) ---- */
  html.cb-safe{ --correct:#3da5f4 !important; --wrong:#f08a00 !important; }
  html.cb-safe .feedback.ok::before{ content:"✓ "; }
  html.cb-safe .feedback.bad::before{ content:"✕ "; }
  html.cb-safe .card .tag.ok::before{ content:"✓ "; }
  html.cb-safe .card .tag.bad::before{ content:"✕ "; }
  html.cb-safe .card .tag.ok, html.cb-safe .card .tag.bad{ color:#0b0b0b !important; }
  html.cb-safe .card.correct{ outline-style:solid; }
  html.cb-safe .card.wrong{ outline-style:dashed; }

  /* ---- Online-Multiplayer ---- */
  .net-chips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
  .net-chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); font-size:12px; color:var(--muted); }
  .net-chip::before, .net-dot{ content:""; width:8px; height:8px; border-radius:50%; background:var(--correct); display:inline-block; flex:none; }
  .net-chip.off::before, .net-dot.off{ background:var(--wrong); }
  .net-chip.active{ border-color:var(--accent); color:var(--text); }
  .net-wait{ margin-top:10px; padding:8px 12px; border:1px dashed var(--wrong); border-radius:var(--radius); font-size:13px; text-align:center; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .lobby-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:15px; }
  .lobby-row:last-child{ border-bottom:none; }
  .lobby-name{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .lobby-name small{ color:var(--muted); }
  .pw-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; font-size:14px; }

  /* Spielermenü-Griff: button:active (scale) überschrieb translateY(-50%) -> Griff sprang beim Klicken weg, der Klick ging verloren */
  .drawer-handle:active{ transform:translateY(-50%) scale(.96); }

  /* NRC: Tipp-/Klick-Welle */
  .tap-ripple{
    position:fixed; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; pointer-events:none; z-index:9999;
    border:2px solid var(--accent);
    box-shadow:0 0 16px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent);
    animation:tapRipple .7s ease-out both;
  }
  .tap-ripple.second{ animation-name:tapRipple2; animation-delay:.12s; }
  @keyframes tapRipple{ 0%{ transform:scale(.3); opacity:.95; } 100%{ transform:scale(5.5); opacity:0; } }
  @keyframes tapRipple2{ 0%{ transform:scale(.3); opacity:.6; } 100%{ transform:scale(8); opacity:0; } }

  /* ---- Chronohit!-Ruf (Einspruch) ---- */
  .ch-box{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:12px; padding:12px 14px; border:1px dashed var(--accent); border-radius:var(--radius); width:100%; }
  .ch-title{ font-family:var(--heading-font); font-size:18px; color:var(--accent); }
  .ch-banner{ font-size:16px; }
  .ch-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .ch-marker{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-size:20px; color:var(--accent); pointer-events:none; }
  .ch-result{ margin-top:8px; padding:8px 12px; border-radius:var(--radius); border:1px solid var(--line); font-size:14px; text-align:center; }
  .ch-result.ok{ color:var(--correct); border-color:var(--correct); }
  .ch-result.bad{ color:var(--wrong); border-color:var(--wrong); }
  .autosave-toast{ position:fixed; right:14px; bottom:14px; z-index:9999; padding:8px 12px; border-radius:10px; background:var(--panel, #222); color:var(--text, #fff); border:1px solid var(--line, rgba(255,255,255,.2)); font-size:calc(13px * var(--font-scale)); pointer-events:none; animation:asFade 1.9s ease forwards; }
  @keyframes asFade{ 0%{opacity:0; transform:translateY(6px)} 12%{opacity:.96; transform:none} 80%{opacity:.96} 100%{opacity:0} }
  html.reduce-motion .autosave-toast{ animation:none; }
  @media (hover:hover) and (pointer:fine){
    select.dropdown{ color-scheme:normal; }
    select.dropdown option, select.dropdown optgroup{ background-color:var(--bg); color:var(--text); }
  }
  :root[data-theme="terminal"]{
    --bg:#030b05; --bg-2:#000000; --bg-highlight:#0b2514; --panel:#07160b; --panel-2:#0c2213;
    --text:#7dff9b; --muted:#3fae5c; --accent:#7dff9b; --accent-ink:#021006;
    --correct:#7dff9b; --wrong:#ff6b5e; --line:#1c5a2e; --card-face:#0a2012; --ink:#7dff9b;
    --heading-font: 'VT323', 'IBM Plex Mono', monospace; --body-font: 'IBM Plex Mono', monospace; --radius: 3px; --body-bg-image: none;
  }
  .theme-swatch[data-theme-preview="terminal"] .theme-dots span:nth-child(1){ background:#030b05; }
  .theme-swatch[data-theme-preview="terminal"] .theme-dots span:nth-child(2){ background:#07160b; }
  .theme-swatch[data-theme-preview="terminal"] .theme-dots span:nth-child(3){ background:#7dff9b; }

  @keyframes reactStill{ 0%{ opacity:0 } 15%{ opacity:1 } 80%{ opacity:1 } 100%{ opacity:0 } }

// Doppelt erfasste Songs (gleicher Titel + gleicher Interpret) nur einmal verwenden
function dedupeSongs(list){
  const seen = new Set();
  const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g, "");
  return list.filter(s => {
    const key = norm(s.t) + "|" + norm(s.a).slice(0, 6);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

    if(!raw){
      for(const k of LEGACY_SAVE_KEYS){
        const old = localStorage.getItem(k);
        if(old){ raw = old; localStorage.setItem(SAVE_KEY, old); localStorage.removeItem(k); break; }
      }
    }
    raw = raw || memorySave;
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    try{ return memorySave ? JSON.parse(memorySave) : null; }catch(_){ return null; }
  }
}

/* ============ TITEL/INTERPRET-PRÜFUNG ============
   Großzügiger Vergleich statt exaktem Textabgleich: Groß-/Kleinschreibung,
   Akzente, Umlaut-Schreibweisen (ue/ae/oe), Satzzeichen, Artikel und
   Feature-Zusätze werden ignoriert; danach erlaubt eine Levenshtein-Distanz
   echte Tippfehler. "enrike iglesias" zählt also als richtig.
*/
function normText(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[&+]/g," ")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\b(feat|ft|featuring|with|vs|and|und|et|y|n|x|the|der|die|das|el|la|los)\b/g," ")
    .replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")
    .replace(/\s+/g," ")
    .trim();
}

function levenshtein(a,b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let prev = new Array(n+1), cur = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j] = j;
  for(let i=1;i<=m;i++){
    cur[0] = i;
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    const tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}

function withinTolerance(a,b){
  const L = Math.max(a.length, b.length);
  // je länger der Text, desto mehr Tippfehler sind erlaubt (max. 4)
  const tol = L <= 4 ? 1 : Math.min(4, Math.max(2, Math.floor(L * 0.25)));
  return levenshtein(a,b) <= tol;
}

function fuzzyEq(a,b){
  if(!a || !b) return false;
  if(a === b) return true;
  if(withinTolerance(a,b)) return true;
  // Anfang genügt, wenn er lang genug ist: "Atemlos" für
  // "Atemlos durch die Nacht".
  const short = a.length <= b.length ? a : b;
  const long  = a.length <= b.length ? b : a;
  if(short.length >= 6 && short.length >= long.length * 0.35){
    if(withinTolerance(short, long.slice(0, short.length))) return true;
  }
  return false;
}

function titleVariants(t){
  const raw = new Set([t]);
  raw.add(t.replace(/\(.*?\)/g," "));           // "Waka Waka (This Time...)" -> "Waka Waka"
  const inside = t.match(/\((.*?)\)/);
  if(inside) raw.add(inside[1]);
  raw.add(t.split(/\s[-–]\s/)[0]);
  raw.add(t.replace(/^[.\s]+/,""));             // "...Baby One More Time"
  return [...raw].map(normText).filter(Boolean);
}

function artistVariants(a){
  const raw = new Set([a]);
  a.replace(/\(.*?\)/g," ")
   .split(/\s*(?:feat\.|ft\.|featuring|&|,|\bx\b|\bund\b)\s*/i)
   .forEach(p => {
     p = p.trim();
     if(!p) return;
     raw.add(p);
     // Nachname allein reicht: "Grönemeyer" statt "Herbert Grönemeyer"
     const words = p.split(/\s+/);
     if(words.length > 1){
       const last = words[words.length-1];
       if(last.length >= 4) raw.add(last);
     }
   });
  return [...raw].map(normText).filter(Boolean);
}

function fuzzyMatch(input, variants){
  const a = normText(input);
  if(!a) return false;
  return variants.some(v => fuzzyEq(a, v));
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ============ SONGAUSWAHL: SPRACHE, GENRE, JAHRZEHNT, KATEGORIE ============
   Innerhalb einer Gruppe genügt EIN Treffer (ODER): ein Song, der Pop UND Rock ist,
   ist dabei, sobald eines von beiden aktiv ist. Zwischen den Gruppen müssen alle
   passen (UND). Songs ohne besondere Kategorie zählen zu "Sonstige". */
const LANG_DEFS = [
  { key:"de", label:"Deutsch" }, { key:"en", label:"Englisch" }, { key:"es", label:"Spanisch" }
];
const STYLE_DEFS = [
  { key:"pop", label:"Pop" }, { key:"rock", label:"Rock" }, { key:"indie", label:"Indie/Alternative" },
  { key:"hiphop", label:"Rap/Hip-Hop" }, { key:"rnb", label:"R&B/Soul" }, { key:"dance", label:"Dance/Electro" },
  { key:"funk", label:"Disco/Funk" }, { key:"latin", label:"Latin" }, { key:"reggae", label:"Reggae/Dancehall" },
  { key:"country", label:"Country/Folk" }, { key:"jazz", label:"Jazz/Blues" }, { key:"schlager", label:"Schlager" }
];
const THEME_DEFS = [
  { key:"film", label:"Film & TV" }, { key:"ballad", label:"Balladen" }, { key:"sport", label:"Sport & WM" },
  { key:"esc", label:"Eurovision" }, { key:"xmas", label:"Weihnachten" }, { key:"ndw", label:"Neue Deutsche Welle" },
  { key:"klassik", label:"Klassik" }, { key:"other", label:"Sonstige" }
];
function decadeOf(y){ return Math.floor(y / 10) * 10; }
function decadeLabel(d){ return d >= 2000 ? `${d}er` : `${String(d).slice(2)}er`; }
function songThemes(song){ return (song.c && song.c.length) ? song.c : ["other"]; }

// Welche Optionen gibt es überhaupt (mit Anzahl)? Leere Gruppen werden in der Oberfläche ausgeblendet.
function buildLibraryStats(){
  const count = (defs, getKeys) => defs.map(d => ({ ...d, count: SONGS.filter(s => getKeys(s).includes(d.key)).length })).filter(d => d.count > 0);
  const decades = [...new Set(SONGS.map(s => decadeOf(s.y)))].sort((a, b) => a - b)
    .map(d => ({ key:String(d), label:decadeLabel(d), count: SONGS.filter(s => decadeOf(s.y) === d).length }));
  return {
    langs:   count(LANG_DEFS,  s => songLangs(s)),
    styles:  count(STYLE_DEFS, s => s.s || []),
    themes:  count(THEME_DEFS, s => songThemes(s)),
    decades
  };
}
const LIB = buildLibraryStats();

// f: { genres:{de:true,...} (Sprachen), styles|decades|themes: Array oder null = alle }
function songMatches(song, f){
  if(f.genres && !songLangs(song).some(l => f.genres[l])) return false;
  if(f.styles && !(song.s || []).some(k => f.styles.includes(k))) return false;
  if(f.decades && !f.decades.map(Number).includes(decadeOf(song.y))) return false;
  if(f.themes && !songThemes(song).some(k => f.themes.includes(k))) return false;
  return true;
}
function filteredPool(settings){
  const s = settings || state.settings;
  return SONGS.filter(song => songMatches(song, s));
}

function spotifySearchUrl(song){
  const q = encodeURIComponent(`${song.t} ${song.a}`);
  return `https://open.spotify.com/search/${q}`;
}

      correctCount: 0,

    wrongCount: 0,
